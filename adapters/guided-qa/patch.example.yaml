# Example answer-patch for `interview.mjs apply`.
# Applied to example-draft/ it closes all three open todos:
#   node tools/interview.mjs example-draft apply adapters/guided-qa/patch.example.yaml --scaffold
# (copy example-draft first if you want to keep it pristine)

requirements:
  - id: REQ-002                       # existing requirement — adds an AC to it
    acceptance:
      - id: AC-002
        ears: "When a request targets a known short code, the system shall respond 302 to the original URL."
        test: "verification/acceptance/REQ-002.feature#known-code-redirects"

tests:                                # set a test on an already-existing AC
  AC-001: "verification/acceptance/REQ-001.feature#valid-url-shortened"

tasks:
  - id: TSK-001
    title: "Implement create path (201 + code)"
    satisfies: [AC-001]
    touches: [CMP-001]
  - id: TSK-002
    title: "Implement resolve path (302 redirect)"
    satisfies: [AC-002]
    touches: [CMP-001]
    depends_on: [TSK-001]

layers:                               # placed into verification/architecture-rules.yaml
  presentation: [CMP-001]
