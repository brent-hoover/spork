# Declared module boundaries, checked against real imports by the stack's
# arch command:
#   go run github.com/arch-go/arch-go@v1.7.0
#
# Package layout mirrors module names with hyphens dropped: one package
# directory per module (dev-loop -> devloop, review-bridge -> reviewbridge,
# tracker-client -> trackerclient).
#
# THIS FILE DELIBERATELY DIVERGES FROM avspec's may_import, in one
# direction only. avspec can describe modules and the edges between them;
# it has no concept of a package that is not a module. Seven such packages
# exist here — cmd/kriya (composition root), agent, specverify, clock,
# recovery, fakes, and acceptance — and arch-go requires 100% package
# coverage,
# so they must appear. Module-to-module edges still match avspec exactly.
# Logged in feature-work/kriya-build/spec-gaps.md.
#
# EVERY RULE IS AN ALLOWLIST, with no denylist left in the file. An empty
# shouldOnlyDependsOn is treated as UNCONSTRAINED and passes silently, and
# a bare "**" pattern panics arch-go v1.7.0 (spiked 2026-08-06).
# internal/clock may import nothing at all, so it allows a SENTINEL pattern
# matching no package — the only form that is both enforcing and stable
# under extension. A denylist there would fail OPEN: any package added
# later is absent from it and therefore permitted.
#
# arch-go v1.7.0 has NO build-tag flag, so import edges inside the
# acceptance-tagged harness are unchecked. The harness is test-only and
# imported by nothing, which bounds the exposure without removing it.
#
# That uniformity is deliberate and it closes a hole. The two idioms
# behave differently under extension: adding a new package silently
# FORBIDS it everywhere allowlists are used, and silently PERMITS it
# everywhere the complement form is used. The original file used the
# complement form for six modules, so half the boundaries failed open to
# any package added later. They now fail closed, clock included.
#
# Patterns match the LEAF package per module ("**.gates", not
# "**.gates.**") — add descendant patterns only if subpackages appear.
# "**.kriya" is cmd/kriya; the module root holds no .go files of its own.
#
# clock is allowed almost everywhere because nearly every module owns a
# timestamped entity and time.Now is banned outside internal/clock.
# agent is allowed only to planner, orchestrator, devloop, architect, and
# owner — the PM, SA, PO, and dev invocation sites. specverify is allowed
# only to planner, which performs intake.
version: 1
dependenciesRules:
  - package: "**.planner"
    shouldOnlyDependsOn:
      internal:
        - "**.trackerclient"
        - "**.agent"
        - "**.specverify"
        - "**.clock"
  - package: "**.orchestrator"
    shouldOnlyDependsOn:
      internal:
        - "**.planner"
        - "**.workspace"
        - "**.devloop"
        - "**.gates"
        - "**.owner"
        - "**.trackerclient"
        - "**.agent"
        - "**.clock"
  - package: "**.workspace"
    shouldOnlyDependsOn:
      internal:
        - "**.clock"
  - package: "**.devloop"
    shouldOnlyDependsOn:
      internal:
        - "**.context"
        - "**.reviewbridge"
        - "**.architect"
        - "**.agent"
        - "**.clock"
  - package: "**.reviewbridge"
    shouldOnlyDependsOn:
      internal:
        - "**.clock"
  - package: "**.gates"
    shouldOnlyDependsOn:
      internal:
        - "**.clock"
  - package: "**.architect"
    shouldOnlyDependsOn:
      internal:
        - "**.agent"
        - "**.clock"
  - package: "**.owner"
    shouldOnlyDependsOn:
      internal:
        - "**.agent"
        - "**.clock"
  - package: "**.context"
    shouldOnlyDependsOn:
      internal:
        - "**.trackerclient"
        - "**.clock"
  - package: "**.trackerclient"
    shouldOnlyDependsOn:
      internal:
        - "**.clock"
  - package: "**.cli"
    shouldOnlyDependsOn:
      internal:
        - "**.planner"
        - "**.orchestrator"
        - "**.context"
        - "**.clock"
  - package: "**.tui"
    shouldOnlyDependsOn:
      internal:
        - "**.orchestrator"
        - "**.architect"
        - "**.reviewbridge"
        - "**.clock"
  - package: "**.agent"
    shouldOnlyDependsOn:
      internal:
        - "**.clock"
  - package: "**.specverify"
    shouldOnlyDependsOn:
      internal:
        - "**.clock"
  - package: "**.clock"
    # clock may import nothing internal. An EMPTY shouldOnlyDependsOn is
    # treated as unconstrained and passes silently, and a denylist here
    # would fail OPEN — any package added later is absent from it and thus
    # permitted. A non-empty allowlist naming a pattern that matches no
    # package is the only form that is both enforcing and stable under
    # extension: clock passes while importing nothing, and fails the moment
    # it imports anything.
    shouldOnlyDependsOn:
      internal:
        - "**.__no_internal_imports__"
  - package: "**.recovery"
    shouldOnlyDependsOn:
      internal:
        - "**.planner"
        - "**.workspace"
        - "**.devloop"
        - "**.orchestrator"
        - "**.reviewbridge"
        - "**.clock"
  - package: "**.fakes"
    shouldOnlyDependsOn:
      internal:
        - "**.clock"
  - package: "**.acceptance"
    shouldOnlyDependsOn:
      internal:
        - "**.fakes"
        - "**.planner"
        - "**.orchestrator"
        - "**.workspace"
        - "**.devloop"
        - "**.reviewbridge"
        - "**.gates"
        - "**.architect"
        - "**.owner"
        - "**.context"
        - "**.trackerclient"
        - "**.cli"
        - "**.tui"
        - "**.agent"
        - "**.specverify"
        - "**.clock"
        - "**.recovery"
  - package: "**.kriya"
    shouldOnlyDependsOn:
      internal:
        - "**.planner"
        - "**.orchestrator"
        - "**.workspace"
        - "**.devloop"
        - "**.reviewbridge"
        - "**.gates"
        - "**.architect"
        - "**.owner"
        - "**.context"
        - "**.trackerclient"
        - "**.cli"
        - "**.tui"
        - "**.agent"
        - "**.specverify"
        - "**.clock"
        - "**.recovery"
