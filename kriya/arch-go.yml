# Declared module boundaries (avspec.yaml modules[].boundaries.may_import)
# checked against real imports by the stack's arch command:
#   go run github.com/arch-go/arch-go@v1.7.0
# Package layout mirrors module names with hyphens dropped: one package
# directory per module (dev-loop -> devloop, review-bridge -> reviewbridge,
# tracker-client -> trackerclient).
# A module may import only the packages listed in its shouldOnlyDependsOn
# rule (its own package is always allowed). Modules whose may_import is
# EMPTY use shouldNotDependsOn with the explicit complement of every other
# module — spiked 2026-08-06: an empty shouldOnlyDependsOn allowlist is
# treated as UNCONSTRAINED (silent pass) and a bare "**" pattern panics
# arch-go v1.7.0, so the complement idiom is the only enforcing form.
# Patterns match the LEAF package per module ("**.issues", not
# "**.issues.**") — add descendant patterns only if subpackages appear.
version: 1
dependenciesRules:
  - package: "**.planner"
    shouldOnlyDependsOn:
      internal:
        - "**.trackerclient"
  - package: "**.orchestrator"
    shouldOnlyDependsOn:
      internal:
        - "**.planner"
        - "**.workspace"
        - "**.devloop"
        - "**.gates"
        - "**.owner"
        - "**.trackerclient"
  - package: "**.workspace"
    shouldNotDependsOn:
      internal:
        - "**.planner"
        - "**.orchestrator"
        - "**.devloop"
        - "**.reviewbridge"
        - "**.gates"
        - "**.architect"
        - "**.owner"
        - "**.context"
        - "**.trackerclient"
        - "**.cli"
        - "**.tui"
  - package: "**.devloop"
    shouldOnlyDependsOn:
      internal:
        - "**.context"
        - "**.reviewbridge"
        - "**.architect"
  - package: "**.reviewbridge"
    shouldNotDependsOn:
      internal:
        - "**.planner"
        - "**.orchestrator"
        - "**.workspace"
        - "**.devloop"
        - "**.gates"
        - "**.architect"
        - "**.owner"
        - "**.context"
        - "**.trackerclient"
        - "**.cli"
        - "**.tui"
  - package: "**.gates"
    shouldNotDependsOn:
      internal:
        - "**.planner"
        - "**.orchestrator"
        - "**.workspace"
        - "**.devloop"
        - "**.reviewbridge"
        - "**.architect"
        - "**.owner"
        - "**.context"
        - "**.trackerclient"
        - "**.cli"
        - "**.tui"
  - package: "**.architect"
    shouldNotDependsOn:
      internal:
        - "**.planner"
        - "**.orchestrator"
        - "**.workspace"
        - "**.devloop"
        - "**.reviewbridge"
        - "**.gates"
        - "**.owner"
        - "**.context"
        - "**.trackerclient"
        - "**.cli"
        - "**.tui"
  - package: "**.owner"
    shouldNotDependsOn:
      internal:
        - "**.planner"
        - "**.orchestrator"
        - "**.workspace"
        - "**.devloop"
        - "**.reviewbridge"
        - "**.gates"
        - "**.architect"
        - "**.context"
        - "**.trackerclient"
        - "**.cli"
        - "**.tui"
  - package: "**.context"
    shouldOnlyDependsOn:
      internal:
        - "**.trackerclient"
  - package: "**.trackerclient"
    shouldNotDependsOn:
      internal:
        - "**.planner"
        - "**.orchestrator"
        - "**.workspace"
        - "**.devloop"
        - "**.reviewbridge"
        - "**.gates"
        - "**.architect"
        - "**.owner"
        - "**.context"
        - "**.cli"
        - "**.tui"
  - package: "**.cli"
    shouldOnlyDependsOn:
      internal:
        - "**.planner"
        - "**.orchestrator"
        - "**.context"
  - package: "**.tui"
    shouldOnlyDependsOn:
      internal:
        - "**.orchestrator"
        - "**.architect"
        - "**.reviewbridge"
