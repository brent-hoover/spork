avspec: "0.3"

project:
  name: kriya
  description: >-
    The build engine of spork. Takes a ready avspec, decomposes it into
    tracer-bullet tickets in sutra (BDD acceptance criteria on every
    ticket), and drives coding agents through a pair-programming loop —
    small commits, continuous review, fix, recommit — then mutation
    testing, product-owner validation, and a sutra Review for human
    approval. Loops until the app is complete. Kriya: Sanskrit, a
    deliberate, practiced sequence of actions.
  stack:
    languages: [{ name: python, version: "3.13" }]
    package_manager: uv
    bdd: pytest-bdd
    commands:
      install: uv sync
      test: uv run pytest
      lint: uv run ruff check .
      typecheck: uv run ty check
      arch: uv run lint-imports  # enforces the declared may_import boundaries in code
      coverage: uv run pytest --cov=kriya --cov-branch --cov-fail-under=100  # 100% branch = no uncovered conditional arm (REQ-gate-branch-coverage)
      mutation: uv run pytest-gremlins  # R2 open — the spike validates incremental per-ticket speed; invocation may be amended
  status: ready

constitution:
  - id: CON-test-first
    statement: No behavior is implemented before the test mapped to its acceptance criterion exists and fails.
  - id: CON-dependency-flow
    statement: Dependencies flow one way between layers; no back-edges.
  - id: CON-no-secrets
    statement: No secrets in source; configuration is injected at runtime.
  - id: CON-idempotent-mutations
    statement: Mutating operations are idempotent; agents retry aggressively and replays must be safe.
  - id: CON-pair-programming
    statement: Work moves in small commits with review latency measured in minutes, not as end-stage pull requests.
  - id: CON-gate-chain
    statement: "The gate chain is inviolable and no agent may skip a stage: review pass -> test, structure, typing, architecture, and branch-coverage gates -> mutation testing -> product-owner validation -> sutra Review approval -> merge. The chain governs code deliverables; research and spike tickets carry a DOCUMENT deliverable and traverse the research path instead — documented finding -> document Review -> human approval -> close — with no code gates to skip because none apply."
  - id: CON-role-separation
    statement: The system architect never writes code; the coding agent never decides scope; scope decisions escalate to the operator; the product owner alone holds the big picture.
  - id: CON-buy-over-build
    statement: Solved problems use existing, maintained tools — reviews are roborev itself, not a reimplementation, exactly as tests use an existing test framework.
  - id: CON-deterministic-orchestrator
    statement: >-
      The orchestrator is a deterministic state machine — it sequences the
      gate chain from an explicit state table and delegates all judgment to
      the agent modules. If a change requires the orchestrator to decide
      anything, the change is wrong. (Prior art: in earlier attempts the
      orchestrator became a god module; the state table and the structural
      lint limits are the correction.)
  - id: CON-risk-first
    statement: Planning orders work by risk; a risk item is validated by research or a spike before anything that depends on it is built, so we never code ourselves into a corner.

# Story-phase coverage checklist (accumulated from range reviews — these
# protocol branches need ACs and scenarios when kriya's requirements get
# their stories): plan-head retries in each plan state (pending resumes,
# active completes, awaiting-operator preserved); queued-pop-to-build
# reconciliation before ownership classification; retirement of pending
# vs issued steps including id-less rows and the deferred-status fence;
# carried-forward pop race: ticket claimed mid-supersession and listed by
# both plans binds to the predecessor snapshot (deepest unstamped row),
# and binding SETS and retains the consumed stamp on walked-past rows so
# a later reopen binds to the head;
# per-module command semantics: complete and partial module stack
# overrides, blank effective commands, missing required commands, and
# recovery reading snapshot-pinned resolved commands rather than the
# mutable working tree;
# post-retirement reopen: a ticket carried into the current head binds
# the head; a ticket the successor OMITTED binds the nearest consumed
# row's plan and its snapshot (the decomposition that produced its ACs),
# never the head that dropped it; pop write-ahead refusal while any head
# is unactivated (global fence), and retry after activation.
#
# Risk register — validated before kriya's own build begins:
#   R1 (RETIRED 2026-08-04 by spike + session-long live use): roborev is
#       drivable as-is — enqueue (review), poll (show), respond (comment),
#       and close were all exercised programmatically throughout the spec
#       sessions. Spike facts: enqueue accepts NO caller correlation key,
#       and duplicate jobs for the same SHA ARE possible (no dedupe); but
#       `list` exposes jobs by SHA and `cancel` exists. Final protocol
#       (see ENT-review-round): kriya acts ONLY on ids recorded from its
#       own enqueue returns — no adoption, no cancellation of unproven
#       jobs; rare crash-window orphans are surfaced in the TUI.
#   R2: Can mutation testing (pytest-gremlins-class) run incrementally per
#       ticket at acceptable speed, or only as a slower periodic gate?
#   R3 (RETIRED 2026-08-04 by spike): gobco detects uncovered arms but
#       exits 0; wrapped with an awk check it gates correctly (exit 1 on
#       any uncovered arm). The validated compound command is pinned in
#       sutra's stack: gobco writes to a TMPDIR file removed with exit
#       status preserved, && carries tool failure, and awk requires the
#       coverage summary — POSIX sh, no pipefail (all modes spike-tested). R1's spike subsequently confirmed the
#       recovery constraints; the final protocol lives on ENT-review-round.

requirements:
  - id: REQ-spec-intake
    title: Consume a ready avspec — verify it, refuse anything less
    rationale: >-
      Ready means buildable without further prompting; kriya holds the spec
      to its own claim, and additionally requires that EVERY module's
      effective stack (its per-field override where present, the project
      stack otherwise) carries non-empty test, lint, typecheck, arch,
      coverage, and mutation commands — the gate chain runs per module with these
      resolved commands, which are persisted into the SpecSnapshot at
      pin time so builds and recovery execute exactly what intake
      validated.
    acceptance:
      - id: AC-intake-ready
        statement: Pointing kriya at a project whose avspec verifies status ready with zero errors and zero todo findings succeeds; a SpecSnapshot is pinned containing the full artifact set and every module's resolved effective commands.
        test: verification/REQ-spec-intake.feature#ready spec is pinned
      - id: AC-intake-refuse
        statement: A project that verifies draft, or with any error or todo finding, is refused with the verify findings; no snapshot is pinned and nothing is enqueued.
        test: verification/REQ-spec-intake.feature#draft spec is refused
      - id: AC-intake-commands
        statement: A module whose effective stack (module override where present, project stack otherwise) is missing or blank on any of test, lint, typecheck, arch, coverage, or mutation is refused, naming the module and the missing command — even when avspec verify alone reports ready.
        test: verification/REQ-spec-intake.feature#missing module command refuses intake
      - id: AC-intake-snapshot-authority
        statement: Working-tree edits to the spec never change what a build or recovery executes; both read the bound snapshot's pinned artifacts and resolved commands. A spec change enters the pipeline only through a new intake.
        test: verification/REQ-spec-intake.feature#working tree edits do not change a pinned build
      - id: AC-intake-reintake
        statement: Intake of an amended ready spec for a project with an existing snapshot pins a new snapshot — prior snapshots stay immutable and referenced by their builds — and hands it to decomposition through the supersession path, not a fresh start.
        test: verification/REQ-spec-intake.feature#amended spec pins a new snapshot
  - id: REQ-decompose
    title: PM agent decomposes the spec into tracer-bullet tickets in sutra
    rationale: Thin end-to-end slices first; BDD acceptance criteria on every ticket; blocks/blocked-by wired for parallelism.
    acceptance:
      - id: AC-decompose-tracer
        statement: Implementation tickets are thin end-to-end slices; spike and research tickets are exempt, and the walking skeleton is the first implementation ticket workable once blocking risks retire. Every ticket carries BDD acceptance criteria traceable to the snapshot's REQ/AC ids.
        test: verification/REQ-decompose.feature#tracer bullets carry traceable acceptance criteria
      - id: AC-decompose-epic
        statement: Decomposition ensures an umbrella epic per build target exists — created write-ahead and idempotently through the durable BuildTarget row, which records the epic id — and parents every created ticket under it; the epic persists across supersessions with no re-parenting and closes only through the approved build-completion review when the build completes.
        test: verification/REQ-decompose.feature#one epic umbrellas the build target
      - id: AC-decompose-relations
        statement: blocks/blocked-by relations are wired — spike and risk tickets block their dependents, independent tickets stay unblocked for parallel work.
        test: verification/REQ-decompose.feature#relations wire risk ordering and parallelism
      - id: AC-decompose-phased
        statement: Decomposition runs in plan-wide phases — create all tickets, wire relations, assign last — with barriers between phases so no ticket is workable before its relations exist; completed is stamped only after the final barrier.
        test: verification/REQ-decompose.feature#phases run behind plan-wide barriers
      - id: AC-decompose-idempotent
        statement: "Every request resolves its decomposition key against existing plans before any PlanHead logic, and the resolution is state-aware: active-without-completed resumes remaining phases, pending resumes, completed and superseded return the historical result, awaiting-operator is preserved untouched, and a plan in terminal historical returns that terminal result with no mutation — never re-exposed as retryable."
        test: verification/REQ-decompose.feature#same-key retries are state-aware
      - id: AC-decompose-supersede
        statement: Decomposing against an existing head atomically creates a superseding candidate — predecessor pointed at the head it beat, head marked superseded, fence incremented, PlanHead moved with a generation bump — then retires the predecessor, stamping every predecessor row consumed with its state-appropriate disposition — retired, carried-forward, bound, or completed — before the new plan activates.
        test: verification/REQ-decompose.feature#supersession retires the predecessor before activating
      - id: AC-decompose-retirement
        statement: Retirement distinguishes pending from issued work — pending tickets are retired in sutra via conditional transitions whose expected status is the freshly observed unfinished status, open or blocked, with generation-scoped defer keys, an already-deferred fresh read counts as fence established with no retry, and rows whose ticket was never created retire with no sutra call. Retired tickets rest deferred under the shared epic, and sutra's close gate does not count deferred children, so retired work never blocks build completion.
        test: verification/REQ-decompose.feature#retirement distinguishes pending from issued work
      - id: AC-decompose-operator-recovery
        statement: "Each awaiting-operator state has a defined forward-only recovery: an unactivated head restores to pending with predecessor-row resets and retirement resumes; an activated head restores to active with ticket-row states recomputed from step progress; a parked non-head candidate retries by re-entering the replacement CAS, repointing its predecessor to the head it beats — offered only while generation-eligible, an outrun candidate transitioning durably to terminal historical instead."
        test: verification/REQ-decompose.feature#every parked state recovers forward
  - id: REQ-risk-first
    title: Risk items are identified and retired first via spike/research tickets
    rationale: Risk and spike labels plus blocking relations ensure nothing dependent starts before its risk is retired.
    acceptance:
      - id: AC-risk-identify
        statement: Decomposition creates a spike/research ticket per identified risk, labeled with the risk/spike convention, blocking every ticket that depends on the risk's answer.
        test: verification/REQ-risk-first.feature#each risk becomes a blocking spike
      - id: AC-risk-order
        statement: "The ordering guarantee is scoped to the plan's own tickets: the assignment phase assigns every spike before any implementation ticket, so among a plan's workable tickets a spike pops ahead of the plan's implementation work under sutra's FIFO; pre-existing assignments from other plans may pop between them, which is safe because they do not depend on this plan's risks — and work that DOES depend on a risk is blocked by relation regardless, so queue position alone can never start it early. No tracker-side priority is assumed."
        test: verification/REQ-risk-first.feature#spikes surface ahead of ordinary work
      - id: AC-risk-retire
        statement: "A spike closes through sutra's own gate — its documented finding is submitted as a document-deliverable Review on the spike ticket, and approval closes the spike and unblocks dependents; the risk is retired by approved evidence, not assertion. A changes-requested verdict returns the run to its research loop: the revised finding is a new document version under a fresh revision-scoped doc key, and the resubmission rides the same write-ahead resubmitting machinery as code reviews — the run never rests in finding-submitted with a rejected review."
        test: verification/REQ-risk-first.feature#a finding retires the risk and unblocks dependents
      - id: AC-risk-escalate
        statement: A spike whose finding invalidates the planned approach does not let dependent work proceed; it escalates to the operator, its own run takes the write-ahead cancellation protocol — cancelling recorded, the spike ticket conditionally deferred (never open), then the terminal cancelled state — BEFORE any supersession, so retirement classifies it as released work rather than issued work that will finish, and the remedy is the amended-spec path — re-intake and supersession, never a silent workaround.
        test: verification/REQ-risk-first.feature#an invalidating finding escalates instead of proceeding
  - id: REQ-parallel-build
    title: Pop tickets off sutra work stacks and run parallel dev agents where relations allow
    acceptance:
      - id: AC-pop-parallel
        statement: Agents pop only unblocked tickets; tickets with no relation between them run concurrently, each in its own BuildRun; sutra's conditional claim guarantees no ticket is in two runs.
        test: verification/REQ-parallel-build.feature#independent tickets build in parallel
      - id: AC-pop-write-ahead
        statement: Every pop durably writes its BuildRun record before any side effect; a claimed-but-unbound pop discovered later is bound by replaying the binding rules — no orphaned claims.
        test: verification/REQ-parallel-build.feature#pops are written ahead and never orphaned
      - id: AC-pop-fence
        statement: While any head plan is unactivated, admission is refused by the global pop fence via a CAS write, never a read-assert; once the head activates, a retried pop succeeds.
        test: verification/REQ-parallel-build.feature#the pop fence holds until activation
      - id: AC-pop-binding
        statement: "A popped ticket binds by the state-aware precedence algorithm: the deepest unstamped superseded row mid-retirement; the nearest predecessor row while the head is unactivated (an unactivated head never binds); the activated head's own row; a ticket living only in consumed rows binds the nearest consumed row's plan — the decomposition that produced its ACs, never a head that omitted it. Binding stamps every walked-past row."
        test: verification/REQ-parallel-build.feature#binding follows the state-aware precedence
      - id: AC-pop-reconcile
        statement: "Recovery reconciles every queued BuildRun with an unfilled ticket by pop replay before any ownership classification: a replay returning the claimed ticket binds it as issued work, while a replay proving no claim occurred transitions the row to no-work — an in-flight claim is never misclassified, and an empty pop is never invented into work."
        test: verification/REQ-parallel-build.feature#queued pops reconcile before classification
  - id: REQ-workspaces
    title: Isolated workspace (worktree/branch) per ticket
    acceptance:
      - id: AC-workspace-isolated
        statement: Starting a BuildRun creates a dedicated worktree on a RUN-SCOPED branch — named by ticket and run — cut from the project's default branch; concurrent runs never share a working tree, one run's uncommitted state is invisible to every other, and a later run for the same reopened or carried-forward ticket gets its own branch and worktree, never colliding with a predecessor's preserved, quarantined branch.
        test: verification/REQ-workspaces.feature#each run gets an isolated worktree
      - id: AC-workspace-recorded
        statement: The workspace's deterministic path, branch, and base commit are persisted in a pending state BEFORE the worktree is created and flipped to created transactionally after, so recovery can always locate a run's work, verify its base, and adopt or recreate a crash-window worktree — none is ever undiscoverable.
        test: verification/REQ-workspaces.feature#the workspace is durably recorded
      - id: AC-workspace-resume
        statement: A resumed BuildRun reattaches to its existing workspace and branch when they exist and match the record; it never silently starts a second workspace for the same run.
        test: verification/REQ-workspaces.feature#a resumed run reattaches to its workspace
      - id: AC-workspace-cleanup
        statement: Workspaces are removed only after their ticket completes or is terminally retired; removal never deletes unmerged commits — the branch survives until merge or explicit operator disposal — and a worktree with uncommitted changes refuses cleanup, recording the cause on the Workspace row for the operator inbox while the run's terminal state stays untouched.
        test: verification/REQ-workspaces.feature#cleanup never loses unmerged work
  - id: REQ-pair-loop
    title: Pair-programming loop — small commits, roborev reviews, fix, recommit until pass
    rationale: Kriya drives the actual roborev tool (enqueue on commit, poll verdicts, respond, close) per CON-buy-over-build.
    acceptance:
      - id: AC-pair-small-commits
        statement: Work moves in small commits; each commit enqueues a roborev round through the write-ahead ReviewRound protocol — never one end-stage review.
        test: verification/REQ-pair-loop.feature#every commit gets its own review round
      - id: AC-pair-fix-loop
        statement: A round returning findings hands them to the dev agent, which fixes and recommits; the new commit starts a new round; the loop repeats until the branch head passes clean.
        test: verification/REQ-pair-loop.feature#findings are fixed and recommitted until clean
      - id: AC-pair-own-jobs
        statement: Kriya acts only on job ids recorded from its own enqueue returns — it never adopts, responds to, cancels, or closes a job it cannot prove it created; expired claims go to the operator per the claim-generation protocol, never auto-reclaimed.
        test: verification/REQ-pair-loop.feature#only provably owned jobs are touched
      - id: AC-pair-pass-gate
        statement: The loop exits only on a clean review of the current branch head within the current gate attempt; a pass on an earlier commit — or from a prior attempt, even at the same commit — does not count; the pass is recorded as the round's pass verdict at the head commit and attempt, the durable ReviewRound record the gate chain reads.
        test: verification/REQ-pair-loop.feature#the exit is a clean pass on the head
      - id: AC-pair-trail
        statement: Before a round closes, kriya records its response on the job — comment, then close — through the round's write-ahead response lifecycle; a crash between the two re-issues the additive comment and completes the close, so the full conversation survives and no round is left open.
        test: verification/REQ-pair-loop.feature#the review trail is complete
  - id: REQ-sa-agent
    title: System architect agent resolves impasses and escalates scope to the operator
    rationale: Highest-tier agent; writes no code; the escape valve when dev and review cannot converge.
    acceptance:
      - id: AC-sa-impasse
        statement: "The impasse trigger is deterministic: a per-run round limit — snapshotted onto the BuildRun at creation, so config changes and restarts never move a live run's threshold — counts consecutive finding-bearing rounds since the last clean pass, and reaching the limit — or the dev agent declaring an impasse — pauses the run and hands the SA agent the findings history, the ticket's ACs, and the bound snapshot. A clean pass resets the counter; the limit lives in configuration beside tier routing."
        test: verification/REQ-sa-agent.feature#an impasse pauses the run and reaches the architect
      - id: AC-sa-no-code
        statement: The SA resolves by direction, recorded on a durable run-scoped Intervention row — trigger, findings handed over, direction, lifecycle state — which resume and recovery read; its toolset carries no workspace-mutation tools, and the worktree contents and branch head are unchanged across its invocation.
        test: verification/REQ-sa-agent.feature#the architect directs but never codes
      - id: AC-sa-scope
        statement: "A resolution that would change scope — a ticket's ACs or the spec itself — is never decided below the operator; the SA escalates naming the change. An approved spec change first cancels the paused run write-ahead: cancelling is recorded durably, the sutra ticket is conditionally transitioned out of in-progress to DEFERRED — never to open, so no agent can pop the obsolete ticket in the window before the supersession fence exists — and only then is the run stamped cancelled — terminal, never resuming, merging, or resubmitting; retirement and supersession classify a cancelled run's ticket as released work, never as issued work that will finish. Then the change takes the amended-spec path of re-intake and supersession, never a side channel."
        test: verification/REQ-sa-agent.feature#scope changes escalate to the operator
      - id: AC-sa-resume
        statement: After direction the run resumes the pair loop with the SA's guidance in context; the Intervention row preserves the trigger, direction, and eventual outcome through resume, restart, and recovery.
        test: verification/REQ-sa-agent.feature#direction resumes the loop and survives in history
  - id: REQ-context-assembly
    title: Context manager assembles each dev agent's context and toolset per ticket
    acceptance:
      - id: AC-context-assembled
        statement: Starting a run assembles the dev agent's context from the bound snapshot — the ticket's ACs and the touched modules' boundaries, contracts, and constitution — never a whole-spec dump.
        test: verification/REQ-context-assembly.feature#context is assembled from the bound snapshot
      - id: AC-context-instructions
        statement: The context includes the operator's hand-crafted project instructions (a CLAUDE.md-style file) and kriya's process playbook — how to drive roborev, the pair-loop protocol, commit conventions — alongside the spec-derived material.
        test: verification/REQ-context-assembly.feature#hand-crafted instructions ride along
      - id: AC-context-scoped
        statement: "Modules outside the ticket's boundary set appear only as their contracts: the agent sees the interfaces it may call, not internals it may not import."
        test: verification/REQ-context-assembly.feature#out-of-boundary modules appear as contracts only
      - id: AC-context-tools
        statement: The toolset is per ticket — the touched modules' snapshot-resolved commands are wired in; tools irrelevant to the ticket are absent.
        test: verification/REQ-context-assembly.feature#the toolset matches the ticket
      - id: AC-context-learnings
        statement: Persistent learnings matching the ticket's modules and failure patterns are injected into the context.
        test: verification/REQ-context-assembly.feature#relevant learnings are injected
      - id: AC-context-recorded
        statement: What the agent was given is recorded durably on the run, so a reviewer can reconstruct exactly what the agent knew when it acted.
        test: verification/REQ-context-assembly.feature#the assembled context is recorded
  - id: REQ-learning-loop
    title: Mistakes become persistent learnings fed into future builds
    rationale: Project-specific and cross-project; captured as they happen, not post-mortem.
    acceptance:
      - id: AC-learn-capture
        statement: A learning is captured at the moment of correction — a review finding fixed, a gate failure diagnosed, an SA direction, a PO rejection — stating what went wrong and how to avoid it, tagged with module and failure pattern; never reconstructed post-mortem.
        test: verification/REQ-learning-loop.feature#learnings are captured at the moment of correction
      - id: AC-learn-manual
        statement: The operator can add learnings by hand at any time, with the same scoping and tagging as captured ones; manual learnings are first-class and indistinguishable to the feed-forward path.
        test: verification/REQ-learning-loop.feature#the operator adds learnings by hand
      - id: AC-learn-scoped
        statement: Every learning carries its scope, project-specific or cross-project, and persists durably beyond the run and the build that produced it.
        test: verification/REQ-learning-loop.feature#learnings outlive their build
      - id: AC-learn-fed-forward
        statement: A learning captured in one run is injected into the next run whose ticket matches its module or pattern — including runs in a later build for cross-project learnings.
        test: verification/REQ-learning-loop.feature#learnings feed the next matching run
      - id: AC-learn-provenance
        statement: "Every learning records where it came from: the run, the finding or event that produced it, and its trigger anchor — the triggering commit for code-backed corrections, the finding document version for research-backed ones — or the operator, for manual entries."
        test: verification/REQ-learning-loop.feature#every learning knows its origin
  - id: REQ-gate-structure
    title: Structural linting with hard limits on the target app, via each module's effective lint command
    rationale: Google-style-guide strictness — max module size and kin; agents love god modules and do not mind strict rules.
    acceptance:
      - id: AC-structure-per-module
        statement: The gate runs each touched module's snapshot-resolved lint command at the run's head commit; any nonzero exit fails the gate for that module.
        test: verification/REQ-gate-structure.feature#the lint command runs per touched module
      - id: AC-structure-hard-fail
        statement: "Structural findings are hard failures: no waiver at gate time — the remedy is code, or an operator-approved config change in the target project, which is a spec amendment and re-intake. A result from an older commit never satisfies the gate."
        test: verification/REQ-gate-structure.feature#structural findings cannot be waived
      - id: AC-structure-arch
        statement: The declared architecture command runs as its own commit-pinned gate per touched module — declared boundaries checked against real imports; a violation fails the gate, results upsert as GateResults, and a stale pass never satisfies the chain.
        test: verification/REQ-gate-structure.feature#the arch gate checks real imports
      - id: AC-structure-feedback
        statement: A failure hands the tool's findings back to the dev agent and the loop continues; pass or fail, the result is upserted as a GateResult with detail, so reruns never duplicate.
        test: verification/REQ-gate-structure.feature#failures feed back and results upsert
  - id: REQ-gate-typing
    title: Typing everywhere on the target app
    rationale: Runs each module's effective typecheck command.
    acceptance:
      - id: AC-typing-per-module
        statement: The gate runs each touched module's snapshot-resolved typecheck command at the run's head commit; any nonzero exit fails that module's gate.
        test: verification/REQ-gate-typing.feature#the typecheck command runs per touched module
      - id: AC-typing-recorded
        statement: Results are upserted as GateResults pinned to the commit; a stale pass never satisfies the chain, and failures return the tool's output to the dev agent.
        test: verification/REQ-gate-typing.feature#typing results pin to the commit
  - id: REQ-gate-branch-coverage
    title: Branch coverage — every conditional arm, not an overall percentage
    rationale: Runs each module's effective coverage command; targets where any module's effective stack omits it are rejected at spec intake.
    acceptance:
      - id: AC-coverage-every-arm
        statement: The gate runs each touched module's snapshot-resolved coverage command at the head commit and fails on any uncovered conditional arm; there is no threshold to slip under.
        test: verification/REQ-gate-branch-coverage.feature#any uncovered arm fails the gate
      - id: AC-coverage-tests-pass
        statement: The module's test command is its own commit-pinned gate and a prerequisite — coverage is judged only over a passing suite, and a failing test fails the chain regardless of coverage.
        test: verification/REQ-gate-branch-coverage.feature#tests must pass before coverage is judged
      - id: AC-coverage-recorded
        statement: Results upsert as GateResults pinned to the commit, uncovered arms named in detail for the dev agent; stale passes never satisfy the chain.
        test: verification/REQ-gate-branch-coverage.feature#coverage results pin to the commit
  - id: REQ-gate-mutation
    title: Mutation testing proves the tests test
    rationale: Runs each module's effective mutation command; targets where any module's effective stack omits it are rejected at spec intake.
    acceptance:
      - id: AC-mutation-after-review
        statement: Mutation runs only after the review, test, structure, typing, arch, and branch-coverage gates have all passed at the same head commit, executing each touched module's snapshot-resolved mutation command.
        test: verification/REQ-gate-mutation.feature#mutation waits for the review pass
      - id: AC-mutation-kill-all
        statement: Any surviving mutant fails the gate; survivors are returned to the dev agent as named test gaps to kill, and results upsert as GateResults pinned to the commit.
        test: verification/REQ-gate-mutation.feature#surviving mutants are named test gaps
  - id: REQ-po-validation
    title: Product owner agent validates ACs are genuinely satisfied and tests are not gaming
    rationale: The PO holds the big picture the coding agent cannot have.
    acceptance:
      - id: AC-po-position
        statement: PO validation runs only after every machine gate — review, test, structure, typing, arch, branch-coverage, mutation — passed at the head commit; it cannot be skipped or reordered.
        test: verification/REQ-po-validation.feature#the PO validates after review and mutation
      - id: AC-po-genuine
        statement: "The PO checks every AC on the ticket against actual behavior: each AC has a test that genuinely exercises it, and the implementation satisfies the AC's intent — in the context of the whole spec, which only the PO holds."
        test: verification/REQ-po-validation.feature#every AC is checked against real behavior
      - id: AC-po-anti-gaming
        statement: The PO hunts gaming explicitly — tautological assertions, implementations special-casing test inputs, weakened or deleted assertions — and a gaming finding fails validation naming the evidence.
        test: verification/REQ-po-validation.feature#gaming fails validation with evidence
      - id: AC-po-verdict
        statement: "The verdict is durable: pass advances the run to review submission; fail returns the findings to the dev agent and the pair loop resumes. Either way the verdict and its reasons survive in the run's history."
        test: verification/REQ-po-validation.feature#the verdict is durable and actionable
  - id: REQ-submit-review
    title: Submit a sutra Review, merge on approval, update ticket status
    acceptance:
      - id: AC-submit-create
        statement: After the PO pass, kriya records a submission key scoped to the head commit AND the gate attempt with a write-ahead submitting state, then creates a sutra Review naming the ticket's branch pinned at the head commit, stamped with the run's session id, and records the returned id as submitted; a crash on either side of sutra's acceptance recovers by replaying the persisted request under the same idempotency key — sutra returns the original review if the request landed and creates it otherwise, exactly one either way — and the run then waits on review events.
        test: verification/REQ-submit-review.feature#a PO pass becomes a sutra Review
      - id: AC-submit-gated-diff
        statement: Every code submission and resubmission carries expected_default_head and expected_base_commit equal to the run's frozen gated_base, so sutra atomically rejects anything whose diff was not gated — a moved default head and a stale-based branch alike — before any review, submission, or event exists.
        test: verification/REQ-submit-review.feature#sutra rejects any ungated submission
      - id: AC-submit-rework
        statement: "A changes-requested event routes the feedback back to the run — the same agent instance where possible, via the session id; the pair loop resumes, and resubmission happens only after the full gate chain — review, test, structure, typing, architecture, branch coverage, mutation, and PO validation — passes again at the new head commit, and it is write-ahead: the resubmitting state, its idempotency key, expected revision, answered verdict event, and pinned commit persist transactionally before sutra's resubmit call, recovery replays under the same key on either side of acceptance, and the revision increments exactly once."
        test: verification/REQ-submit-review.feature#rework routes back by session
      - id: AC-submit-merge
        statement: "An approval event is a signal, not an authority, and merges are SERIALIZED per target through the durable merge queue — MergeAttempt rows ordered by arrival, the head holding BuildTarget.merge_lock; only the lock holder proceeds. Inside the critical section kriya first PREFLIGHTS: the branch head must still equal the approved revision's pinned commit, the default-branch head must still equal the gated_base the run's chain ran against, the reviewed diff must be exactly what the chain gated — enforced ATOMICALLY BY SUTRA at submission: every code submission and resubmission carries BOTH expected_default_head = the frozen gated_base (the default branch must not have moved — the merge base alone is no proxy, a fast-forwarded default keeps the old one) AND expected_base_commit = the frozen gated_base (the branch must actually be based on what the gates ran against — a stale-based branch passes the head check while its diff base was never gated), both derived from the durable gated_base so replay reproduces them, and a mismatch on either rejects 409 with no review, submission, or event ever existing, so nothing ungated can reach a human; the preflight recheck of head, base, and conflict-freedom is defense in depth, so an ABA move of the default branch cannot slip a differently-based reviewed diff past the gates — (a mismatch on either means the combined result was never gated — the run integrates the current base, reruns the full chain, and submits a fresh review instead), and the deterministic merge result must be conflict-free. Only a clean preflight atomically CONSUMES the approval through sutra — conditional on state approved at the expected current revision AND naming the persisted approval event as the expected verdict event, so sutra rejects it if any later verdict superseded that event, durably fencing any later verdict change — and the merge then commits under a CAS on the default-branch head — a moved head means unreviewed commits exist, so nothing merges and the mismatch surfaces; what merges is that immutable pinned commit, never the mutable branch reference, so a branch advancing mid-merge cannot change what lands; the merge happens exactly once, and a replayed or duplicate event never double-merges; a reversal landing before consumption fails the consumption and nothing merges. A CAS failure after consumption — an out-of-band push inside the window — never strands the run: the consumed approval stays spent in history, and the run takes the same integrate-rerun-fresh-review path, so consumption is never a dead end."
        test: verification/REQ-submit-review.feature#approval merges exactly once
      - id: AC-submit-complete
        statement: "After a successful merge kriya quiesces the branch's only in-protocol writer — the run's dev session is terminated before the check — then re-reads the branch head before completing: a head still equal to the merged commit completes the ticket through sutra NAMING the merged review, its approved revision, and its approval's verdict event (all from the merge attempt) as the close's authorizer (sutra stamps it close-used; a stale revision rejects; the merge-time consumption never blocks it), and the workspace becomes eligible for cleanup; a head that moved past the merged commit means unreviewed commits landed — the run returns to the pair loop instead of completing, and once the gates pass again the new head is submitted as a FRESH review durably recorded on the run (sutra forbids resubmitting an approved review; the consumed one stays in history), so no work is stranded on a terminal run. The completed head commit is durably recorded, and an out-of-band advance observed after completion is detected against that record and surfaces to the operator with sutra's reopen path."
        test: verification/REQ-submit-review.feature#merge completes the ticket through sutra
  - id: REQ-run-to-complete
    title: Loop until every ticket of the spec is complete
    acceptance:
      - id: AC-complete-loop
        statement: Kriya keeps popping and building while workable tickets remain under the current head plan; when everything is blocked or in flight it idles and resumes as tickets unblock — it never exits early.
        test: verification/REQ-run-to-complete.feature#the loop runs until nothing is workable
      - id: AC-complete-defn
        statement: "Completion detection arms only once the activated head plan bears its completed stamp — decomposition's final assignment barrier has passed, so the ticket set is whole, and a mid-phase plan can never present an empty or partial set as done — and it counts ALL target-scoped work, attributed deterministically and in precedence order: epic parentage first, then plan membership, then a durable BuildRun binding (target_spec persisted at bind — a detached, previously bound unplanned ticket keeps its target), then, in a single-mapping project, the mapping's target for every remainder; only in a MULTI-mapping project is an active ticket with none of these AMBIGUOUS — completion detection refuses to arm for every target of that project, the ambiguity persists as an AttributionAmbiguity row the inbox lists in every unresolved state — open, resolving, or conflicting, with the observed parent and cause when attribution failed — and the operator resolves it by parenting the ticket under an epic through the attribution action, or reselects a conflicting one — so kriya neither completes past unattributed work nor silently blocks unrelated targets forever. Mapped unplanned tickets are parented under the epic at bind time and block completion while open or in flight, and a ticket detached from the epic still counts through its target scope, the detach itself having advanced the subtree revision that fences any in-flight claim. When that plan's every ticket is complete and no other target-scoped ticket is open, in progress, or blocked — resolved through the live tracker queue and the mappings, bound or not — kriya submits a build-completion review on the umbrella epic — a completion-report document as the deliverable, satisfying sutra's approved-review close gate; on approval the epic closes and completion is stamped on the BuildTarget row. The claim records the review's id and revision and the completion epoch it was earned under — the epoch advances on every supersession and every event that reopens the epic: a ticket reopening, deferred work activating, or an active subtree attached — and the stamp is a CAS against that epoch still being current, with ticket completion revalidated before the close: a delayed approval from an older epoch surfaces instead of stamping. A later supersession or a reopened ticket advances the epoch and clears the stamp as its event is consumed; in the window before consumption sutra is already authoritative — the reopen cascade has reopened the epic server-side — so anything gating on completion trusts the stamp only while sutra's current subtree revision still equals completion_closed_revision — the post-close revision recorded atomically with the stamp (the close itself increments the revision, so the pre-close precondition value would mismatch immediately). When the stamp is untrusted, completion is NEVER reported from current state alone — a detached ticket can reopen AND recomplete before its events are consumed, leaving the epic complete with no visible active work while the old approval is stale. The fallback reads the live state WITH its atomically captured feed_watermark and first processes the event stream through that watermark — sutra guarantees every event that could have affected the returned state precedes it — so the pending reopen is consumed, the epoch advances, and the stale claim dies; only a stamp re-validated after that reconciliation, or a fresh completion earned afterward, reports done. Completion is a claim about the current head as of its recorded revision, never history."
        test: verification/REQ-run-to-complete.feature#completion is the head plan done and the epic closable
      - id: AC-complete-supersede
        statement: A supersession mid-build moves the loop's horizon to the new head's ticket set; completion is always judged against the current head, never a superseded plan.
        test: verification/REQ-run-to-complete.feature#supersession moves the finish line
      - id: AC-complete-active-work
        statement: Completion detection counts every active target-scoped ticket — open, in progress, or blocked, resolved through the live tracker queue and mappings whether bound or not — and any of them prevents an attempt from starting.
        test: verification/REQ-run-to-complete.feature#a blocked unplanned ticket blocks completion
      - id: AC-complete-detached-reopen
        statement: A reopen whose cascade verification shows the epic unreached — a ticket detached after the close — takes the explicit durable keyed reopen, so the epic never stays complete while kriya's stamp clears.
        test: verification/REQ-run-to-complete.feature#a reopened detached ticket still reopens the epic
      - id: AC-complete-drained
        statement: An untrusted completion stamp never reports done from current state — the fallback reads live state with its atomically captured feed watermark and processes the feed through it first, so pending revision-advancing events, a detached reopen-and-recomplete included, are consumed before any completion verdict.
        test: verification/REQ-run-to-complete.feature#a detached reopen-and-recomplete cannot slip a stale completion
      - id: AC-complete-new-work
        statement: Kriya keeps consuming project work events after a target completes — a new active issue attributing to a completed target advances its epoch, clears the stamp, and parents the ticket under the epic, whose attachment cascade reopens it.
        test: verification/REQ-run-to-complete.feature#new work created after completion wakes the target
      - id: AC-complete-parenting-recovery
        statement: A crash before the new-work attachment lands is recovered by keyed replay, correlation, and the atomic parented-plus-verification stamp — exactly one attachment ever exists.
        test: verification/REQ-run-to-complete.feature#a parenting crash before the attachment recovers exactly once
      - id: AC-complete-parenting-reconciliation
        statement: A crash after the attachment lands but before reconciliation recovers through the keyed replay's original response and completes the verification stamp in one transaction; a conflicting replay re-reads parentage — accepting the desired parent, surfacing a different one, retrying a transient conflict under a fresh key.
        test: verification/REQ-run-to-complete.feature#a parenting crash after the relation lands recovers the verification
      - id: AC-complete-ambiguous-new-work
        statement: An ambiguous post-completion creation advances no epoch — the ambiguity record suppresses completion for every candidate target while open, resolving, conflicting, or adopted, releasing them only when it stamps resolved after the selected target's parenting, epoch advance, and cascade reconciliation complete — and resolution wakes only the selected target, the others resuming untouched.
        test: verification/REQ-run-to-complete.feature#an ambiguous post-completion creation suppresses without advancing
      - id: AC-complete-ambiguity-reopen
        statement: Reopening a resolved ambiguity atomically clears the prior resolution and rotates the resolution generation and key, so re-selecting even the same target issues a fresh mutation — a stale success from a since-removed relation can never resolve a new ambiguity.
        test: verification/REQ-run-to-complete.feature#a reopened ambiguity never replays a stale resolution
      - id: AC-complete-stall
        statement: When nothing is workable, nothing is in flight, and the epic still cannot close, a durable Stall row records the condition and its cause and surfaces in the operator inbox; resolution stamps it — never silent spinning, never a false done.
        test: verification/REQ-run-to-complete.feature#a stall surfaces with its cause
      - id: AC-complete-status
        statement: Build and run state — including the durable completion declaration — is inspectable from the CLI, machine-readably with --json, so agents and scripts can read kriya without the TUI.
        test: verification/REQ-run-to-complete.feature#state is inspectable from the CLI
  - id: REQ-tier-routing
    title: Model-tier routing is configuration, not hardcoded
    acceptance:
      - id: AC-tier-config
        statement: Every agent role — PM, SA, PO, dev — maps to a model tier in configuration; no model identifier is hardcoded in kriya's source.
        test: verification/REQ-tier-routing.feature#roles map to tiers in configuration
      - id: AC-tier-explicit
        statement: A role with no configured tier fails loudly at startup; there is no silent default.
        test: verification/REQ-tier-routing.feature#a missing tier fails loudly
      - id: AC-tier-observed
        statement: Changing the config changes the model a role uses on its next invocation with no code change, and every agent invocation — plan-scoped PM work included — records its role, the configured tier, and the resolved model that actually ran.
        test: verification/REQ-tier-routing.feature#config changes take effect and runs record models
  - id: REQ-thread-capture
    title: Dev-agent transcripts auto-import into sutra's thread catalog, session-stamped
    rationale: Auditability plus fuel for the learning loop.
    acceptance:
      - id: AC-thread-import
        statement: A run's dev-agent transcript auto-imports into sutra's thread catalog, stamped with the run's session id and tied to the ticket.
        test: verification/REQ-thread-capture.feature#transcripts land in the thread catalog
      - id: AC-thread-no-loss
        statement: Import happens for every run outcome — completed, retired, or crashed — and is write-ahead; the import key and immutable transcript reference persist before the call, recovery replays under the same key on either side of sutra's acceptance, and exactly one thread exists per session either way. A crashed DevSession is terminated by recovery — ended stamped, its transcript imported as-is — and a resumed run continues under a FRESH DevSession with its own session id, key, and eventual thread, so post-recovery conversation lands in the new session's thread and nothing is lost, duplicated, or overwritten.
        test: verification/REQ-thread-capture.feature#no outcome loses its transcript
      - id: AC-thread-searchable
        statement: The imported thread is reachable through sutra's session-id search alongside the reviews the same session produced.
        test: verification/REQ-thread-capture.feature#threads surface in session search
  - id: REQ-tui
    title: TUI overview — what is running now, what is queued, and where agents surface things to the operator
    rationale: The operator's most critical surface; escalations land here, not in a log file.
    acceptance:
      - id: AC-tui-overview
        statement: "The TUI shows live: running BuildRuns with their position in the gate chain, queued and blocked tickets, and runs waiting on human review."
        test: verification/REQ-tui.feature#one screen shows the build's live state
      - id: AC-tui-inbox
        statement: "Everything requiring the operator lands in one inbox with its cause: SA scope escalations, invalidating spike findings, awaiting-operator plans, awaiting-operator BuildRuns with their durable error cause — binding ambiguity, missing mappings, vanished worktrees — workspace cleanup refusals with their dirty state (from the Workspace row, the run's terminal state untouched), conflicting new-work parentage with the offending parent, expired review-round claims, unresolved enqueue attempts — pending ones and completed ones whose id is not their round's accepted external id — and unresolved orphans, and build stalls."
        test: verification/REQ-tui.feature#everything needing the operator lands in one inbox
      - id: AC-tui-act
        statement: "The protocol's operator actions are executable from the TUI, not just visible: restore or retry a parked plan, reconcile and reset a review round, resolve an enqueue attempt — stamping it resolved after the required liveness checks — attribute an ambiguous ticket by parenting it under a target's epic, resolve a conflicting new-work parentage with the choices its shown conflict kind makes valid — cede or reclaim for an other-parent conflict, retry-after-correction or dismiss for a permanent failure — and approve or reject an escalated scope change."
        test: verification/REQ-tui.feature#operator actions run from the TUI
      - id: AC-tui-truth
        statement: Drilling into a run shows its durable history — commits, rounds, gate results, verdicts, escalations — read from the same records recovery uses; the TUI holds no second source of truth.
        test: verification/REQ-tui.feature#the TUI reads the records recovery reads

modules:
  - id: MOD-planner
    name: planner
    responsibility: PM agent — spec intake, tracer-bullet decomposition, risk-first ticketing.
    owns: [ENT-plan, ENT-plan-head, ENT-planned-ticket, ENT-spec-mapping, ENT-spec-snapshot, ENT-pop-fence, ENT-build-target, ENT-intake-attempt, ENT-completion-advance]
    boundaries: { may_import: [MOD-tracker-client] }
  - id: MOD-orchestrator
    name: orchestrator
    responsibility: The outer loop as a deterministic state machine — pops tickets, advances BuildRun states from an explicit state table, delegates every stage; no judgment, no agent conversations.
    owns: [ENT-build-run, ENT-agent-invocation, ENT-stall, ENT-merge-attempt, ENT-attribution-ambiguity]
    boundaries: { may_import: [MOD-planner, MOD-workspace, MOD-dev-loop, MOD-gates, MOD-owner, MOD-tracker-client] }
  - id: MOD-workspace
    name: workspace
    responsibility: Worktree/branch lifecycle per ticket.
    owns: [ENT-workspace]
    boundaries: { may_import: [] }
  - id: MOD-dev-loop
    name: dev-loop
    responsibility: The heart — one pair-programming session; dev agent, commit cadence, fix rounds.
    owns: [ENT-dev-session]
    boundaries: { may_import: [MOD-context, MOD-review-bridge, MOD-architect] }
  - id: MOD-review-bridge
    name: review-bridge
    responsibility: The roborev seam — enqueue, poll verdicts, respond, close; buy-over-build boundary in one place.
    owns: [ENT-review-round, ENT-enqueue-attempt, ENT-orphan-observation]
    boundaries: { may_import: [] }
  - id: MOD-gates
    name: gates
    responsibility: Quality-gate runner — structural lint, typing, branch coverage, mutation testing via the target's stack commands.
    owns: [ENT-gate-result]
    boundaries: { may_import: [] }
  - id: MOD-architect
    name: architect
    responsibility: SA agent — impasse resolution and operator escalation; writes no code.
    owns: [ENT-escalation, ENT-intervention]
    boundaries: { may_import: [] }
  - id: MOD-owner
    name: owner
    responsibility: PO agent — AC validation, anti-gaming, vision.
    owns: [ENT-validation]
    boundaries: { may_import: [] }
  - id: MOD-context
    name: context
    responsibility: Context assembly per ticket and the learning store. Part of kriya for now; splits out only if ever used beyond spork.
    owns: [ENT-learning, ENT-context-bundle]
    boundaries: { may_import: [MOD-tracker-client] }
  - id: MOD-tracker-client
    name: tracker-client
    responsibility: The one module that speaks the issue tracker's API — sutra today, the seam where other trackers would plug in.
    boundaries: { may_import: [] }
  - id: MOD-cli
    name: cli
    responsibility: Command surface — start a build, inspect state, add operator learnings.
    boundaries: { may_import: [MOD-planner, MOD-orchestrator, MOD-context] }
    ui:
      kind: cli
      entry: VIEW-cli-build
      views:
        - id: VIEW-cli-build
          name: build
          invocation: kriya build <project>
          purpose: Start or resume a build — intake, decomposition, run to complete; a refusal prints the verify findings.
          navigates_to: [VIEW-cli-status, VIEW-cli-learn]
          satisfies: [AC-intake-refuse]
        - id: VIEW-cli-status
          name: status
          invocation: kriya status [--json]
          purpose: Inspect builds, runs, and gate positions; --json for agents.
          shows: [ENT-build-run.ticket, ENT-build-run.state, ENT-build-run.started, ENT-build-target.completed]
          satisfies: [AC-complete-status]
        - id: VIEW-cli-learn
          name: learn add
          invocation: kriya learn add
          purpose: The operator's manual-learning entry point — same scoping and tagging as captured learnings.
          satisfies: [AC-learn-manual]
  - id: MOD-tui
    name: tui
    responsibility: Operator dashboard — live overview of running and queued work; where agents surface questions, escalations, and the review bridge's persisted orphan watch.
    boundaries: { may_import: [MOD-orchestrator, MOD-architect, MOD-review-bridge] }
    ui:
      kind: tui
      entry: VIEW-tui-overview
      views:
        - id: VIEW-tui-overview
          name: Overview
          invocation: kriya tui
          purpose: What is running now with its gate-chain position, what is queued or blocked — the live tracker queue is the work universe, so unplanned tickets and reopened tickets living only in consumed history appear too, joined with PlannedTicket rows for plan metadata — and what waits on human review.
          shows: [ENT-build-run.ticket, ENT-build-run.state, ENT-build-run.identity, ENT-build-run.started, ENT-planned-ticket.ticket, ENT-planned-ticket.state]
          navigates_to: [VIEW-tui-inbox, VIEW-tui-run]
          satisfies: [AC-tui-overview]
        - id: VIEW-tui-inbox
          name: Inbox
          invocation: kriya tui (inbox pane)
          purpose: Everything requiring the operator, each with its cause — escalations, invalidating spikes, parked plans, expired claims and orphans, stalls.
          shows: [ENT-escalation.kind, ENT-escalation.question, ENT-plan.state, ENT-plan.error, ENT-planned-ticket.error, ENT-build-run.state, ENT-build-run.error, ENT-workspace.cleanup_error, ENT-review-round.enqueue_state, ENT-review-round.claimed_at, ENT-enqueue-attempt.round, ENT-enqueue-attempt.external_id, ENT-enqueue-attempt.created, ENT-enqueue-attempt.resolved, ENT-orphan-observation.external_id, ENT-orphan-observation.discovered, ENT-stall.cause, ENT-stall.state, ENT-attribution-ambiguity.ticket, ENT-attribution-ambiguity.state, ENT-attribution-ambiguity.resolution_error, ENT-attribution-ambiguity.observed_parent, ENT-attribution-ambiguity.reclaim_state, ENT-completion-advance.reclaim_state, ENT-completion-advance.parenting_state, ENT-completion-advance.conflict_kind, ENT-completion-advance.parenting_error]
          actions: [ACT-plan-restore, ACT-plan-retry, ACT-round-reconcile, ACT-attempt-resolve, ACT-ticket-attribute, ACT-parenting-resolve, ACT-scope-decide]
          navigates_to: [VIEW-tui-run]
          satisfies: [AC-tui-inbox, AC-tui-act]
        - id: VIEW-tui-run
          name: Run detail
          invocation: kriya tui (run pane)
          purpose: One run's durable history — commits, review rounds, gate results, verdicts, escalations — read from the records recovery uses.
          shows: [ENT-build-run.state, ENT-gate-result.gate, ENT-gate-result.passed, ENT-gate-result.commit, ENT-review-round.verdict, ENT-review-round.commit, ENT-validation.verdict, ENT-validation.commit, ENT-validation.notes, ENT-escalation.question]
          satisfies: [AC-tui-truth]
      actions:
        - id: ACT-plan-restore
          name: plan_restore
        - id: ACT-plan-retry
          name: plan_retry
        - id: ACT-round-reconcile
          name: round_reconcile
        - id: ACT-attempt-resolve
          name: attempt_resolve
        - id: ACT-ticket-attribute
          name: ticket_attribute
        - id: ACT-parenting-resolve
          name: parenting_resolve
        - id: ACT-scope-decide
          name: scope_decide

# Kriya's store is the observability plane: the TUI reads it live and it is
# the post-mortem record of every build. The ENTIRE store is durable across
# restarts; within it, the operational entities — those that drive
# behavior after a restart, not just explain it — are BuildRun (crash
# recovery), ReviewRound and EnqueueAttempt (the write-ahead review
# protocol), Plan, PlannedTicket, SpecSnapshot, and SpecMapping (the
# write-ahead decomposition and pinned-spec protocol), and Learning (the
# point of the exercise). Sutra remains the system of record
# for the work itself; tracker-side records are referenced by opaque ids.
data:
  entities:
    - id: ENT-planned-ticket
      name: PlannedTicket
      description: Write-ahead definition of one ticket of a decomposition — persisted before any tracker call so recovery can replay the exact request.
      fields:
        - { name: plan, type: ref, ref: ENT-plan, required: true }
        - { name: ordinal, type: integer, required: true }
        - { name: payload, type: json, required: true }  # the full ordered mutation sequence: create, labels, relations, assignment — executed under the plan-wide phase barrier; each step keyed by (idempotency_key, step ordinal) and carrying a durable step state (pending/issued/complete) updated transactionally around its call
        - { name: idempotency_key, type: string, required: true, unique: true }  # derived from (decomposition_key, ordinal)
        - { name: ticket, type: string }  # tracker id, filled from the creation return
        - { name: state, type: enum, required: true, values: [pending, in-progress, complete, awaiting-operator] }  # per-row progress through the phased sequence; failures land here durably
        - { name: error, type: string }  # what failed, for the operator; set with awaiting-operator
        - { name: defer_generation, type: integer, required: true }  # starts at 0 at row creation; durably incremented as its own atomic row update after each defer conflict-and-fresh-read, BEFORE the next attempt issues; scopes the defer idempotency key so a 409 retry never replays the cached conflict
        - { name: consumed, type: datetime }  # neutral consumption stamp written by a successor plan's retirement pass (or by the bind transaction for walked-past rows); a consumed row no longer participates in binding rule (1)
        - { name: disposition, type: enum, values: [retired, carried-forward, bound, completed] }  # written with consumed: retired = drained, unassigned, and deferred; carried-forward = unclaimed and re-listed by the successor; bound = a build had already bound this ticket (the build's own refs are authoritative); completed = the ticket was already done
    - id: ENT-spec-snapshot
      name: SpecSnapshot
      description: Content-addressed snapshot of the COMPLETE spec artifact set — the manifest plus every referenced verification feature file and contract document (equivalently, a pinned content tree) — stored when first pinned; builds and recovery read gate commands, ACs, scenarios, and contracts from here, never from the mutable working tree, so post-decomposition edits to any referenced file cannot change what a pinned build executes. Alongside the content it stores each module's RESOLVED effective commands (override-per-field over project stack), exactly as intake validated them. Snapshots are content-addressed and target-agnostic — the same hash is shared across targets and re-intakes — so the target-scoped intake generation deliberately does NOT live here; it lives on the mapping row and is copied onto each Plan.
      fields:
        - { name: hash, type: string, required: true, unique: true }
        - { name: content, type: json, required: true }
        - { name: resolved_commands, type: json, required: true }  # per-module effective commands (override-per-field over project stack), exactly as intake validated them
        - { name: created, type: datetime, required: true }
    - id: ENT-intake-attempt
      name: IntakeAttempt
      description: >-
        Write-ahead record of one intake invocation. The row — keyed by
        the request's client-supplied idempotency token — is inserted
        pending with the target and validated spec hash BEFORE a
        generation is allocated; the allocated generation is recorded on
        the row transactionally with the mapping upsert, and the row
        stamps applied when intake completes. The allocation itself is an atomic
        RESERVATION — a CAS increment on the mapping row's
        intake_generation (expected current value, write value+1),
        executed in the transaction that records the result on this
        attempt — so two overlapping, differently keyed intakes
        serialize through the CAS: the loser re-reads and reserves the
        next value, and no two attempts ever hold the same generation.
        Recovery under the SAME
        key resumes this attempt and reuses its recorded generation —
        a crash between mapping update and plan creation can never
        allocate a second generation or trigger a duplicate
        supersession — while a deliberate same-hash re-intake arrives
        under a NEW key and reserves the next generation. Plans copy
        intake_generation from the attempt that authorized them.
      fields:
        - { name: intake_key, type: string, required: true, unique: true }  # the intake request's idempotency token
        - { name: target_key, type: string, required: true }
        - { name: spec_hash, type: string, required: true }
        - { name: generation, type: integer }  # absent until allocated; recorded transactionally with the mapping upsert
        - { name: state, type: enum, required: true, values: [pending, applied] }
        - { name: created, type: datetime, required: true }
    - id: ENT-spec-mapping
      name: SpecMapping
      description: "The project-to-spec registry — operator-editable, the only trusted fallback for resolving an unplanned ticket's target spec. EVERY write — an intake pinning or refreshing, a plan seeding — is an UPSERT ordered by intake generation: the writer carries its target-scoped generation (intakes the one they allocate on the mapping row; plans the intake_generation copied onto them at decomposition — never anything read from the content-addressed, target-agnostic snapshot), a strictly newer generation wins the CAS, and an equal or older one is a no-op. Insert races resolve identically — a delayed older plan arriving after a newer intake inserted, or inserting first and being overwritten by it, converges on the newest generation either way, so no path can ever leave unplanned binds on a stale snapshot."
      fields:
        - { name: mapping_key, type: string, required: true, unique: true }  # derived hash of (project_key, normalized target_spec) — seeding upserts, so replanning the same spec never duplicates a row
        - { name: project_key, type: string, required: true }  # NOT unique — a project may hold several distinct specs; the fallback binds only when exactly one mapping exists
        - { name: target_spec, type: string, required: true }
        - { name: spec_hash, type: string, required: true }  # the intake-pinned snapshot for this mapping — the ONLY snapshot an unplanned bind may use; every write is the generation-ordered upsert described above
        - { name: intake_generation, type: integer, required: true }  # monotonic per target, allocated by intake; every mapping upsert carries its writer's generation and wins only when strictly newer — delayed older intakes and delayed older plan seeds are no-ops alike
        - { name: updated, type: datetime, required: true }
    - id: ENT-pop-fence
      name: PopFence
      description: >-
        The singleton durable row that serializes BuildRun admission
        with head transitions. Written ONLY by its owner, the planner:
        replacement increments unactivated_heads in the same
        transaction that moves the PlanHead; activation decrements it
        in its own atomic transaction — after retirement completes,
        when the pending head becomes active — never during head
        movement, which would admit pops before retirement ran. Each
        write bumps version. The orchestrator never writes it;
        the planner exposes an admission guard that the orchestrator
        invokes inside its BuildRun-creating transaction, and the guard
        WRITES: it CAS-increments version conditional on
        unactivated_heads == 0 and the version it read — a read-only
        assertion could still commit beside a concurrent replacement,
        so the guard's conditional write is what makes admission and
        any head transition genuine write-write conflicts on the same
        row, of which exactly one commits. Ownership is respected: the
        guard is planner code, so every fence write still happens in
        the planner; the orchestrator reaches the guard through its
        existing planner import.
      fields:
        - { name: singleton_key, type: string, required: true, unique: true }  # constant — exactly one row; bootstrap inserts it idempotently (the unique key makes the insert the CAS: a loser reads the existing row) with unactivated_heads 0 and version 0
        - { name: unactivated_heads, type: integer, required: true }  # initialized to 0 at bootstrap — no plan exists yet, so nothing is unactivated and admissions flow immediately
        - { name: version, type: integer, required: true }  # initialized to 0 at bootstrap; strictly increasing thereafter
    - id: ENT-plan-head
      name: PlanHead
      description: The single durable head per decomposition target — successor creation and activation move it by CAS, making the one-active-plan invariant enforceable rather than aspirational.
      fields:
        - { name: target_key, type: string, required: true, unique: true }  # derived from (project_key, normalized target_spec)
        - { name: current, type: ref, ref: ENT-plan, required: true }
        - { name: generation, type: integer, required: true }
        - { name: updated, type: datetime, required: true }
    - id: ENT-completion-advance
      name: CompletionAdvance
      description: >-
        Insert-once record of one consumed epoch-advancing event. The
        advancing transaction inserts it keyed by (target, event), so a
        replayed event — however stale, in whatever order — collides on
        the key and advances nothing: every event is consumed at most
        once, a valid completion is never cleared twice, and the cause
        needed to recover an explicit reopen is never overwritten.
      fields:
        - { name: advance_key, type: string, required: true, unique: true }  # deterministic per (target_key, event id)
        - { name: target_key, type: string, required: true }
        - { name: event, type: string, required: true }
        - { name: cause, type: enum, required: true, values: [supersession, ticket-reopen, deferred-activation, subtree-attachment, detachment, new-work, compensation] }
        - { name: operation, type: string }  # the server transaction id correlated during cascade verification — the evidence the check ran against
        - { name: ticket, type: string }  # new-work advances — the created ticket this advance must parent
        - { name: relation_key, type: string }  # new-work advances — deterministic Idempotency-Key of the parenting mutation, derived per (advance, parenting_generation) and UPDATED IN THE SAME TRANSACTION that advances the generation — the pair moves together or not at all, so a crash between them cannot leave recovery replaying a cached-conflict key
        - { name: parenting_generation, type: integer }  # init 0; a transient conflict advances it durably BEFORE retrying, so the retry issues under the next generation's key — the write-ahead rotation that escapes a cached 409
        - { name: conflict_kind, type: enum, values: [other-parent, permanent-failure] }  # recorded when entering conflicting — it selects the valid resolutions: cede/reclaim for other-parent, retry-after-correction/dismiss for permanent-failure
        - { name: parenting_error, type: string }  # the offending parent or permanent failure cause — what the inbox displays
        - { name: reclaim_relation, type: string }  # RECLAIM — the conflicting relation id recorded with the operator's choice, before any call
        - { name: reclaim_generation, type: integer }  # RECLAIM — init 0; the removal key derives from (advance, reclaim_generation), and the pair rotates atomically on retry-after-correction AND whenever reclaim_relation changes under fresh authorization — a cached result for a previous relation can never replay against a newly authorized one
        - { name: reclaim_removal_key, type: string }  # RECLAIM — Idempotency-Key of the removal mutation, derived per (advance, reclaim_generation) and updated in the same transaction; recovery replays it
        - { name: reclaim_state, type: enum, values: [pending, failed, removed] }  # RECLAIM — write-ahead around the removal; failed is the operator-visible unrecoverable outcome with its cause recorded in parenting_error and the state shown by the inbox; correction rotates the generation and returns the state to pending, and the advance returns to pending attachment only after removed
        - { name: parenting_state, type: enum, values: [pending, parented, conflicting, ceded, dismissed] }  # conflicting is the awaiting-operator condition — conflict_kind records whether a different parent holds the ticket or the attachment failed permanently; ceded is terminal (other-parent: the ticket counts for the target that holds it); dismissed is terminal (permanent-failure: the attachment is abandoned, but the ticket STILL blocks completion through attribution until handled out-of-band — dismissal hides nothing);  # new-work advances — written pending with the advance and held pending THROUGH cascade verification: parented is stamped only in the same transaction that records operation, cascade_verified, and (when unreached) reopen_owed, so recovery resuming every pending row always re-runs the keyed attachment replay AND the correlation — a crash at any point before the atomic stamp can never lose the explicit-reopen obligation or strand a detached ticket. A CONFLICT on the attachment replay is resolved by re-reading the ticket's parentage: the desired parent already in place means a concurrent actor parented it — stamp parented with cascade_verified external and no reopen owed (operation deliberately absent; sutra's attach invariant carried the cascade), satisfying the same atomic-stamp contract; a DIFFERENT parent transitions parenting_state to conflicting with the offending parent recorded in parenting_error — an inbox item the operator resolves; a parentless conflict is CLASSIFIED by its recorded cause: a concurrency race is transient — parenting_generation and relation_key rotate atomically in one transaction and the retry issues under the fresh key — while a permanent condition (an ancestry cycle, an archived project) transitions to conflicting with conflict_kind permanent-failure and the error details in parenting_error, never retried blindly — its resolutions are RETRY-AFTER-CORRECTION (the operator fixes the underlying condition, the action rotates the generation and returns the advance to pending) or terminal DISMISS, which abandons the attachment while the ticket keeps blocking completion through attribution; a pending advance can never sit permanently behind a cached 409 or spin forever on a permanent failure. The operator resolves a conflicting advance through the parenting-resolution action, itself crash-safe: CEDE stamps the terminal ceded state — the ticket henceforth counts for the parent that holds it — while RECLAIM persists its whole lifecycle write-ahead: the conflicting relation id (reclaim_relation), the keyed removal mutation (reclaim_removal_key), and reclaim_state pending land with the choice BEFORE any call, the keyed removal replays to removed — a not-found means another actor already removed it and is ACCEPTED as removed; a conflict re-reads parentage: an absent parent proceeds, a parent DIFFERENT from the authorized one returns the advance to conflicting with parenting_error updated — fresh authorization records the new reclaim_relation and rotates reclaim_generation and the removal key atomically with it, and an unrecoverable failure records its cause with reclaim_state failed — the operator corrects, the removal generation and key rotate atomically, and the fresh attempt reconciles before attachment resumes — and only then does the advance return to pending under an advanced generation for the ordinary keyed attachment; each step is reconciled before the choice clears, so recovery never forgets the authorization to remove, never removes an unauthorized parent, and never re-encounters the same conflict blind
        - { name: cascade_verified, type: enum, values: [reached, unreached, external] }  # cascade-driven causes only — reached requires an issue.status-changed event for the epic, with its reopened status, under the same operation; external records a desired-parent acceptance, where a concurrent actor's attachment carried the cascade (sutra's invariant guarantees it) and operation is deliberately absent; recorded atomically with the FINAL parenting reconciliation — new-work advances insert pending first, verification landing with the parented stamp
        - { name: reopen_owed, type: boolean }  # true exactly when verification recorded unreached — the durable explicit-reopen obligation recovery honors
        - { name: epoch, type: integer, required: true }  # the epoch value this advance produced
        - { name: created, type: datetime, required: true }
    - id: ENT-build-target
      name: BuildTarget
      description: >-
        Durable, target-scoped anchor for a build — one row per
        (project, normalized target_spec), keyed exactly as PlanHead.
        Owns the umbrella epic exactly once: the row is inserted
        write-ahead with epic_state pending before any tracker call,
        creation is idempotent on target_key, and the returned epic id
        is recorded transactionally with epic_state created — recovery
        replays into the same epic, and supersessions reuse it through
        this row, which is why tickets never re-parent. Build-level
        completion lives here as a write-ahead lifecycle, not a bare
        timestamp: when every ticket of the activated head plan is
        complete, REATTACHMENT RECONCILIATION precedes every claim: every
        target-scoped ticket — plan membership or mapping-bound — not
        currently parented beneath the epic is re-parented through
        keyed relation mutations BEFORE the claim's subtree revision is
        captured — and membership is then VERIFIED after the capture:
        every target-scoped ticket must read as a descendant of the
        epic. The ordering makes the vulnerable window empty: a detach
        interleaving reattachment and capture is caught by the
        verification (the capture already includes the detach's
        increment and the ticket reads missing), aborting the attempt
        and re-running reconciliation; a detach after the capture
        advances the epic's revision (removal increments the former
        parent's chain) past the claim and fails its fence. Either way
        every later reopen of any target ticket is a descendant reopen
        with its ancestor cascade — a detached-while-complete ticket
        can never reopen past a captured claim. Then kriya first records review-submitting — rotating the
        ENTIRE claim-field set (submission key, doc key, pending report
        reference, review id and revision, claim epoch, and the epic's
        observed subtree_revision) transactionally as one unit for THIS
        attempt; the submission key is derived deterministically from
        (target_key, completion_epoch), so it is epoch-scoped — BEFORE
        any external call. The report document is then created under
        completion_report_key exactly as in rework: the keyed doc
        mutation replays to the same version on recovery, its returned
        version is recorded into completion_report_doc, and only then
        does the review-create call run; the key rides the
        request as its Idempotency-Key, so recovery from review-submitting
        REPLAYS the persisted request under the same key — sutra returns
        the original response for a landed request and creates otherwise,
        never a second review. Because the key embeds the
        epoch, recovery can never adopt a PRIOR epoch's approved review:
        after a reopen or supersession advances the epoch, recompletion
        is a NEW attempt with a new key, a new review, and fresh human
        approval — an old approval never authorizes newly added work.
        The fields are immutable within an attempt and rotated only by
        the next attempt's review-submitting transaction — with ONE
        in-attempt exception: a changes-requested verdict on the
        completion review takes the rework path, itself write-ahead:
        review-resubmitting is recorded FIRST — persisting
        completion_rework_event (the immutable id of the
        changes-requested event this rework answers),
        completion_resubmission_key, derived from (submission key,
        next revision, rework event), and completion_pending_report,
        the prepared report content reference — before the new doc
        version or the sutra resubmission exists; the rework event in
        the key means a verdict ABA (changes-requested -> approved ->
        changes-requested at the same revision) is a NEW event and a
        fresh key pair, so a cached conflict or stale document can
        never replay against a later rework;
        the doc-version mutation carries its own deterministic key
        (completion_report_key) persisted in the same transaction, so a
        crash after document creation but before resubmission recovers
        the exact version rather than appending another; recovery from
        review-resubmitting first replays the keyed doc mutation, then
        replays the keyed resubmission — sutra returns each original
        response if the call landed and performs it otherwise — and only
        then are
        completion_report_doc and completion_revision updated
        transactionally within the SAME attempt (key and epoch
        unchanged); the epic closes on the new revision's approval, so
        a rejected completion review can never strand the target and a
        crash mid-rework never double-submits or loses the operation.
        The recorded review's id and revision land with the PlanHead
        generation the claim is about (completed_generation), and
        completion_state advances around every sutra call — closing
        around the close, complete once the epic closed, reopening
        around a reopen — and each state records a deterministic
        per-operation idempotency key — reopen keys derive from
        (target_key, completion_epoch, operation), data that always
        exists, since a supersession or reopen can occur before any
        completion attempt ever created a submission key; CLOSE keys
        additionally include completion_approval_event, so a
        reapproval after a reversal-induced conflict issues under a
        fresh key — in the same transaction, so
        crash recovery resumes the exact step by REPLAYING under that
        key: a close that landed before the crash replays to its
        original success — never a close_used conflict, since this very
        key stamped it — and a replayed reopen produces no second event
        or revision increment.
        completion_state is also the per-target serializer: close and
        reopen are never issued while a prior close or reopen is
        unresolved — supersession or reopen first resolves an in-flight
        closing outcome, and a close that lands for a stale claim (its
        CAS already failed) is compensated by a durable reopen driven
        through the same lifecycle, so a stale close can never leave the
        current target's epic closed. The claim binds to a completion_epoch — a
        counter this row advances atomically on EVERY supersession,
        EVERY event that reopens the epic — a ticket reopening, deferred
        work activating, or an active subtree being attached — and
        EVERY post-close detachment of a target ticket (relation
        removal advances the revision without reopening the epic;
        advancing the epoch rotates the epoch-scoped claim keys, so a
        stamp invalidated by a detach can revalidate on a FRESH attempt
        and a spent review can never replay), and EVERY new active
        target-scoped issue created after completion — kriya keeps
        consuming the project's work events after a target completes,
        and a creation attributing to a completed target advances its
        epoch (cause new-work, keyed by the creating event), clears the
        stamp — persisting the ticket, the deterministic parenting
        relation key, and parenting_state pending ON the advance record,
        so recovery resumes an unfinished parenting by keyed replay —
        and parents the ticket under the epic through that keyed
        relation mutation: ATTACHING active work beneath the complete
        epic is itself the reopen trigger — sutra cascades atomically —
        and kriya verifies that cascade through the mutation's
        operation id exactly as for reopens — parenting_state staying
        pending until verification completes and stamping parented
        atomically with operation, cascade_verified, and any
        reopen_owed — issuing the explicit keyed
        reopen only if the epic provably went unreached. An AMBIGUOUS
        creation in a multi-mapping project advances NO epoch: the
        AttributionAmbiguity row suppresses completion for every
        candidate target while it is open, resolving, conflicting, OR adopted — no stamp
        reports done and no attempt starts until the row stamps
        resolved, which happens only after the selected target's
        parenting, epoch advance, and cascade reconciliation complete —
        and resolution
        advances only the selected target through its parenting
        attachment's cascade, the other candidates resuming untouched
        with their stamps and epics intact (none of
        which move the PlanHead generation, so the generation alone
        cannot fence them). Because the submission key embeds the
        epoch, any such reopen forces recompletion onto a NEW key and a
        fresh review — the old close-used review can never be replayed.
        The submission records completion_claim_epoch — an immutable
        copy of the epoch at that moment — beside the review id and
        revision; the epic close names the attempt's completion_review
        at completion_revision, with completion_approval_event as the
        expected verdict event, as its authorizer, so sutra spends
        exactly that approval at exactly that revision — a delayed
        close carrying a stale revision rejects, and a prior epoch's
        spent review can never close a reopened epic; and
        stamping completed is a CAS that requires
        completion_epoch to still equal completion_claim_epoch, so the
        comparison survives any number of later advances. The
        client-side read of ticket states is advisory only; the FENCE
        against a ticket reopening between that read and the stamp is
        sutra's own close gate — an issue cannot complete with open
        children, so the epic close is refused server-atomically if any
        child reopened, and kriya stamps ONLY after a successful close:
        a delayed approval earned before a reopen or supersession can
        never stamp an unfinished target complete — it surfaces
        instead. The close itself carries expected_subtree_revision —
        the epic's subtree revision recorded with the claim set at
        submission — so a descendant that reopened AND recompleted
        before kriya consumed any event still refuses the close: sutra's
        revision moved even though current state matches, and kriya then
        advances its epoch and requires a fresh attempt with fresh
        approval. For a reopen landing AFTER a successful close, sutra's
        reopen cascade is the invariant: reopening a child of a complete
        parent reopens the parent in the same sutra transaction, so the
        epic is never closed over an open child; kriya's stamp is a
        MIRROR of that authoritative state — a stamp landed in the
        window between close success and the reopen event is cleared
        (epoch advanced) when the event arrives, and popping resumes
        from the epic reopen itself, never gated on the mirror healing
        first. A
        supersession installing a new head, or a completed ticket
        reopening, atomically advances the epoch and clears completed;
        whether an EXTERNAL reopen is owed depends on WHAT advanced the
        epoch, and the durable advance cause is AUTHORITATIVE — every advance INSERTS a CompletionAdvance record keyed uniquely by (target, event) in the advancing transaction, so any replayed event, in any order, collides and is a no-op; the record carries the cause recovery reads: every
        sutra-cascade-driven advance — a ticket reopening, deferred
        work activating, an active subtree attached — SKIPS the call
        only after VERIFYING the cascade actually reached the epic —
        the reopen's sibling events share its operation id, and among
        them an issue.status-changed event for the EPIC with its
        reopened status must appear — mere subject presence is not
        evidence, since a relation-added already names the epic as
        subject — recorded on the
        advance's CompletionAdvance row as operation, cascade_verified,
        and — when unreached — the reopen_owed obligation recovery
        honors —
        (which holds for every descendant reopen, which holds for every descendant
        reopen since binds parent under the epic and reattachment
        reconciliation precedes every claim). A reopen that did NOT
        cascade — a ticket detached after the epic closed — takes the
        explicit durable keyed reopen instead, so the epic never stays
        complete while kriya clears its stamp. Verified-cascaded
        advances never call sutra, regardless of prior completion
        state, because the
        ancestor cascade already reopened the epic atomically in the
        triggering transaction and a second call would at best conflict
        and at worst emit a redundant event and revision increment; a
        supersession-driven advance (no cascade fired) consults the
        durable completion_state: closing or complete records reopening
        and calls sutra under the keyed reopen, never-closed records
        the advance and returns to none with NO external call.
        Stale-close compensation is the only other explicit reopen. Recovery never wonders which case it is
        in — the advance's cause and completion_state are both durable
        — and popping resumes either way.
        Plans and runs reach the epic through their target key, never
        a second copy of it.
      fields:
        - { name: target_key, type: string, required: true, unique: true }
        - { name: epic, type: string }  # opaque tracker epic id; absent until the create returns
        - { name: epic_state, type: enum, required: true, values: [pending, created] }
        - { name: merge_lock, type: ref, ref: ENT-merge-attempt }  # the EXACT attempt holding the target's serialized merge section — CAS-acquired by the queue head, released transactionally with the attempt's terminal state; identifying the attempt, not just its run, keeps recovery from conflating multiple attempts for one run
        - { name: completion_state, type: enum, required: true, values: [none, review-submitting, review-submitted, review-resubmitting, closing, complete, reopening] }  # write-ahead around each sutra call; recovery resumes the exact step; also the per-target SERIALIZER — a new close or reopen is issued only after the in-flight operation's outcome is durably resolved
        - { name: completion_submission_key, type: string }  # deterministic per (target_key, completion_epoch) — epoch-scoped; immutable within an attempt, rotated with the whole claim-field set when a new epoch's attempt enters review-submitting
        - { name: completion_report_doc, type: string }  # opaque doc-version id of the completion report; populated with the submission key
        - { name: completion_review, type: string }  # opaque tracker review id of the build-completion review
        - { name: completion_revision, type: integer }  # the review revision the approval must still carry
        - { name: completed_generation, type: integer }  # the PlanHead generation the completion claim is about
        - { name: completion_epoch, type: integer, required: true }  # init 0; the CURRENT epoch — advanced atomically on every supersession, every event that reopens the epic (ticket reopen, deferred activation, active-subtree attachment), and every post-close detachment of a target ticket
        - { name: last_advance_event, type: string }  # convenience mirror of the newest CompletionAdvance record's event; the record set, not this field, is the dedup authority
        - { name: last_advance_cause, type: enum, values: [supersession, ticket-reopen, deferred-activation, subtree-attachment, detachment, new-work, compensation] }  # convenience mirror of the newest CompletionAdvance record's cause; the durable per-event records are what recovery reads
        - { name: completion_rework_event, type: string }  # immutable id of the changes-requested event the pending rework answers; part of both rework keys, so each distinct rework attempt rotates them
        - { name: completion_resubmission_key, type: string }  # derived from (submission key, next revision, rework event); persisted in the review-resubmitting transaction, reconciled (cleared) once the resubmission is recorded
        - { name: completion_report_key, type: string }  # deterministic idempotency key for the report doc-version mutation, derived from the governing submission or resubmission key (and therefore rotating with the rework event); persisted before the doc call so a recovery replay returns the SAME version instead of appending
        - { name: completion_pending_report, type: string }  # reference to the prepared report content, persisted BEFORE the doc version exists; reconciled into completion_report_doc on success
        - { name: completion_subtree_revision, type: integer }  # PRE-close: the epic's subtree_revision observed at submission, rotated with the claim set; the epic close carries it as expected_subtree_revision
        - { name: completion_closed_revision, type: integer }  # POST-close: the subtree_revision the close itself committed, taken from the close response and recorded atomically with the completed stamp — the mirror-trust comparison uses THIS, never the pre-close precondition
        - { name: completion_approval_event, type: string }  # immutable id of the approval event the pending close acts on, recorded with the exact review and revision before the close key derives — a reapproval after a reversal-induced conflict is a NEW event and therefore a fresh close key, never a replay of the cached conflict
        - { name: completion_operation_key, type: string }  # deterministic per (target_key, completion_epoch, operation) — always derivable, even before any completion attempt exists; the CLOSE key additionally includes completion_approval_event; written atomically with the closing or reopening state, and the external reopen is issued for supersession-driven advances where completion_state shows a close ever ran, for stale-close compensation, AND for any reopen whose persisted cascade verification failed — an uncascaded detached-ticket reopen enters this keyed reopening lifecycle; a cascade-driven advance skips it only when cascade_verified records reached — a matching issue.status-changed event for the epic, with its reopened status, under the same operation; subject presence alone never suppresses the call
        - { name: completion_claim_epoch, type: integer }  # immutable — the epoch captured when the completion review was submitted, recorded with completion_review/revision; the completed CAS requires completion_epoch to still equal it
        - { name: completed, type: datetime }  # completion claim for the CURRENT head; cleared atomically by EVERY completion_epoch advance, whatever its cause — supersession, ticket reopen, deferred activation, subtree attachment, detachment, new work after completion, or compensation
        - { name: created, type: datetime, required: true }
    - id: ENT-plan
      name: Plan
      description: >-
        The decomposition record tying an avspec to the tickets it
        produced. The SpecSnapshot is pinned at intake — the authoritative
        creation point — and decomposition receives and references it
        here, so every ticket of a plan builds against the exact spec
        version that produced its acceptance criteria. Decomposition is
        write-ahead and idempotent: the plan row (decomposition_key
        derived from project_key, normalized target_spec, spec_hash, and
        the intake_generation the snapshot was pinned under — so
        re-intaking a previously seen hash yields a fresh key, never a
        replay of a superseded plan; unique) and its planned
        ticket definitions are persisted BEFORE any tracker call; each
        ticket-creation request carries a deterministic idempotency key
        derived from (decomposition_key, ticket ordinal), so a crash or
        concurrent retry replays into the same sutra tickets instead of
        duplicating them, per CON-idempotent-mutations. The write-ahead
        payload lives in PlannedTicket rows — ordinal, the ticket's FULL
        ordered mutation sequence (creation, risk/spike labels, blocking
        relations, assignment), and derived per-step idempotency keys,
        all persisted before any call, with returned ids filled per step
        — so recovery replays the exact sequence from durable state and
        resumes mid-sequence. Plans have a lifecycle: pending -> active ->
        superseded, with at most one ACTIVE plan per (project, normalized
        target_spec). Every (project, normalized target_spec) has ONE
        durable PlanHead row, and replacement is a SINGLE store
        transaction (one durable store makes this free): it requires the
        head's current plan to be ACTIVE and the candidate's
        intake_generation to be STRICTLY NEWER than the head's — a
        generation-1 intake recovering after generation 2 installed its
        plan loses here and — being already generation-ineligible —
        transitions DIRECTLY to terminal historical rather than parking
        awaiting-operator or superseding the newer head — then marks that predecessor
        superseded with superseded_by stamped, installs the new pending
        plan as head.current, and increments the head generation — all
        atomically. Every request FIRST resolves its decomposition_key against
        existing Plan rows (the key is unique), BEFORE any PlanHead
        logic runs: a row already present makes the request a same-key
        retry whose result is state-aware and touches nothing —
        pending resumes its phases; active WITHOUT the completed stamp
        resumes its creation, wiring, and assignment phases from the
        durable per-step states (activation precedes those phases, so a
        crash can leave an active plan mid-decomposition) and only an
        active plan bearing completed returns as already complete;
        a plan in terminal historical state returns that terminal
        result with no mutation — never revived, never re-parked;
        superseded returns as an idempotent HISTORICAL result (the
        caller learns the plan and its replacement via superseded_by;
        the retry can never mutate PlanHead, revive the old plan, or
        compete as a candidate — reachable regardless of where the head
        has moved since), and awaiting-operator is preserved and
        reported, never silently resumed past an unrecoverable failure.
        Only a request whose key resolves to NO existing row proceeds
        to insert-and-CAS — and because two concurrent requests can
        both observe no row, EVERY conflict on that path (the plan
        insert's key-uniqueness violation or the head CAS losing) is
        followed by re-resolving decomposition_key before any verdict:
        finding a row for the SAME key means a twin won, and the
        request resumes it state-aware exactly as above; only when
        re-resolution shows a DIFFERENT key's plan holds the head does
        competing-candidate handling apply — and the loser's landing
        state applies the generation-eligibility check ATOMICALLY in
        the same verdict: a loser whose intake_generation is still
        strictly newer than the winning head's parks awaiting-operator
        as a retryable candidate, while one already equal or older
        transitions DIRECTLY to terminal historical, never exposed as
        actionable. A same-key retry is never a competitor in
        any state, whether it arrived before or raced the winner. Bootstrap is the degenerate case of the same
        transaction: a target with no head yet creates the pending plan
        and INSERTS its PlanHead row atomically — target_key's uniqueness
        makes the insert the CAS, so a concurrent first decomposition
        either resumes idempotently (same decomposition_key already
        heads the target) or loses under the same atomic
        eligibility-checked verdict — awaiting-operator only while
        generation-eligible, terminal historical otherwise; with no
        predecessor the retirement set is empty and the plan activates
        immediately. The head can never point at a losing plan and
        there is no window between head-move and supersession
        — a concurrent would-be successor loses that CAS and durably moves,
        under the same atomic eligibility-checked verdict, to
        awaiting-operator with the error recorded only while its intake
        generation remains strictly newer than the winner's — and to
        terminal historical otherwise — so
        exactly one replacement can ever activate and the loser is
        either operator-visible or terminal history, never a lingering
        indistinguishable pending row and never a stale retryable.
        The retirement pass is then durable, ordered, and state-aware,
        acting in sutra ONLY on unfinished, unclaimed tickets (completed
        tickets and tickets claimed by LIVE builds get no server-side
        action — popped builds finish under their pinned snapshots; a
        ticket whose only matching run is terminally CANCELLED is
        RELEASED work, already deferred by the cancellation protocol,
        and its row stamps disposition retired — never carried forward
        as work that will finish; a run still in CANCELLING first has
        its conditional defer replayed to its terminal result, and only
        once the ticket is verifiably deferred and the run stamped
        cancelled does the row stamp retired — a crash mid-cancellation
        can never consume a row over an in-progress ticket) but
        stamping EVERY predecessor row before it completes: rows for
        bound or completed LIVE builds are stamped consumed with disposition
        bound or completed (the
        build's own plan and spec_hash refs are its authority; membership
        matching is never needed again), and the reconciliation pass
        below runs first so no claimed-but-unbound pop exists when those
        stamps land. Retirement therefore leaves NO unstamped predecessor
        row behind; the stamps consume the rows as history, but the
        binding AUTHORITY only switches at successor activation — while
        the successor is still pending, the predecessor's rows (stamped
        or not) remain what a pop binds against, so a reopened ticket
        popped mid-retirement can never inherit the pending plan's
        not-yet-wired snapshot. Once the successor activates, a later
        reopen-and-pop of a predecessor ticket the successor CARRIED
        FORWARD binds cleanly to the then-current active head; a ticket
        the successor omitted instead retains its AC-producing plan's
        snapshot via consumed-history resolution (binding rule 3). First each
        unfinished, unclaimed ticket is set to status deferred via the
        tracker's conditional transition, whose expected status is the
        FRESHLY OBSERVED unfinished status — open or blocked alike, so
        a blocked ticket defers on the first attempt instead of
        conflicting forever. Each
        defer attempt carries a deterministic GENERATION-SCOPED
        idempotency key — (row's idempotency_key, 'defer', attempt
        generation), with the generation persisted on the row and
        advanced durably after every conflict-and-fresh-read — because
        sutra replays a reused key verbatim: retrying a 409 under the
        original key would return the cached conflict forever, so each
        re-read-then-retry issues under the next generation's key while
        every individual attempt stays exactly-once. A conflict is NOT assumed to
        mean a pop won: first every queued BuildRun with an unfilled
        ticket replays its idempotent pop so just-claimed tickets gain
        their matching rows, then the ticket is re-read and classified —
        actually claimed by a build (in-progress with a matching
        BuildRun) means
        it is left untouched; still unfinished and unclaimed but already DEFERRED means the
        fence is established (a prior attempt's effect landed) and
        retirement continues with NO further transition — retrying
        would at best duplicate a status mutation and at worst loop on
        conflicts; still unfinished and unclaimed but moved elsewhere
        (blocked, or re-opened meanwhile) means the conditional
        defer retries from the freshly observed status under the next
        defer_generation key; anything whose
        ownership cannot be determined goes to awaiting-operator. The
        pop fence thus lands before anything else without clobbering a
        live claim or stranding a merely-moved ticket; then its ISSUED
        mutations (and only those) are drained by persisted key, then it
        is unassigned, with a consumed stamp (disposition retired or
        carried-forward) written per row so a crash resumes exactly
        where it stopped. The retirement pass is executed
        by the successor's fenced pending-phase worker, which is
        EXPLICITLY authorized to replay issued predecessor steps even
        though neither plan is active — completing an already-sent
        request is finishing the past, not new work; creating
        never-issued work remains active-only. Id-less rows therefore
        split on their creation step's state: pending means nothing was
        ever sent — the row is stamped consumed (disposition retired)
        with no server-side action at all; issued means the creation is replayed to a
        terminal result, the id recorded, the ticket deferred, and then
        that row's issued labels and relations drained. The plan-wide
        phase barrier guarantees an issued relation never targets an
        uncreated ticket (relations only begin issuing after every
        creation completed). Every step in a
        PlannedTicket's sequence carries a durable step state — pending
        (never sent), issued (written in the same transaction that
        precedes the call), complete (written on return) — and draining
        replays ONLY steps whose state is exactly issued: pending was
        provably never sent and is skipped, complete already has its
        terminal result and is never rerun. Assignment follows the
        same rule, replayed to a terminal result after the defer fence
        and before the unassign-and-stamp when issued, skipped when
        pending.
        Claimed-but-unbound pops are bound WHENEVER discovered, not
        only in the initial sweep: a defer conflict re-read that finds
        a ticket claimed by a queued BuildRun with an unfilled ticket
        replays that pop and binds the row (to the retiring
        predecessor, per binding rule 2) before the ticket's row is
        stamped, and the pre-activation recheck replays any remaining
        unfilled queued BuildRuns the same way — the write-ahead row is
        durable before sutra is ever called, so every in-flight claim
        is visible to this fence. New pops cannot originate inside the window at all:
        admission is serialized with head transitions through the
        PopFence singleton (ENT-pop-fence, planner-owned). Replacement
        increments its unactivated_heads counter in the same
        transaction that moves the head; activation decrements it in
        its own atomic transaction after retirement completes — never
        during the head move, which would admit pops before
        predecessor retirement finished — and
        BuildRun write-ahead creation invokes the planner's admission
        guard, which asserts counter == 0 against the fence's version
        (CAS) inside the creating transaction — so an admission that
        observed a stale fence cannot commit: any interleaved
        replacement bumps the version and forces the admission to
        retry after activation, and vice versa. The fence is deliberately GLOBAL because sutra's
        pop is identity-wide and accepts no project filter, so the
        eventual ticket's project is unknowable before the pop
        returns; unactivated windows are rare and short (one
        replacement in flight), making the coarse fence cheap. So
        every claim is either created before the window and drained by
        the recheck, or created after activation and resolved by rule
        3; no claim can straddle activation. Activation therefore happens only
        when NO claimed-but-unbound pop against a predecessor ticket
        exists; a crashed build worker replaying its bind after
        activation finds its BuildRun already bound (binding is
        idempotent — the fence's binding and the worker's replay write
        the same row), so a pre-activation claim can never re-resolve
        through the activated successor.
        Only when every eligible predecessor row carries its stamp does
        the stamped successor transition pending -> active, and only an
        active plan's worker may run creation, wiring, or assignment
        phases — a crash mid-cleanup can never leave both plans' tickets
        exposed. Because
        pop eligibility requires status open, the deferred status is the
        durable fence — even an in-flight assignment from a crashed
        worker that lands afterwards cannot make a deferred ticket
        poppable. Before retirement, every ISSUED predecessor
        mutation is drained by replaying its persisted idempotency key —
        bringing any in-flight request to a known terminal state, while
        pending steps, provably never sent, are skipped — and
        carried-forward tickets stay deferred through the replacement's
        creation and wiring phases: reopening happens in the final
        assignment phase, after the plan-wide relation barrier, so a
        ticket regains status open only when its full new dependency
        graph is durable. Builds already popped finish under their
        pinned snapshots; the superseded tickets stay in the tracker for
        the PM to reconcile into the new plan. Supersession is fenced the
        same way claim resolution is: it proceeds only when the prior
        plan's decomposition worker is not live (decidable in-process —
        workers are the process's own tasks, and a crash kills them all),
        and every decomposition worker re-checks that its plan is still
        active in the same transaction that records each step, halting
        when superseded — so no live worker assigns after supersession — and the
        deferred-status fence covers the dead worker's in-flight
        requests. Execution runs in PLAN-WIDE phases, not
        merely per ticket: every creation completes, then every label and
        relation across all tickets, and only then any assignment.
        Because pop eligibility requires assignment, the phase barrier
        keeps every ticket unpoppable until the whole plan's dependency
        graph is wired — a crash mid-decomposition can never expose a
        runnable ticket whose blocking relation lives in another ticket's
        sequence.
      fields:
        - { name: decomposition_key, type: string, required: true, unique: true }  # deterministic hash of (project_key, normalized target_spec, spec_hash, intake_generation) — the write-ahead idempotency handle for the whole decomposition; the generation makes a REVERT distinct: re-intaking a previously seen hash allocates a new generation, so the request creates a fresh plan that supersedes the current head instead of replaying the old superseded plan's historical result, while same-intake retries keep the same key and stay idempotent
        - { name: target_spec, type: string, required: true }
        - { name: spec_hash, type: string, required: true }  # the intake-pinned snapshot this decomposition ran against; plan-matched builds inherit it
        - { name: intake_generation, type: integer, required: true }  # target-scoped, copied at decomposition from the intake that authorized this plan; every mapping upsert this plan issues is ordered by exactly this value — re-intaking the same content hash allocates a fresh generation, so an old plan reusing a shared snapshot still carries its own older token and loses
        - { name: state, type: enum, required: true, values: [pending, active, superseded, awaiting-operator, historical] }  # historical is terminal — a losing candidate whose intake generation the head has outrun, durably out of the inbox's actionable set  # pending until the predecessor's retirement completes; awaiting-operator records a lost supersession CAS or unrecoverable phase failure
        - { name: activated, type: datetime }  # persisted at the pending -> active transition and never cleared; binding authority keys off this, not the state label, so a head parked awaiting-operator still resolves deterministically
        - { name: completed, type: datetime }  # stamped only after the final assignment-phase barrier finishes — activation precedes the creation/wiring/assignment phases, so active alone never means the decomposition is done
        # Recovery of ANY awaiting-operator head is FORWARD-ONLY, split by the activated stamp. Unactivated: an operator-authorized CAS — expected state awaiting-operator, activated absent, currently head — atomically restores the plan to pending, clears its error, and resets every predecessor PlannedTicket row parked awaiting-operator by the failed retirement (error cleared, row state recomputed from durable per-step progress exactly as below), then the pending phase RESUMES — retirement is idempotent and resumable, and activation decrements the fence, so the counter cannot stay positive indefinitely and no parked row leaves retirement blocked. Activated (a creation/wiring/assignment failure parked the plan after activation): an operator-authorized CAS — expected state awaiting-operator, activated present — restores state to active with the activated stamp intact and clears error, and the SAME idempotent transition resets every PlannedTicket row parked awaiting-operator under this plan: each row's error is cleared and its state recomputed from its durable per-step progress (all steps complete -> complete, any issued or complete step -> in-progress, none -> pending), so per-step progress is preserved, resumed phases find no row still blocked, and re-running the restore is a no-op; the head was never unactivated so the fence is untouched, and once restored the normal supersession path is open again — no target is ever permanently stuck. There is deliberately no rollback verdict in either case: rolling the head back to a superseded predecessor would require restoring its state and reversing partially completed retirement (re-opening deferred tickets, un-consuming rows) with no authority to do so safely. A decomposition that turns out to be semantically wrong still resumes to activation and is then corrected by a normal follow-up supersession. A parked NON-HEAD candidate (a distinct decomposition that lost the replacement CAS) has its own operator resolution: an operator-authorized CAS — expected awaiting-operator, activated absent, not head — clears its error and re-enters the SAME plan row into the replacement CAS against the now-current head (its decomposition is a deterministic function of project, target, and spec_hash, so reusing the row is semantically exact and its unique decomposition_key never blocks the retry); a WINNING retry is the full replacement transaction, which atomically REPOINTS candidate.predecessor to the head it actually beat (overwriting the stale reference persisted at original creation — retirement must drain the plan whose tickets are live NOW, not whoever was head when the candidate first lost), marks that head superseded with its superseded_by stamped, increments the fence's unactivated_heads, and moves PlanHead.current with a generation bump; a LOSING retry applies the generation-eligibility check atomically in the loss verdict — re-parking awaiting-operator only while its intake_generation remains strictly newer than the new winner's, transitioning directly to terminal historical otherwise (the head may have advanced between the operator's eligibility view and the CAS). Retry is offered ONLY while the candidate remains generation-eligible — its intake_generation still strictly newer than the current head's; once the head carries an equal or newer generation the candidate is CAS-transitioned awaiting-operator -> HISTORICAL — a terminal state, durably excluded from the inbox's actionable set and from the awaiting-operator recovery criterion, applied when the ineligibility is first observed (inbox listing or retry attempt) — and adopting that decomposition again means a fresh intake (which reserves a newer generation) producing a fresh plan. The operator can therefore adopt a still-eligible losing decomposition at any later point, or leave any candidate parked as an inert historical record — it is never silently retried and never blocks anything.
        - { name: error, type: string }  # what failed, for the operator; set with awaiting-operator
        - { name: predecessor, type: ref, ref: ENT-plan }  # the plan this one supersedes; persisted at creation so retirement is resumable
        - { name: superseded_by, type: ref, ref: ENT-plan }  # stamped by the supersession CAS — the one successor allowed to activate
        - { name: project_key, type: string, required: true }
        - { name: created, type: datetime, required: true }
    - id: ENT-build-run
      name: BuildRun
      description: >-
        Also the write-ahead record for the pop itself: the row is created
        (state queued, pop_key set, ticket absent) BEFORE calling sutra's
        pop; sutra's pop is idempotent per key (AC-pop-replay), so
        recovery replays the same pop_key and receives the same issue,
        then binds ticket to the row transactionally. Plan is lineage,
        not an execution dependency: in the same transaction the ticket
        is matched by ONE state-aware precedence algorithm that walks
        the predecessor chain from the plan currently heading its
        target (resolved through PlanHead) and yields at most one
        candidate: (1) among SUPERSEDED plans ONLY — the current head,
        pending or active, is excluded from this rule and handled by
        (2) and (3) — the FURTHEST-BACK plan on the chain holding an
        UNSTAMPED PlannedTicket row for the ticket binds; such a row
        exists only while that plan's retirement is still resuming
        (retirement binds every queued BuildRun with an unfilled ticket
        via pop replay BEFORE stamping the remaining rows, so unstamped
        means exactly claimed-in-flight), and the deepest such
        superseded row is
        precisely the plan whose tickets were live when the pop claimed
        this one; the same transaction stamps every unstamped
        superseded row it walked past. (2) Otherwise, while the head has
        NOT YET ACTIVATED (activated absent — a pending head, or one
        parked awaiting-operator before it ever activated), the
        NEAREST predecessor row on the chain — stamped or not — binds:
        usually the immediate predecessor's, but when that plan omitted
        the ticket the search continues through consumed history down
        the activated-predecessor chain to the nearest plan that
        actually included it (a pop admitted just before replacement
        can claim a reopened ticket that only an earlier plan
        produced, and it must not be misclassified as unplanned). An
        unactivated head's rows NEVER bind, because activation is the
        atomic switch of binding authority (persisted as the plan's
        activated stamp), so a reopened ticket popped mid-retirement
        can never inherit an unactivated plan's not-yet-wired snapshot.
        (3) Otherwise the head has activated — even if it later entered
        awaiting-operator — and its own row, when one exists, binds:
        a ticket the current decomposition lists was re-affirmed by it,
        so the head's snapshot rightly governs. A ticket whose ONLY
        membership is consumed rows on superseded plans of this chain
        (e.g. completed under the predecessor, omitted from the
        successor, reopened later) binds instead to the NEAREST such
        row's plan — the most recent decomposition that actually
        produced or re-affirmed the ticket's acceptance criteria — and
        that plan's pinned snapshot: the pinned-spec invariant means a
        ticket builds against the spec that produced its ACs, and a
        plan that omitted the ticket never qualifies, head or not. (The
        PM re-adopts such a ticket by including it in a new
        decomposition, which gives it a current row.) Stamped
        superseded rows are otherwise pure audit history. Only a
        ticket with no membership row anywhere — planned outside any
        plan — is unplanned. In every case the bound plan's pinned
        snapshot travels with the binding, honoring the
        popped-builds-finish-under-predecessor guarantee. (PlannedTicket
        remains the authoritative membership record — Plan holds no
        duplicate list.) Matching uses
        persisted ids directly: assignment-last guarantees any poppable
        ticket's id was durably recorded steps earlier, so no
        reconciliation sweep is needed at classification time — a
        permanently failing creation elsewhere can never block an
        unrelated build; per-row replay failures set the row's own
        state to awaiting-operator with the error recorded, and the TUI
        surfaces those rows alongside escalations. Then: the precedence algorithm above has already collapsed
        each head's predecessor chain to at most one candidate, so rows
        within one chain are never counted as multiple matches and a
        carried-forward ticket is unambiguous by construction. Exactly
        one surviving candidate binds the plan; no candidate (a ticket
        assigned outside any plan) or candidates surviving from
        DISTINCT head chains leaves plan absent and the build proceeds
        regardless. The snapshot is stricter than the lineage:
        one candidate inherits its plan's spec_hash; distinct-chain
        candidates inherit
        only when every candidate plan agrees on spec_hash, project, and
        normalized target_spec path, and any disagreement routes to
        awaiting-operator rather than fresh-pinning — a planned ticket never silently builds against a spec
        other than the one that produced its ACs. The build otherwise
        proceeds, since the ticket itself carries the ACs and
        target_spec is persisted on the row at bind time — from the
        matched plan, or for unplanned tickets from kriya's persisted
        project-to-spec registry (seeded by every plan, operator-editable;
        a bare repo_path is NOT trusted, since one repository can hold
        several manifests). The registry may hold several mappings per
        project; the fallback binds only when exactly one exists — zero
        or several means the row goes to awaiting-operator with the
        claimed ticket preserved. Nothing
        about plan resolution can strand a claimed ticket. An
        empty result transitions the row to the terminal no-work state in
        the same transaction; a later poll creates a fresh row with a
        fresh pop_key, so an exhausted key is never revisited. A crash at
        any point either replays to the same outcome or finds the
        transition already done — no stranded tickets, no double claims,
        no immortal empty rows.
      fields:
        - { name: pop_key, type: string, required: true, unique: true }  # deterministic idempotency key persisted before the pop; replayed on recovery
        - { name: identity, type: string, required: true }  # the agent identity popped as — persisted pre-pop so replay hits the same stack even if configuration changes
        - { name: target_spec, type: string }  # gate-chain context, persisted at bind — from the plan, else the project-to-spec registry; unresolvable or ambiguous -> awaiting-operator
        - { name: spec_hash, type: string }  # inherited from the matched plan's intake-pinned snapshot; for unplanned tickets taken from the mapping's intake-pinned spec_hash — NEVER read fresh from the working tree, and a mapping without one parks the run awaiting-operator (explicit intake is the remedy) — so builds and recovery always execute against a stored, intake-approved SpecSnapshot; the unplanned bind also PARENTS the ticket under the target's epic through a keyed relation mutation, so the epic subtree remains the complete universe of target work and sutra's close gate covers it
        - { name: ticket, type: string }  # opaque tracker id; absent until the pop returns, bound transactionally
        - { name: plan, type: ref, ref: ENT-plan }  # lineage only — bound when exactly one plan records the ticket; absent pre-pop, on no-work rows, and for unplanned or ambiguous tickets
        - { name: state, type: enum, required: true, values: [queued, no-work, dev-loop, gates, po-validation, review-submitted, awaiting-operator, merging, merged, failed, cancelling, cancelled, research-loop, finding-submitted, completing, closed] }  # one state per stage — deterministic crash recovery, no skippable gates. Code runs traverse dev-loop -> gates -> po-validation -> review-submitted -> merging -> merged -> completing -> closed; research runs traverse research-loop -> finding-submitted -> completing -> closed, returning finding-submitted -> research-loop on a changes-requested verdict (the document path CON-gate-chain carves out — no code gates apply); the finding's doc mutation, its review creation, and its rework resubmission are each write-ahead and keyed-replayed exactly like code and completion submissions
        - { name: review, type: string }  # opaque tracker review id once submitted — restart-safe polling, resubmission, and merge
        - { name: review_submission_key, type: string }  # discriminated by run kind: code reviews derive from (run, head commit, gate attempt) — an integration that leaves the commit unchanged still yields a fresh key, so replay can never return a prior (possibly consumed) review when a fresh one is required — while research reviews derive from (run, finding document version), the document being their deliverable and the research path having no commits or gate attempts — every review-creating call (initial submission, post-merge fresh review) persists this key with state submitting BEFORE calling sutra and sends it as the request's Idempotency-Key; recovery REPLAYS the persisted request under the same key — sutra returns the original response for a landed request and creates otherwise — so exactly one review exists either way, never orphaned, never duplicated
        - { name: gate_attempt, type: integer, required: true }  # init 0; incremented atomically each time a new gate-chain attempt freezes its gated_base — chain satisfaction requires every result to carry THIS attempt, so an integration that leaves the branch head unchanged still invalidates prior passes
        - { name: gated_base, type: string }  # FROZEN per gate-chain attempt: captured once when the attempt starts, and every gate of the attempt validates against exactly this base — a gate observing a different default head ABORTS the attempt, forcing integration and a complete rerun, so no chain ever mixes bases; the merge preflight requires the default branch to still equal this frozen value, and the merge itself CASes against it
        - { name: close_approval_event, type: string }  # immutable id of the approval event the pending ticket close acts on — code runs copy it from the merge attempt, research runs from the finding review's approval; a reversal-then-reapproval at the same revision is a new event and therefore a fresh close key
        - { name: ticket_close_key, type: string }  # deterministic per (run, review, approved revision, approval event) — persisted when the run enters completing; the close names the review AND that revision, and a cached conflict can never replay against a later approval
        - { name: close_review, type: string }  # the review the close names, persisted atomically with the key and completing state — code runs copy it from the merge attempt, research runs from the approved finding review
        - { name: close_revision, type: integer }  # the approved revision the close expects, persisted with the key — recovery reproduces the exact revision-fenced request for code and research runs alike, never a later revision under the old key, sent as the ticket-complete transition's Idempotency-Key; a close that landed before a crash replays to its original success, never a close-used conflict, and the run advances to closed
        - { name: review_submission_commit, type: string }  # immutable — the pinned head commit the pending submission names, persisted atomically with the key and submitting state; replay reproduces the ORIGINAL request from the persisted fields, so a branch that moved after the crash can never smuggle an ungated commit under the old key
        - { name: review_submission_session, type: string }  # immutable — the session id the pending submission stamps, persisted with the key; recovery terminates crashed DevSessions and starts fresh ones, so replay MUST read the session from here, never from the current session — feedback routing stays intact
        - { name: finding_doc_key, type: string }  # research runs — deterministic per (run, finding revision), rotated for each rework revision; persisted with finding_pending_ref BEFORE the doc-version mutation, so keyed replay recovers the same version, never a duplicate
        - { name: finding_pending_ref, type: string }  # reference to the prepared finding content, persisted with the key
        - { name: finding_doc, type: string }  # the returned document-version id, recorded transactionally after the keyed doc mutation — the persisted deliverable the finding review names, and what recovery reads instead of re-deriving anything; the review then rides the ordinary review_submission machinery
        - { name: review_submission_state, type: enum, required: true, values: [none, submitting, submitted, resubmitting] }  # write-ahead marker around review creation AND resubmission; resubmitting is entered transactionally with its key, expected revision, and pinned commit before sutra's resubmit call
        - { name: review_resubmission_event, type: string }  # immutable — the changes-requested verdict event this rework answers, persisted atomically with the other resubmission fields; sent as the request's expected_verdict_event, so replay reconstructs the exact fence and stale rework after a verdict ABA rejects
        - { name: review_resubmission_key, type: string }  # deterministic per (run, review, expected revision, the answered verdict event, PLUS the gate attempt for code runs or the pending document version for research runs) — a corrected attempt after a pre-mutation conflict (a moved default head, a rejected base) arrives under a bumped gate attempt or a fresh document version and therefore a fresh key, so a cached 409 can never poison the retry; sent as the resubmit call's Idempotency-Key — recovery replays under it, sutra returning the original response if the resubmission landed and performing it otherwise, so the revision advances exactly once
        - { name: review_resubmission_revision, type: integer }  # the current revision the pending resubmission expects; the response's revision reconciles against expected+1
        - { name: review_resubmission_commit, type: string }  # immutable — the fully-gated head commit the pending resubmission names; replay reproduces the original request even if the branch moved after the crash
        - { name: review_resubmission_doc, type: string }  # document deliverables — the NEW document version the pending resubmission names, recorded under the rotated doc key BEFORE the resubmit replays; finding_doc advances to it only after the resubmission lands, so recovery always knows which version the pending mutation intends
        - { name: review_resubmission_session, type: string }  # immutable — the session id the pending resubmission records, persisted with the key; replay stamps this, never a fresh recovery session, so feedback routing survives recovery
        - { name: round_limit, type: integer, required: true }  # impasse limit snapshotted from configuration at run creation and used for the run's lifetime — a config change or restart never moves a live run's threshold
        - { name: workspace, type: ref, ref: ENT-workspace }
        - { name: error, type: string }  # durable cause whenever the run parks awaiting-operator — binding ambiguity, unresolvable or snapshot-less mapping, a created worktree gone missing, exactly what the operator inbox displays (cleanup refusals live on the Workspace row instead — cleanup runs after the run is terminal, and surfacing them there preserves closed and cancelled states)
        - { name: started, type: datetime }
        - { name: finished, type: datetime }
    - id: ENT-workspace
      name: Workspace
      description: >-
        Write-ahead like every other side effect: the row — with its
        deterministic path, branch, and the default-branch base commit
        the branch is cut from — is persisted in state pending BEFORE
        git creates anything; creation flips it to created
        transactionally. Recovery therefore always discovers a
        crash-window worktree from the pending row (probe the recorded
        path, adopt what matches, recreate what is absent) and can
        verify the promised base — no orphaned worktree is ever
        undiscoverable. The two states recover differently: a PENDING
        row with no worktree simply recreates (creation never proven),
        while a CREATED row whose worktree is missing or inconsistent
        surfaces the discrepancy — proven state has vanished, and
        silently recreating it would hide whatever destroyed it.
      fields:
        - { name: path, type: string, required: true }
        - { name: branch, type: string, required: true }
        - { name: base_commit, type: string, required: true }  # full object id of the default-branch commit the branch is cut from; persisted pre-creation
        - { name: state, type: enum, required: true, values: [pending, created] }
        - { name: ticket, type: string, required: true }
        - { name: created, type: datetime, required: true }
        - { name: cleanup_error, type: string }  # durable cause when cleanup refuses — a dirty worktree — listed by the operator inbox without touching the run's terminal state
        - { name: removed_at, type: datetime }
    - id: ENT-merge-attempt
      name: MergeAttempt
      description: >-
        Durable entry in the per-target merge queue. Created when an
        approval event arrives (attempt_key — target, build, review id,
        revision, AND the immutable approval-event id — makes replays
        collide instead of duplicating while re-approval after reversal
        at the same revision still enqueues its own attempt, and the
        persisted review and revision tell recovery exactly
        which approval to consume), ordered by created; the queue head
        acquires the target's merge lock by CAS on
        BuildTarget.merge_lock (absent -> this attempt), and ONLY the lock
        holder preflights, consumes, and merges — two simultaneous
        approvals can never both consume: the loser waits queued, then
        preflights against the moved base and takes the
        integrate-rerun-fresh-review path without consuming anything.
        The lock releases transactionally with the attempt reaching
        merged or aborted; recovery inspects the holder's durable state
        and either resumes its exact step or releases the lock.
      fields:
        - { name: attempt_key, type: string, required: true, unique: true }  # deterministic per (target_key, build, review, revision, approval event id) — the review id disambiguates successive fresh reviews, and the immutable approval-event id disambiguates re-approval after reversal at the same revision, so an aborted attempt never blocks a later approval from enqueueing
        - { name: target_key, type: string, required: true }
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: review, type: string, required: true }  # opaque tracker review id whose approval this attempt consumes; recovery reads it and the revision from the row, never inferring which approval was meant
        - { name: revision, type: integer, required: true }  # the approved revision the attempt expects at consumption
        - { name: approval_event, type: string, required: true }  # immutable id of the approval event that created this attempt
        - { name: expected_base, type: string }  # the frozen gated_base the preflight validated; the merge CAS targets exactly this
        - { name: consume_key, type: string }  # Idempotency-Key for the consumption call, persisted on entering consuming — keyed replay on recovery
        - { name: merge_commit, type: string }  # the resulting merge commit, recorded when the CAS push lands
        - { name: state, type: enum, required: true, values: [queued, holding, consuming, consumed, merging, merged, aborted] }  # write-ahead around each side effect: consuming before the keyed sutra consumption, consumed after; merging before the CAS push, merged with merge_commit after — recovery reads the exact step and resumes it, never conflating attempts
        - { name: created, type: datetime, required: true }
        - { name: resolved, type: datetime }
    - id: ENT-attribution-ambiguity
      name: AttributionAmbiguity
      description: >-
        Durable record of an active ticket that no attribution source
        claims in a multi-mapping project. Detection upserts on the
        deterministic key, the inbox lists EVERY unresolved row — open,
        resolving, conflicting, and adopted alike — and the operator
        resolves one by parenting the ticket under a target's epic —
        the resolution action, itself write-ahead: the selected target
        and the parenting mutation's idempotency key persist with state
        resolving BEFORE sutra is called, recovery replays the keyed
        mutation and stamps resolved transactionally only once the
        parenting, epoch advance, and cascade reconciliation have all
        completed — suppression holds through resolving AND conflicting,
        and a crash after the relation lands but before the stamp can
        never strand an open inbox entry or prematurely release a
        candidate. The parenting call runs the SAME conflict-aware
        lifecycle as new-work advances: a concurrent parent found on
        re-read is fed back through the target-attribution algorithm —
        a parent attributing to exactly ONE target is ADOPTED —
        with the evidence matched to HOW it attributed: a parent that is
        the target's epic or verified as its descendant carries sutra's
        attach-invariant guarantee that the epic reopened, recorded as
        external cascade evidence — ONLY this case adopts:
        selected_target updates and the row moves to the distinct
        ADOPTED state in one transaction. A unique attribution through
        plan membership or run binding whose parent sits OUTSIDE the
        epic proves no such cascade: the row records the durable
        explicit-reopen obligation, executes the keyed reopen, and
        routes to CONFLICTING with the observed parent — the
        operator-authorized reclaim lifecycle must reparent the ticket
        beneath the epic before the row can resolve, so resolution can
        never precede reparenting and later reattachment never fights
        an entrenched foreign parent. For the adopted case — the prior key's
        request targeted a different epic and is dead, and adopted
        recovery resumes ONLY the adopted target's epoch advance and
        cascade reconciliation, never an attachment replay (the ticket
        already has its parent; replaying would conflict with sutra's
        one-parent invariant forever); the row
        stamps resolved only after THAT target's epoch advance and
        cascade reconciliation complete, so resolution can never wake
        the wrong target or skip the adopted one's reconciliation; a
        parent attributing to none or several
        retains a conflicting ambiguity, suppression intact, with the
        observed parent and the attribution failure recorded, because
        sutra permits arbitrary issues as parents — and reselection over
        that foreign parent runs the operator-authorized reclaim
        lifecycle (recorded relation, keyed generation-rotated removal
        reconciled first, parent changes re-read and re-authorized)
        BEFORE the keyed attachment to the selected epic, since sutra's
        one-parent invariant would otherwise reject the attachment
        indefinitely;
        a permanent conflict records conflicting with its code and
        details in resolution_error, and
        the operator reselects — rotating resolution_generation and key
        atomically — or returns the row to open for a fresh choice, so
        no cached conflict can suppress every candidate forever. A
        re-detected same ticket REOPENS its row, never duplicating —
        and reopening atomically clears the prior resolution (selected
        target, error, conflict cause) and rotates resolution_generation
        and resolution_key, so re-selecting even the same target issues
        a fresh mutation and can never replay a stale success from a
        relation that has since been removed.
      fields:
        - { name: ambiguity_key, type: string, required: true, unique: true }  # deterministic per (project_key, ticket)
        - { name: project_key, type: string, required: true }
        - { name: ticket, type: string, required: true }
        - { name: selected_target, type: string }  # persisted with state resolving, before the parenting call
        - { name: resolution_key, type: string }  # the parenting mutation's Idempotency-Key, derived per (row, resolution_generation) and rotated with it atomically — recovery replays under it
        - { name: resolution_generation, type: integer }  # init 0; rotated atomically with the key on reselection after a conflict AND on reopening a resolved row, so no cached result — conflict or success — ever replays
        - { name: resolution_error, type: string }  # the conflicting cause — a permanent mutation conflict's code and details, or the attribution failure for a concurrent parent mapping to zero or several targets — what recovery and the inbox read
        - { name: observed_parent, type: string }  # the concurrent parent found on re-read when its attribution failed; recorded with resolution_error so the operator sees exactly what holds the ticket
        - { name: reclaim_relation, type: string }  # reselection over a foreign parent — the observed relation recorded with the operator's authorization, before any call
        - { name: reclaim_removal_key, type: string }  # keyed removal of the foreign parent, derived per (row, reclaim_generation) and rotated with it atomically
        - { name: reclaim_generation, type: integer }  # init 0; rotates atomically with the removal key on correction and whenever the authorized relation changes
        - { name: reclaim_state, type: enum, values: [pending, failed, removed] }  # write-ahead around the removal — the SAME operator-authorized reclaim lifecycle as new-work parenting conflicts, parent changes re-read and re-authorized; only after removed does the keyed attachment to the selected epic proceed; a failed removal records its cause in resolution_error, and the inbox shows this state so failed rows are never invisible
        - { name: state, type: enum, required: true, values: [open, resolving, conflicting, adopted, resolved] }  # adopted is the post-adoption phase: the ticket already has its parent, so recovery resumes ONLY the adopted target's epoch advance and cascade reconciliation — never an attachment replay, which would conflict with sutra's one-parent invariant forever
        - { name: created, type: datetime, required: true }
        - { name: resolved, type: datetime }
    - id: ENT-stall
      name: Stall
      description: >-
        Durable record of a build stall — nothing workable, nothing in
        flight, epic cannot close. Created when the orchestrator detects
        the condition, carrying its cause; it is what the operator inbox
        lists, and resolution stamps it rather than deleting it.
      fields:
        - { name: stall_key, type: string, required: true, unique: true }  # deterministic from (target_key, completion_epoch) — detection UPSERTS on it, so polls, concurrent detectors, and restart recovery converge on one row; re-detection of a resolved same-epoch stall reopens that row; a later epoch's stall is a new key
        - { name: target_key, type: string, required: true }
        - { name: cause, type: string, required: true }
        - { name: state, type: enum, required: true, values: [open, resolved] }
        - { name: created, type: datetime, required: true }
        - { name: resolved, type: datetime }
    - id: ENT-agent-invocation
      name: AgentInvocation
      description: >-
        Role-neutral record of every agent execution — PM, SA, PO, or
        dev — created when the invocation starts. Records the tier the
        routing configuration named AND the resolved model actually
        used, so AC-tier-observed is provable for agents that run
        before any BuildRun exists: exactly ONE scope reference is
        present — plan (and no build) for PM invocations, build (and no
        plan) for SA, PO, and dev invocations — enforced at write time
        (the format cannot express conditional requiredness), so no
        record is orphaned or double-scoped. DevSession remains the dev-loop's transcript
        anchor; this is the execution ledger.
      fields:
        - { name: role, type: enum, required: true, values: [pm, sa, po, dev] }
        - { name: tier, type: string, required: true }  # what the routing configuration named
        - { name: model, type: string, required: true }  # the resolved model that actually ran
        - { name: session, type: string, required: true }
        - { name: build, type: ref, ref: ENT-build-run }  # run-scoped invocations
        - { name: plan, type: ref, ref: ENT-plan }  # plan-scoped invocations (PM)
        - { name: started, type: datetime, required: true }
        - { name: ended, type: datetime }
    - id: ENT-dev-session
      name: DevSession
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: session, type: string, required: true }
        - { name: agent, type: string, required: true }
        - { name: tier, type: string, required: true }
        - { name: started, type: datetime, required: true }
        - { name: ended, type: datetime }
        - { name: transcript_ref, type: string }  # immutable reference to the transcript content, persisted with the import key BEFORE the importThread call — replay reproduces the exact request
        - { name: thread_import_key, type: string }  # deterministic per session; sent as the importThread call's Idempotency-Key — recovery replays under it, sutra returning the original thread for a landed import and creating otherwise, exactly one thread either way
        - { name: thread_import_state, type: enum, required: true, values: [none, importing, imported] }  # write-ahead marker around the import; advanced before the call, stamped with thread_ref after
        - { name: thread_ref, type: string }  # sutra thread id once the transcript imports
    - id: ENT-review-round
      name: ReviewRound
      description: >-
        Restart-safe by write-ahead, grounded in the R1 spike facts. The
        operation_key is derived deterministically from (build, commit,
        gate attempt) — the attempt keeps a rerun after integration
        distinct even at an unchanged commit — so
        its uniqueness makes the write-ahead insert idempotent — a
        concurrent or recovered replay collides instead of duplicating.
        Enqueue happens after the insert; roborev offers no caller
        correlation key, so provenance of a listed job is unprovable —
        therefore kriya NEVER adopts, responds to, cancels, or closes a
        job whose id it did not record from its own enqueue return.
        Claim state lives in enqueue_state, never in external_id (which
        only ever holds a real recorded id). Lifecycle: unclaimed ->
        claimed (CAS, stamping claimed_at) -> enqueued (id recorded).
        Only the claim winner calls roborev; concurrent workers lose the
        CAS and stand down. An expired claim (claimed_at older than the
        lease window) is NEVER auto-reclaimed — roborev offers no fencing
        token, so a merely-slow claimant could still enqueue after a
        reclaim and duplicate the job. Instead the round surfaces in the
        TUI for operator reconciliation: confirm whether an orphan job
        exists, then reset the claim — a reset increments claim_generation.
        Every claim carries its generation, and recording an enqueue
        result is a CAS that requires the claimant's generation to still
        be current: a merely-slow claimant that enqueues after a reset
        loses that CAS — and every call is bracketed by a durable
        EnqueueAttempt row written BEFORE roborev is invoked (id absent,
        pending) and completed with the returned id afterward. A pending
        attempt that never completes is therefore itself the durable
        may-have-orphaned marker, surviving any crash window including a
        stale claimant dying mid-call. Completing an attempt and
        advancing its round to enqueued happen in ONE store transaction
        (same durable store, so atomicity is free); and recovery promotes
        before it resets — a completed attempt of the round's current
        generation is folded into the round (id recorded, state
        enqueued) before reset or any further claim is permitted, so a
        proven kriya-owned job is never abandoned to duplication. The TUI's unresolved list is:
        pending attempts, plus completed attempts whose id is not their
        round's accepted external_id; the operator resolves entries after
        checking roborev, stamping resolved. Resolution and reset are
        only offered when the attempt's claimant is not live — decidable
        because kriya is a single process whose claimants are its own
        tasks, and after a crash every claimant is conclusively dead.
        As a backstop, a late completion is a CAS that atomically reopens
        a resolved attempt (clearing resolved while recording the id),
        returning it to the unresolved list rather than hiding it.
        One residual is accepted EXPLICITLY rather than pretended away:
        a dead claimant's already-sent request may still land server-side
        after resolution, and without a server idempotency key (absent,
        per the R1 spike) no client protocol can prevent it. Therefore
        resolving a pending attempt moves it to a permanent watch rather
        than oblivion — the review bridge (the sole roborev seam)
        periodically cross-checks roborev's job list for each watched
        round's commit and persists any job id kriya never recorded as an
        OrphanObservation row; the TUI renders those rows:
        display-only, never acted on, never silently forgotten. Recovery is therefore: enqueued -> resume
        polling external_id; unclaimed -> claim and enqueue; expired
        claim -> operator. Orphan jobs are never touched and are
        surfaced in the TUI.
        Rounds are unique per (build, commit, gate attempt) via the
        derived key, so a rebuilt commit gets its own round and a new
        attempt at an unchanged commit gets a fresh one — a prior
        attempt's clean round never satisfies the new attempt.
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: commit, type: string, required: true }  # canonical full object id
        - { name: operation_key, type: string, required: true, unique: true }  # deterministic hash of (build, commit, gate attempt) — the write-ahead idempotency handle; the attempt keeps a rerun after integration distinct even when the branch head is unchanged
        - { name: attempt, type: integer, required: true }  # the gate attempt this round belongs to
        - { name: enqueue_state, type: enum, required: true, values: [unclaimed, claimed, enqueued] }
        - { name: claimed_at, type: datetime }  # lease stamp; expired claims go to operator reconciliation, never auto-reclaim
        - { name: claim_generation, type: integer, required: true }  # fencing token — incremented per claim/reset; stale claimants lose the recording CAS
        - { name: external_id, type: string, unique: true }  # roborev job/review id recorded from our own enqueue return — the only ids kriya ever acts on
        - { name: verdict, type: enum, required: true, values: [pending, pass, findings] }
        - { name: findings, type: json }
        - { name: response_body, type: string }  # immutable prepared response payload, persisted in the same transaction that enters `commenting`; recovery replays exactly this stored payload
        - { name: response_state, type: enum, required: true, values: [none, commenting, commented, closing, closed] }  # write-ahead around the comment and close calls; advanced BEFORE each external mutation, stamped after. Recovery from `commenting` re-issues the stored response_body — comments are additive and append-only, so a rare duplicate is benign, while a silently missing response is not; recovery from `closing` re-issues the close, treating already-closed as success. A round is therefore never left open by a crash between comment and close.
        - { name: created, type: datetime, required: true }
    - id: ENT-enqueue-attempt
      name: EnqueueAttempt
      description: Write-ahead, append-only bracket around every roborev enqueue — created pending BEFORE the call, completed with the returned id after; a never-completed pending row is the durable may-have-orphaned marker.
      fields:
        - { name: round, type: ref, ref: ENT-review-round, required: true }
        - { name: generation, type: integer, required: true }
        - { name: external_id, type: string }  # absent while pending; filled from the enqueue return
        - { name: created, type: datetime, required: true }
        - { name: resolved, type: datetime }  # operator-stamped after reconciling against roborev
    - id: ENT-orphan-observation
      name: OrphanObservation
      description: Durable record of a roborev job discovered for a watched round's commit whose id kriya never recorded — the persisted form of the late-orphan watch. Display-only; never acted on.
      fields:
        - { name: observation_key, type: string, required: true, unique: true }  # derived hash of (round, external_id) — the watch upserts, so re-polling never duplicates and resolved rows never reappear
        - { name: round, type: ref, ref: ENT-review-round, required: true }
        - { name: external_id, type: string, required: true }
        - { name: discovered, type: datetime, required: true }
        - { name: resolved, type: datetime }  # operator-stamped after checking roborev
    - id: ENT-gate-result
      name: GateResult
      fields:
        - { name: result_key, type: string, required: true, unique: true }  # derived hash of (build, module, gate, commit, attempt) — upserted, so reruns never duplicate and recovery can prove per-module completeness; results from a prior attempt never satisfy the chain
        - { name: attempt, type: integer, required: true }  # the gate attempt this result belongs to
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: module, type: string, required: true }  # the target spec's module id whose effective command ran
        - { name: gate, type: enum, required: true, values: [test, structure, typing, branch-coverage, mutation, arch] }
        - { name: commit, type: string, required: true }  # full object id the gate ran against — stale results never satisfy the chain
        - { name: passed, type: boolean, required: true }
        - { name: detail, type: json }
        - { name: created, type: datetime, required: true }
    - id: ENT-intervention
      name: Intervention
      description: >-
        Run-scoped record of a non-scope SA intervention — the durable
        lifecycle AC-sa-resume promises. Created when the impasse
        trigger fires, it preserves what fired it, the findings history
        handed over, the SA's direction, and how the resumed run fared;
        recovery and resume read this row, never transient state. Scope
        escalations remain Escalation rows — an intervention that turns
        out to need scope records escalated and hands off.
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: trigger, type: enum, required: true, values: [round-limit, agent-declared] }
        - { name: findings, type: json }  # the findings history handed to the SA
        - { name: direction, type: string }  # the SA's recorded direction
        - { name: state, type: enum, required: true, values: [open, directed, resumed, escalated] }
        - { name: outcome, type: string }  # how the resumed run fared
        - { name: created, type: datetime, required: true }
        - { name: resolved, type: datetime }
    - id: ENT-escalation
      name: Escalation
      description: What the TUI surfaces to the operator.
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: kind, type: enum, required: true, values: [impasse, scope] }
        - { name: question, type: string, required: true }
        - { name: state, type: enum, required: true, values: [open, answered] }
        - { name: answer, type: string }
        - { name: raised_by, type: string, required: true }
        - { name: created, type: datetime, required: true }
        - { name: resolved, type: datetime }
    - id: ENT-validation
      name: Validation
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: attempt, type: integer, required: true }  # the gate attempt this verdict belongs to — a rerun after integration needs a fresh PO pass
        - { name: verdict, type: enum, required: true, values: [satisfied, not-satisfied, tests-gamed] }
        - { name: commit, type: string, required: true }  # full object id the validation covered
        - { name: notes, type: string }
        - { name: created, type: datetime, required: true }
    - id: ENT-learning
      name: Learning
      description: >-
        project_key is present exactly when scope is project — a project
        learning without its key is rejected at write time. Matching for
        feed-forward runs on the module and pattern tags; provenance is
        explicit via source_kind plus its reference fields — for every
        captured kind, source_run and source_ref are required; the
        trigger anchor is source_commit (the triggering head) for
        code-backed corrections and source_doc (the finding document
        version) for research-backed ones — exactly one of the two,
        matching the run kind; operator entries carry none of them. All
        of this is enforced at write time (the format cannot express
        conditional requiredness). remediation_commit is always
        optional — stamped later if a corrective commit lands.
      fields:
        - { name: scope, type: enum, required: true, values: [project, global] }
        - { name: project_key, type: string }  # required when scope is project, absent when global — enforced at write time (the format cannot express conditional requiredness)
        - { name: lesson, type: string, required: true }
        - { name: module, type: string, required: true }  # matching tag — target-spec module id the lesson concerns
        - { name: pattern, type: string, required: true }  # matching tag — the failure pattern the lesson concerns
        - { name: source_kind, type: enum, required: true, values: [review-finding, gate-failure, sa-direction, po-rejection, operator] }
        - { name: source_run, type: ref, ref: ENT-build-run }  # absent exactly when source_kind is operator
        - { name: source_commit, type: string }  # code-backed corrections — full object id of the TRIGGERING head, the commit that was reviewed, gated, or validated when the lesson arose
        - { name: source_doc, type: string }  # research-backed corrections — the finding document version the lesson arose from; exactly one of source_commit/source_doc is present on captured learnings, matching the run kind
        - { name: remediation_commit, type: string }  # optional; stamped later when a corrective commit lands
        - { name: source_ref, type: string }  # the finding, gate result, or event that produced it
        - { name: source_session, type: string }
        - { name: created, type: datetime, required: true }
    - id: ENT-context-bundle
      name: ContextBundle
      description: Exactly what a dev agent was given — the debug record for bad builds and the audit for the learning loop.
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: content, type: json, required: true }
        - { name: created, type: datetime, required: true }

apps:
  - id: APP-kriya
    name: kriya
    modules: [MOD-planner, MOD-orchestrator, MOD-workspace, MOD-dev-loop,
              MOD-review-bridge, MOD-gates, MOD-architect, MOD-owner,
              MOD-context, MOD-tracker-client, MOD-cli, MOD-tui]

