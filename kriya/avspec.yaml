avspec: "0.3"

project:
  name: kriya
  description: >-
    The build engine of spork. Takes a ready avspec, decomposes it into
    tracer-bullet tickets in sutra (BDD acceptance criteria on every
    ticket), and drives coding agents through a pair-programming loop —
    small commits, continuous review, fix, recommit — then mutation
    testing, product-owner validation, and a sutra Review for human
    approval. Loops until the app is complete. Kriya: Sanskrit, a
    deliberate, practiced sequence of actions.
  status: draft

constitution:
  - id: CON-test-first
    statement: No behavior is implemented before the test mapped to its acceptance criterion exists and fails.
  - id: CON-dependency-flow
    statement: Dependencies flow one way between layers; no back-edges.
  - id: CON-no-secrets
    statement: No secrets in source; configuration is injected at runtime.
  - id: CON-idempotent-mutations
    statement: Mutating operations are idempotent; agents retry aggressively and replays must be safe.
  - id: CON-pair-programming
    statement: Work moves in small commits with review latency measured in minutes, not as end-stage pull requests.
  - id: CON-gate-chain
    statement: "The gate chain is inviolable and no agent may skip a stage: review pass -> mutation testing -> product-owner validation -> sutra Review approval -> merge."
  - id: CON-role-separation
    statement: The system architect never writes code; the coding agent never decides scope; scope decisions escalate to the operator; the product owner alone holds the big picture.
  - id: CON-buy-over-build
    statement: Solved problems use existing, maintained tools — reviews are roborev itself, not a reimplementation, exactly as tests use an existing test framework.
  - id: CON-deterministic-orchestrator
    statement: >-
      The orchestrator is a deterministic state machine — it sequences the
      gate chain from an explicit state table and delegates all judgment to
      the agent modules. If a change requires the orchestrator to decide
      anything, the change is wrong. (Prior art: in earlier attempts the
      orchestrator became a god module; the state table and the structural
      lint limits are the correction.)
  - id: CON-risk-first
    statement: Planning orders work by risk; a risk item is validated by research or a spike before anything that depends on it is built, so we never code ourselves into a corner.

# Risk register — validated before kriya's own build begins:
#   R1: Can roborev be used as-is for the pair-programming loop (drive it
#       programmatically, consume verdicts, close findings) without forking?
#       Validate via spike against the roborev CLI/daemon. Owner is in
#       contact with the maintainers.
#   R2: Can mutation testing (pytest-gremlins-class) run incrementally per
#       ticket at acceptable speed, or only as a slower periodic gate?
#   R3 (RETIRED 2026-08-04 by spike): gobco detects uncovered arms but
#       exits 0; wrapped with an awk check it gates correctly (exit 1 on
#       any uncovered arm). The validated compound command is pinned in
#       sutra's stack, hardened with pipefail and a seen-summary check so
#       tool failure or silence also gates (all four modes spike-tested). Residual note for R1's spike: the roborev-as-is
#       validation must also confirm a recovery/reconciliation path for
#       in-flight reviews (e.g. listing jobs by commit SHA).

requirements:
  - id: REQ-spec-intake
    title: Consume a ready avspec — verify it, refuse anything less
    rationale: Ready means buildable without further prompting; kriya holds the spec to its own claim.
  - id: REQ-decompose
    title: PM agent decomposes the spec into tracer-bullet tickets in sutra
    rationale: Thin end-to-end slices first; BDD acceptance criteria on every ticket; blocks/blocked-by wired for parallelism.
  - id: REQ-risk-first
    title: Risk items are identified and retired first via spike/research tickets
    rationale: Risk and spike labels plus blocking relations ensure nothing dependent starts before its risk is retired.
  - id: REQ-parallel-build
    title: Pop tickets off sutra work stacks and run parallel dev agents where relations allow
  - id: REQ-workspaces
    title: Isolated workspace (worktree/branch) per ticket
  - id: REQ-pair-loop
    title: Pair-programming loop — small commits, roborev reviews, fix, recommit until pass
    rationale: Kriya drives the actual roborev tool (enqueue on commit, poll verdicts, respond, close) per CON-buy-over-build.
  - id: REQ-sa-agent
    title: System architect agent resolves impasses and escalates scope to the operator
    rationale: Highest-tier agent; writes no code; the escape valve when dev and review cannot converge.
  - id: REQ-context-assembly
    title: Context manager assembles each dev agent's context and toolset per ticket
  - id: REQ-learning-loop
    title: Mistakes become persistent learnings fed into future builds
    rationale: Project-specific and cross-project; captured as they happen, not post-mortem.
  - id: REQ-gate-structure
    title: Structural linting with hard limits on the target app, via the target's stack.commands.lint
    rationale: Google-style-guide strictness — max module size and kin; agents love god modules and do not mind strict rules.
  - id: REQ-gate-typing
    title: Typing everywhere on the target app
  - id: REQ-gate-branch-coverage
    title: Branch coverage — every conditional arm, not an overall percentage
    rationale: Runs the target's stack.commands.coverage; targets that omit it are rejected at spec intake.
  - id: REQ-gate-mutation
    title: Mutation testing proves the tests test
    rationale: Runs the target's stack.commands.mutation; targets that omit it are rejected at spec intake.
  - id: REQ-po-validation
    title: Product owner agent validates ACs are genuinely satisfied and tests are not gaming
    rationale: The PO holds the big picture the coding agent cannot have.
  - id: REQ-submit-review
    title: Submit a sutra Review, merge on approval, update ticket status
  - id: REQ-run-to-complete
    title: Loop until every ticket of the spec is complete
  - id: REQ-tier-routing
    title: Model-tier routing is configuration, not hardcoded
  - id: REQ-thread-capture
    title: Dev-agent transcripts auto-import into sutra's thread catalog, session-stamped
    rationale: Auditability plus fuel for the learning loop.
  - id: REQ-tui
    title: TUI overview — what is running now, what is queued, and where agents surface things to the operator
    rationale: The operator's most critical surface; escalations land here, not in a log file.

modules:
  - id: MOD-planner
    name: planner
    responsibility: PM agent — spec intake, tracer-bullet decomposition, risk-first ticketing.
    owns: [ENT-plan]
    boundaries: { may_import: [MOD-tracker-client] }
  - id: MOD-orchestrator
    name: orchestrator
    responsibility: The outer loop as a deterministic state machine — pops tickets, advances BuildRun states from an explicit state table, delegates every stage; no judgment, no agent conversations.
    owns: [ENT-build-run]
    boundaries: { may_import: [MOD-planner, MOD-workspace, MOD-dev-loop, MOD-gates, MOD-owner, MOD-tracker-client] }
  - id: MOD-workspace
    name: workspace
    responsibility: Worktree/branch lifecycle per ticket.
    owns: [ENT-workspace]
    boundaries: { may_import: [] }
  - id: MOD-dev-loop
    name: dev-loop
    responsibility: The heart — one pair-programming session; dev agent, commit cadence, fix rounds.
    owns: [ENT-dev-session]
    boundaries: { may_import: [MOD-context, MOD-review-bridge, MOD-architect] }
  - id: MOD-review-bridge
    name: review-bridge
    responsibility: The roborev seam — enqueue, poll verdicts, respond, close; buy-over-build boundary in one place.
    owns: [ENT-review-round]
    boundaries: { may_import: [] }
  - id: MOD-gates
    name: gates
    responsibility: Quality-gate runner — structural lint, typing, branch coverage, mutation testing via the target's stack commands.
    owns: [ENT-gate-result]
    boundaries: { may_import: [] }
  - id: MOD-architect
    name: architect
    responsibility: SA agent — impasse resolution and operator escalation; writes no code.
    owns: [ENT-escalation]
    boundaries: { may_import: [] }
  - id: MOD-owner
    name: owner
    responsibility: PO agent — AC validation, anti-gaming, vision.
    owns: [ENT-validation]
    boundaries: { may_import: [] }
  - id: MOD-context
    name: context
    responsibility: Context assembly per ticket and the learning store. Part of kriya for now; splits out only if ever used beyond spork.
    owns: [ENT-learning, ENT-context-bundle]
    boundaries: { may_import: [MOD-tracker-client] }
  - id: MOD-tracker-client
    name: tracker-client
    responsibility: The one module that speaks the issue tracker's API — sutra today, the seam where other trackers would plug in.
    boundaries: { may_import: [] }
  - id: MOD-cli
    name: cli
    responsibility: Command surface — start a build, inspect state.
    boundaries: { may_import: [MOD-planner, MOD-orchestrator] }
  - id: MOD-tui
    name: tui
    responsibility: Operator dashboard — live overview of running and queued work; where agents surface questions and escalations.
    boundaries: { may_import: [MOD-orchestrator, MOD-architect] }

# Kriya's store is the observability plane: the TUI reads it live and it is
# the post-mortem record of every build. Two exceptions are operational
# state that must survive restarts: BuildRun (crash recovery) and Learning
# (the point of the exercise). Sutra remains the system of record for the
# work itself; tracker-side records are referenced by opaque ids.
data:
  entities:
    - id: ENT-plan
      name: Plan
      description: The decomposition record tying an avspec to the tickets it produced.
      fields:
        - { name: target_spec, type: string, required: true }
        - { name: project_key, type: string, required: true }
        - { name: tickets, type: json, required: true }  # ordered tracker ids the decomposition produced
        - { name: created, type: datetime, required: true }
    - id: ENT-build-run
      name: BuildRun
      fields:
        - { name: ticket, type: string, required: true }  # opaque tracker id
        - { name: plan, type: ref, ref: ENT-plan, required: true }
        - { name: state, type: enum, required: true, values: [queued, dev-loop, gates, po-validation, review-submitted, awaiting-operator, merging, merged, failed] }  # one state per gate-chain stage — deterministic crash recovery, no skippable gates
        - { name: review, type: string }  # opaque tracker review id once submitted — restart-safe polling, resubmission, and merge
        - { name: workspace, type: ref, ref: ENT-workspace }
        - { name: started, type: datetime }
        - { name: finished, type: datetime }
    - id: ENT-workspace
      name: Workspace
      fields:
        - { name: path, type: string, required: true }
        - { name: branch, type: string, required: true }
        - { name: ticket, type: string, required: true }
        - { name: created, type: datetime, required: true }
        - { name: removed_at, type: datetime }
    - id: ENT-dev-session
      name: DevSession
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: session, type: string, required: true }
        - { name: agent, type: string, required: true }
        - { name: tier, type: string, required: true }
        - { name: started, type: datetime, required: true }
        - { name: ended, type: datetime }
        - { name: thread_ref, type: string }  # sutra thread id once the transcript imports
    - id: ENT-review-round
      name: ReviewRound
      description: Restart-safe by write-ahead — the row (with its caller-generated operation_key) is persisted BEFORE enqueueing; recovery replays by operation key and reconciles against roborev (e.g. jobs listed by commit) instead of enqueueing a duplicate. external_id is recorded once known.
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: commit, type: string, required: true }  # canonical full object id
        - { name: operation_key, type: string, required: true, unique: true }  # caller-generated before enqueue; the recovery/idempotency handle
        - { name: external_id, type: string }  # roborev job/review id, recorded once the enqueue returns
        - { name: verdict, type: enum, required: true, values: [pending, pass, findings] }
        - { name: findings, type: json }
        - { name: created, type: datetime, required: true }
    - id: ENT-gate-result
      name: GateResult
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: gate, type: enum, required: true, values: [structure, typing, branch-coverage, mutation] }
        - { name: commit, type: string, required: true }  # full object id the gate ran against — stale results never satisfy the chain
        - { name: passed, type: boolean, required: true }
        - { name: detail, type: json }
        - { name: created, type: datetime, required: true }
    - id: ENT-escalation
      name: Escalation
      description: What the TUI surfaces to the operator.
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: kind, type: enum, required: true, values: [impasse, scope] }
        - { name: question, type: string, required: true }
        - { name: state, type: enum, required: true, values: [open, answered] }
        - { name: answer, type: string }
        - { name: raised_by, type: string, required: true }
        - { name: created, type: datetime, required: true }
        - { name: resolved, type: datetime }
    - id: ENT-validation
      name: Validation
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: verdict, type: enum, required: true, values: [satisfied, not-satisfied, tests-gamed] }
        - { name: commit, type: string, required: true }  # full object id the validation covered
        - { name: notes, type: string }
        - { name: created, type: datetime, required: true }
    - id: ENT-learning
      name: Learning
      fields:
        - { name: scope, type: enum, required: true, values: [project, global] }
        - { name: project_key, type: string }
        - { name: lesson, type: string, required: true }
        - { name: source_session, type: string }
        - { name: created, type: datetime, required: true }
    - id: ENT-context-bundle
      name: ContextBundle
      description: Exactly what a dev agent was given — the debug record for bad builds and the audit for the learning loop.
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: content, type: json, required: true }
        - { name: created, type: datetime, required: true }

apps:
  - id: APP-kriya
    name: kriya
    modules: [MOD-planner, MOD-orchestrator, MOD-workspace, MOD-dev-loop,
              MOD-review-bridge, MOD-gates, MOD-architect, MOD-owner,
              MOD-context, MOD-tracker-client, MOD-cli, MOD-tui]

