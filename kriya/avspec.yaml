avspec: "0.3"

project:
  name: kriya
  description: >-
    The build engine of spork. Takes a ready avspec, decomposes it into
    tracer-bullet tickets in sutra (BDD acceptance criteria on every
    ticket), and drives coding agents through a pair-programming loop —
    small commits, continuous review, fix, recommit — then mutation
    testing, product-owner validation, and a sutra Review for human
    approval. Loops until the app is complete. Kriya: Sanskrit, a
    deliberate, practiced sequence of actions.
  status: draft

constitution:
  - id: CON-test-first
    statement: No behavior is implemented before the test mapped to its acceptance criterion exists and fails.
  - id: CON-dependency-flow
    statement: Dependencies flow one way between layers; no back-edges.
  - id: CON-no-secrets
    statement: No secrets in source; configuration is injected at runtime.
  - id: CON-idempotent-mutations
    statement: Mutating operations are idempotent; agents retry aggressively and replays must be safe.
  - id: CON-pair-programming
    statement: Work moves in small commits with review latency measured in minutes, not as end-stage pull requests.
  - id: CON-gate-chain
    statement: "The gate chain is inviolable and no agent may skip a stage: review pass -> mutation testing -> product-owner validation -> sutra Review approval -> merge."
  - id: CON-role-separation
    statement: The system architect never writes code; the coding agent never decides scope; scope decisions escalate to the operator; the product owner alone holds the big picture.
  - id: CON-buy-over-build
    statement: Solved problems use existing, maintained tools — reviews are roborev itself, not a reimplementation, exactly as tests use an existing test framework.
  - id: CON-deterministic-orchestrator
    statement: >-
      The orchestrator is a deterministic state machine — it sequences the
      gate chain from an explicit state table and delegates all judgment to
      the agent modules. If a change requires the orchestrator to decide
      anything, the change is wrong. (Prior art: in earlier attempts the
      orchestrator became a god module; the state table and the structural
      lint limits are the correction.)
  - id: CON-risk-first
    statement: Planning orders work by risk; a risk item is validated by research or a spike before anything that depends on it is built, so we never code ourselves into a corner.

# Story-phase coverage checklist (accumulated from range reviews — these
# protocol branches need ACs and scenarios when kriya's requirements get
# their stories): plan-head retries in each plan state (pending resumes,
# active completes, awaiting-operator preserved); queued-pop-to-build
# reconciliation before ownership classification; retirement of pending
# vs issued steps including id-less rows and the deferred-status fence;
# carried-forward pop race: ticket claimed mid-supersession and listed by
# both plans binds to the predecessor snapshot (deepest unstamped row),
# and binding SETS and retains the consumed stamp on walked-past rows so
# a later reopen binds to the head;
# per-module command semantics: complete and partial module stack
# overrides, blank effective commands, missing required commands, and
# recovery reading snapshot-pinned resolved commands rather than the
# mutable working tree;
# post-retirement reopen: a ticket carried into the current head binds
# the head; a ticket the successor OMITTED binds the nearest consumed
# row's plan and its snapshot (the decomposition that produced its ACs),
# never the head that dropped it; pop write-ahead refusal while any head
# is unactivated (global fence), and retry after activation.
#
# Risk register — validated before kriya's own build begins:
#   R1 (RETIRED 2026-08-04 by spike + session-long live use): roborev is
#       drivable as-is — enqueue (review), poll (show), respond (comment),
#       and close were all exercised programmatically throughout the spec
#       sessions. Spike facts: enqueue accepts NO caller correlation key,
#       and duplicate jobs for the same SHA ARE possible (no dedupe); but
#       `list` exposes jobs by SHA and `cancel` exists. Final protocol
#       (see ENT-review-round): kriya acts ONLY on ids recorded from its
#       own enqueue returns — no adoption, no cancellation of unproven
#       jobs; rare crash-window orphans are surfaced in the TUI.
#   R2: Can mutation testing (pytest-gremlins-class) run incrementally per
#       ticket at acceptable speed, or only as a slower periodic gate?
#   R3 (RETIRED 2026-08-04 by spike): gobco detects uncovered arms but
#       exits 0; wrapped with an awk check it gates correctly (exit 1 on
#       any uncovered arm). The validated compound command is pinned in
#       sutra's stack: gobco writes to a TMPDIR file removed with exit
#       status preserved, && carries tool failure, and awk requires the
#       coverage summary — POSIX sh, no pipefail (all modes spike-tested). R1's spike subsequently confirmed the
#       recovery constraints; the final protocol lives on ENT-review-round.

requirements:
  - id: REQ-spec-intake
    title: Consume a ready avspec — verify it, refuse anything less
    rationale: >-
      Ready means buildable without further prompting; kriya holds the spec
      to its own claim, and additionally requires that EVERY module's
      effective stack (its per-field override where present, the project
      stack otherwise) carries non-empty test, lint, typecheck, coverage,
      and mutation commands — the gate chain runs per module with these
      resolved commands, which are persisted into the SpecSnapshot at
      pin time so builds and recovery execute exactly what intake
      validated.
    acceptance:
      - id: AC-intake-ready
        statement: Pointing kriya at a project whose avspec verifies status ready with zero errors succeeds; a SpecSnapshot is pinned containing the full artifact set and every module's resolved effective commands.
        test: verification/REQ-spec-intake.feature#ready spec is pinned
      - id: AC-intake-refuse
        statement: A project that verifies draft, or with any error finding, is refused with the verify findings; no snapshot is pinned and nothing is enqueued.
        test: verification/REQ-spec-intake.feature#draft spec is refused
      - id: AC-intake-commands
        statement: A module whose effective stack (module override where present, project stack otherwise) is missing or blank on any of test, lint, typecheck, coverage, or mutation is refused, naming the module and the missing command — even when avspec verify alone reports ready.
        test: verification/REQ-spec-intake.feature#missing module command refuses intake
      - id: AC-intake-snapshot-authority
        statement: Working-tree edits to the spec never change what a build or recovery executes; both read the bound snapshot's pinned artifacts and resolved commands. A spec change enters the pipeline only through a new intake.
        test: verification/REQ-spec-intake.feature#working tree edits do not change a pinned build
      - id: AC-intake-reintake
        statement: Intake of an amended ready spec for a project with an existing snapshot pins a new snapshot — prior snapshots stay immutable and referenced by their builds — and hands it to decomposition through the supersession path, not a fresh start.
        test: verification/REQ-spec-intake.feature#amended spec pins a new snapshot
  - id: REQ-decompose
    title: PM agent decomposes the spec into tracer-bullet tickets in sutra
    rationale: Thin end-to-end slices first; BDD acceptance criteria on every ticket; blocks/blocked-by wired for parallelism.
    acceptance:
      - id: AC-decompose-tracer
        statement: Tickets are thin end-to-end slices ordered so a walking skeleton lands first; every ticket carries BDD acceptance criteria traceable to the snapshot's REQ/AC ids.
        test: verification/REQ-decompose.feature#tracer bullets carry traceable acceptance criteria
      - id: AC-decompose-epic
        statement: Decomposition ensures an umbrella epic per build target exists and parents every created ticket under it; the epic persists across supersessions with no re-parenting and closes only when the build completes.
        test: verification/REQ-decompose.feature#one epic umbrellas the build target
      - id: AC-decompose-relations
        statement: blocks/blocked-by relations are wired — spike and risk tickets block their dependents, independent tickets stay unblocked for parallel work.
        test: verification/REQ-decompose.feature#relations wire risk ordering and parallelism
      - id: AC-decompose-phased
        statement: Decomposition runs in plan-wide phases — create all tickets, wire relations, assign last — with barriers between phases so no ticket is workable before its relations exist; completed is stamped only after the final barrier.
        test: verification/REQ-decompose.feature#phases run behind plan-wide barriers
      - id: AC-decompose-idempotent
        statement: "Every request resolves its decomposition key against existing plans before any PlanHead logic, and the resolution is state-aware: active-without-completed resumes remaining phases, pending resumes, completed and superseded return the historical result, awaiting-operator is preserved untouched."
        test: verification/REQ-decompose.feature#same-key retries are state-aware
      - id: AC-decompose-supersede
        statement: Decomposing against an existing head atomically creates a superseding candidate — predecessor pointed at the head it beat, head marked superseded, fence incremented, PlanHead moved with a generation bump — then retires the predecessor, stamping every predecessor row consumed with disposition retired or carried-forward before the new plan activates.
        test: verification/REQ-decompose.feature#supersession retires the predecessor before activating
      - id: AC-decompose-retirement
        statement: Retirement distinguishes pending from issued work — pending tickets are retired in sutra via expected_status=open conditional transitions with generation-scoped defer keys, an already-deferred fresh read counts as fence established with no retry, and rows whose ticket was never created retire with no sutra call.
        test: verification/REQ-decompose.feature#retirement distinguishes pending from issued work
      - id: AC-decompose-operator-recovery
        statement: "Each awaiting-operator state has a defined forward-only recovery: an unactivated head restores to pending with predecessor-row resets and retirement resumes; an activated head restores to active with ticket-row states recomputed from step progress; a parked non-head candidate retries by re-entering the replacement CAS, repointing its predecessor to the head it beats."
        test: verification/REQ-decompose.feature#every parked state recovers forward
  - id: REQ-risk-first
    title: Risk items are identified and retired first via spike/research tickets
    rationale: Risk and spike labels plus blocking relations ensure nothing dependent starts before its risk is retired.
    acceptance:
      - id: AC-risk-identify
        statement: Decomposition creates a spike/research ticket per identified risk, labeled with the risk/spike convention, blocking every ticket that depends on the risk's answer.
        test: verification/REQ-risk-first.feature#each risk becomes a blocking spike
      - id: AC-risk-order
        statement: "Spike tickets are immediately workable and surface first: an agent popping work receives an open spike ahead of non-blocking work of the same age."
        test: verification/REQ-risk-first.feature#spikes surface ahead of ordinary work
      - id: AC-risk-retire
        statement: A spike completes with a documented finding attached to the ticket; its completion unblocks dependents — the risk is retired by evidence, not assertion.
        test: verification/REQ-risk-first.feature#a finding retires the risk and unblocks dependents
      - id: AC-risk-escalate
        statement: A spike whose finding invalidates the planned approach does not let dependent work proceed; it escalates to the operator, and the remedy is the amended-spec path — re-intake and supersession, never a silent workaround.
        test: verification/REQ-risk-first.feature#an invalidating finding escalates instead of proceeding
  - id: REQ-parallel-build
    title: Pop tickets off sutra work stacks and run parallel dev agents where relations allow
  - id: REQ-workspaces
    title: Isolated workspace (worktree/branch) per ticket
  - id: REQ-pair-loop
    title: Pair-programming loop — small commits, roborev reviews, fix, recommit until pass
    rationale: Kriya drives the actual roborev tool (enqueue on commit, poll verdicts, respond, close) per CON-buy-over-build.
  - id: REQ-sa-agent
    title: System architect agent resolves impasses and escalates scope to the operator
    rationale: Highest-tier agent; writes no code; the escape valve when dev and review cannot converge.
  - id: REQ-context-assembly
    title: Context manager assembles each dev agent's context and toolset per ticket
  - id: REQ-learning-loop
    title: Mistakes become persistent learnings fed into future builds
    rationale: Project-specific and cross-project; captured as they happen, not post-mortem.
  - id: REQ-gate-structure
    title: Structural linting with hard limits on the target app, via each module's effective lint command
    rationale: Google-style-guide strictness — max module size and kin; agents love god modules and do not mind strict rules.
  - id: REQ-gate-typing
    title: Typing everywhere on the target app
    rationale: Runs each module's effective typecheck command.
  - id: REQ-gate-branch-coverage
    title: Branch coverage — every conditional arm, not an overall percentage
    rationale: Runs each module's effective coverage command; targets where any module's effective stack omits it are rejected at spec intake.
  - id: REQ-gate-mutation
    title: Mutation testing proves the tests test
    rationale: Runs each module's effective mutation command; targets where any module's effective stack omits it are rejected at spec intake.
  - id: REQ-po-validation
    title: Product owner agent validates ACs are genuinely satisfied and tests are not gaming
    rationale: The PO holds the big picture the coding agent cannot have.
  - id: REQ-submit-review
    title: Submit a sutra Review, merge on approval, update ticket status
  - id: REQ-run-to-complete
    title: Loop until every ticket of the spec is complete
  - id: REQ-tier-routing
    title: Model-tier routing is configuration, not hardcoded
  - id: REQ-thread-capture
    title: Dev-agent transcripts auto-import into sutra's thread catalog, session-stamped
    rationale: Auditability plus fuel for the learning loop.
  - id: REQ-tui
    title: TUI overview — what is running now, what is queued, and where agents surface things to the operator
    rationale: The operator's most critical surface; escalations land here, not in a log file.

modules:
  - id: MOD-planner
    name: planner
    responsibility: PM agent — spec intake, tracer-bullet decomposition, risk-first ticketing.
    owns: [ENT-plan, ENT-plan-head, ENT-planned-ticket, ENT-spec-mapping, ENT-spec-snapshot, ENT-pop-fence]
    boundaries: { may_import: [MOD-tracker-client] }
  - id: MOD-orchestrator
    name: orchestrator
    responsibility: The outer loop as a deterministic state machine — pops tickets, advances BuildRun states from an explicit state table, delegates every stage; no judgment, no agent conversations.
    owns: [ENT-build-run]
    boundaries: { may_import: [MOD-planner, MOD-workspace, MOD-dev-loop, MOD-gates, MOD-owner, MOD-tracker-client] }
  - id: MOD-workspace
    name: workspace
    responsibility: Worktree/branch lifecycle per ticket.
    owns: [ENT-workspace]
    boundaries: { may_import: [] }
  - id: MOD-dev-loop
    name: dev-loop
    responsibility: The heart — one pair-programming session; dev agent, commit cadence, fix rounds.
    owns: [ENT-dev-session]
    boundaries: { may_import: [MOD-context, MOD-review-bridge, MOD-architect] }
  - id: MOD-review-bridge
    name: review-bridge
    responsibility: The roborev seam — enqueue, poll verdicts, respond, close; buy-over-build boundary in one place.
    owns: [ENT-review-round, ENT-enqueue-attempt, ENT-orphan-observation]
    boundaries: { may_import: [] }
  - id: MOD-gates
    name: gates
    responsibility: Quality-gate runner — structural lint, typing, branch coverage, mutation testing via the target's stack commands.
    owns: [ENT-gate-result]
    boundaries: { may_import: [] }
  - id: MOD-architect
    name: architect
    responsibility: SA agent — impasse resolution and operator escalation; writes no code.
    owns: [ENT-escalation]
    boundaries: { may_import: [] }
  - id: MOD-owner
    name: owner
    responsibility: PO agent — AC validation, anti-gaming, vision.
    owns: [ENT-validation]
    boundaries: { may_import: [] }
  - id: MOD-context
    name: context
    responsibility: Context assembly per ticket and the learning store. Part of kriya for now; splits out only if ever used beyond spork.
    owns: [ENT-learning, ENT-context-bundle]
    boundaries: { may_import: [MOD-tracker-client] }
  - id: MOD-tracker-client
    name: tracker-client
    responsibility: The one module that speaks the issue tracker's API — sutra today, the seam where other trackers would plug in.
    boundaries: { may_import: [] }
  - id: MOD-cli
    name: cli
    responsibility: Command surface — start a build, inspect state.
    boundaries: { may_import: [MOD-planner, MOD-orchestrator] }
  - id: MOD-tui
    name: tui
    responsibility: Operator dashboard — live overview of running and queued work; where agents surface questions, escalations, and the review bridge's persisted orphan watch.
    boundaries: { may_import: [MOD-orchestrator, MOD-architect, MOD-review-bridge] }

# Kriya's store is the observability plane: the TUI reads it live and it is
# the post-mortem record of every build. The ENTIRE store is durable across
# restarts; within it, the operational entities — those that drive
# behavior after a restart, not just explain it — are BuildRun (crash
# recovery), ReviewRound and EnqueueAttempt (the write-ahead review
# protocol), Plan, PlannedTicket, SpecSnapshot, and SpecMapping (the
# write-ahead decomposition and pinned-spec protocol), and Learning (the
# point of the exercise). Sutra remains the system of record
# for the work itself; tracker-side records are referenced by opaque ids.
data:
  entities:
    - id: ENT-planned-ticket
      name: PlannedTicket
      description: Write-ahead definition of one ticket of a decomposition — persisted before any tracker call so recovery can replay the exact request.
      fields:
        - { name: plan, type: ref, ref: ENT-plan, required: true }
        - { name: ordinal, type: integer, required: true }
        - { name: payload, type: json, required: true }  # the full ordered mutation sequence: create, labels, relations, assignment — executed under the plan-wide phase barrier; each step keyed by (idempotency_key, step ordinal) and carrying a durable step state (pending/issued/complete) updated transactionally around its call
        - { name: idempotency_key, type: string, required: true, unique: true }  # derived from (decomposition_key, ordinal)
        - { name: ticket, type: string }  # tracker id, filled from the creation return
        - { name: state, type: enum, required: true, values: [pending, in-progress, complete, awaiting-operator] }  # per-row progress through the phased sequence; failures land here durably
        - { name: error, type: string }  # what failed, for the operator; set with awaiting-operator
        - { name: defer_generation, type: integer, required: true }  # starts at 0 at row creation; durably incremented as its own atomic row update after each defer conflict-and-fresh-read, BEFORE the next attempt issues; scopes the defer idempotency key so a 409 retry never replays the cached conflict
        - { name: consumed, type: datetime }  # neutral consumption stamp written by a successor plan's retirement pass (or by the bind transaction for walked-past rows); a consumed row no longer participates in binding rule (1)
        - { name: disposition, type: enum, values: [retired, carried-forward, bound, completed] }  # written with consumed: retired = drained, unassigned, and deferred; carried-forward = unclaimed and re-listed by the successor; bound = a build had already bound this ticket (the build's own refs are authoritative); completed = the ticket was already done
    - id: ENT-spec-snapshot
      name: SpecSnapshot
      description: Content-addressed snapshot of the COMPLETE spec artifact set — the manifest plus every referenced verification feature file and contract document (equivalently, a pinned content tree) — stored when first pinned; builds and recovery read gate commands, ACs, scenarios, and contracts from here, never from the mutable working tree, so post-decomposition edits to any referenced file cannot change what a pinned build executes. Alongside the content it stores each module's RESOLVED effective commands (override-per-field over project stack), exactly as intake validated them.
      fields:
        - { name: hash, type: string, required: true, unique: true }
        - { name: content, type: json, required: true }
        - { name: resolved_commands, type: json, required: true }  # per-module effective commands (override-per-field over project stack), exactly as intake validated them
        - { name: created, type: datetime, required: true }
    - id: ENT-spec-mapping
      name: SpecMapping
      description: The project-to-spec registry — seeded by every plan at decomposition, operator-editable; the only trusted fallback for resolving an unplanned ticket's target spec.
      fields:
        - { name: mapping_key, type: string, required: true, unique: true }  # derived hash of (project_key, normalized target_spec) — seeding upserts, so replanning the same spec never duplicates a row
        - { name: project_key, type: string, required: true }  # NOT unique — a project may hold several distinct specs; the fallback binds only when exactly one mapping exists
        - { name: target_spec, type: string, required: true }
        - { name: updated, type: datetime, required: true }
    - id: ENT-pop-fence
      name: PopFence
      description: >-
        The singleton durable row that serializes BuildRun admission
        with head transitions. Written ONLY by its owner, the planner:
        replacement increments unactivated_heads and activation
        decrements it in the same transaction that moves the PlanHead,
        each write bumping version. The orchestrator never writes it;
        the planner exposes an admission guard that the orchestrator
        invokes inside its BuildRun-creating transaction, and the guard
        WRITES: it CAS-increments version conditional on
        unactivated_heads == 0 and the version it read — a read-only
        assertion could still commit beside a concurrent replacement,
        so the guard's conditional write is what makes admission and
        any head transition genuine write-write conflicts on the same
        row, of which exactly one commits. Ownership is respected: the
        guard is planner code, so every fence write still happens in
        the planner; the orchestrator reaches the guard through its
        existing planner import.
      fields:
        - { name: singleton_key, type: string, required: true, unique: true }  # constant — exactly one row; bootstrap inserts it idempotently (the unique key makes the insert the CAS: a loser reads the existing row) with unactivated_heads 0 and version 0
        - { name: unactivated_heads, type: integer, required: true }  # initialized to 0 at bootstrap — no plan exists yet, so nothing is unactivated and admissions flow immediately
        - { name: version, type: integer, required: true }  # initialized to 0 at bootstrap; strictly increasing thereafter
    - id: ENT-plan-head
      name: PlanHead
      description: The single durable head per decomposition target — successor creation and activation move it by CAS, making the one-active-plan invariant enforceable rather than aspirational.
      fields:
        - { name: target_key, type: string, required: true, unique: true }  # derived from (project_key, normalized target_spec)
        - { name: current, type: ref, ref: ENT-plan, required: true }
        - { name: generation, type: integer, required: true }
        - { name: updated, type: datetime, required: true }
    - id: ENT-plan
      name: Plan
      description: >-
        The decomposition record tying an avspec to the tickets it
        produced. The SpecSnapshot is created at decomposition and pinned
        here — every ticket of a plan builds against the exact spec
        version that produced its acceptance criteria. Decomposition is
        write-ahead and idempotent: the plan row (decomposition_key
        derived from project_key, normalized target_spec, and spec_hash;
        unique) and its planned
        ticket definitions are persisted BEFORE any tracker call; each
        ticket-creation request carries a deterministic idempotency key
        derived from (decomposition_key, ticket ordinal), so a crash or
        concurrent retry replays into the same sutra tickets instead of
        duplicating them, per CON-idempotent-mutations. The write-ahead
        payload lives in PlannedTicket rows — ordinal, the ticket's FULL
        ordered mutation sequence (creation, risk/spike labels, blocking
        relations, assignment), and derived per-step idempotency keys,
        all persisted before any call, with returned ids filled per step
        — so recovery replays the exact sequence from durable state and
        resumes mid-sequence. Plans have a lifecycle: pending -> active ->
        superseded, with at most one ACTIVE plan per (project, normalized
        target_spec). Every (project, normalized target_spec) has ONE
        durable PlanHead row, and replacement is a SINGLE store
        transaction (one durable store makes this free): it requires the
        head's current plan to be ACTIVE, marks that predecessor
        superseded with superseded_by stamped, installs the new pending
        plan as head.current, and increments the head generation — all
        atomically. Every request FIRST resolves its decomposition_key against
        existing Plan rows (the key is unique), BEFORE any PlanHead
        logic runs: a row already present makes the request a same-key
        retry whose result is state-aware and touches nothing —
        pending resumes its phases; active WITHOUT the completed stamp
        resumes its creation, wiring, and assignment phases from the
        durable per-step states (activation precedes those phases, so a
        crash can leave an active plan mid-decomposition) and only an
        active plan bearing completed returns as already complete;
        superseded returns as an idempotent HISTORICAL result (the
        caller learns the plan and its replacement via superseded_by;
        the retry can never mutate PlanHead, revive the old plan, or
        compete as a candidate — reachable regardless of where the head
        has moved since), and awaiting-operator is preserved and
        reported, never silently resumed past an unrecoverable failure.
        Only a request whose key resolves to NO existing row proceeds
        to insert-and-CAS — and because two concurrent requests can
        both observe no row, EVERY conflict on that path (the plan
        insert's key-uniqueness violation or the head CAS losing) is
        followed by re-resolving decomposition_key before any verdict:
        finding a row for the SAME key means a twin won, and the
        request resumes it state-aware exactly as above; only when
        re-resolution shows a DIFFERENT key's plan holds the head does
        competing-candidate handling apply and the loser land
        awaiting-operator. A same-key retry is never a competitor in
        any state, whether it arrived before or raced the winner. Bootstrap is the degenerate case of the same
        transaction: a target with no head yet creates the pending plan
        and INSERTS its PlanHead row atomically — target_key's uniqueness
        makes the insert the CAS, so a concurrent first decomposition
        either resumes idempotently (same decomposition_key already
        heads the target) or loses and lands awaiting-operator; with no
        predecessor the retirement set is empty and the plan activates
        immediately. The head can never point at a losing plan and
        there is no window between head-move and supersession
        — a concurrent would-be successor loses that CAS and durably moves
        to plan state awaiting-operator with the error recorded, so
        exactly one replacement can ever activate and the loser is
        operator-visible, never a lingering indistinguishable pending
        row.
        The retirement pass is then durable, ordered, and state-aware,
        acting in sutra ONLY on unfinished, unclaimed tickets (completed
        tickets and tickets already claimed by builds get no server-side
        action — popped builds finish under their pinned snapshots) but
        stamping EVERY predecessor row before it completes: rows for
        bound or completed builds are stamped consumed with disposition
        bound or completed (the
        build's own plan and spec_hash refs are its authority; membership
        matching is never needed again), and the reconciliation pass
        below runs first so no claimed-but-unbound pop exists when those
        stamps land. Retirement therefore leaves NO unstamped predecessor
        row behind; the stamps consume the rows as history, but the
        binding AUTHORITY only switches at successor activation — while
        the successor is still pending, the predecessor's rows (stamped
        or not) remain what a pop binds against, so a reopened ticket
        popped mid-retirement can never inherit the pending plan's
        not-yet-wired snapshot. Once the successor activates, a later
        reopen-and-pop of a predecessor ticket the successor CARRIED
        FORWARD binds cleanly to the then-current active head; a ticket
        the successor omitted instead retains its AC-producing plan's
        snapshot via consumed-history resolution (binding rule 3). First each
        unfinished, unclaimed ticket is set to status deferred via the
        tracker's conditional transition (expected status open). Each
        defer attempt carries a deterministic GENERATION-SCOPED
        idempotency key — (row's idempotency_key, 'defer', attempt
        generation), with the generation persisted on the row and
        advanced durably after every conflict-and-fresh-read — because
        sutra replays a reused key verbatim: retrying a 409 under the
        original key would return the cached conflict forever, so each
        re-read-then-retry issues under the next generation's key while
        every individual attempt stays exactly-once. A conflict is NOT assumed to
        mean a pop won: first every queued BuildRun with an unfilled
        ticket replays its idempotent pop so just-claimed tickets gain
        their matching rows, then the ticket is re-read and classified —
        actually claimed by a build (in-progress with a matching
        BuildRun) means
        it is left untouched; still unfinished and unclaimed but already DEFERRED means the
        fence is established (a prior attempt's effect landed) and
        retirement continues with NO further transition — retrying
        would at best duplicate a status mutation and at worst loop on
        conflicts; still unfinished and unclaimed but moved elsewhere
        (blocked, or re-opened meanwhile) means the conditional
        defer retries from the freshly observed status under the next
        defer_generation key; anything whose
        ownership cannot be determined goes to awaiting-operator. The
        pop fence thus lands before anything else without clobbering a
        live claim or stranding a merely-moved ticket; then its ISSUED
        mutations (and only those) are drained by persisted key, then it
        is unassigned, with a consumed stamp (disposition retired or
        carried-forward) written per row so a crash resumes exactly
        where it stopped. The retirement pass is executed
        by the successor's fenced pending-phase worker, which is
        EXPLICITLY authorized to replay issued predecessor steps even
        though neither plan is active — completing an already-sent
        request is finishing the past, not new work; creating
        never-issued work remains active-only. Id-less rows therefore
        split on their creation step's state: pending means nothing was
        ever sent — the row is stamped consumed (disposition retired)
        with no server-side action at all; issued means the creation is replayed to a
        terminal result, the id recorded, the ticket deferred, and then
        that row's issued labels and relations drained. The plan-wide
        phase barrier guarantees an issued relation never targets an
        uncreated ticket (relations only begin issuing after every
        creation completed). Every step in a
        PlannedTicket's sequence carries a durable step state — pending
        (never sent), issued (written in the same transaction that
        precedes the call), complete (written on return) — and draining
        replays ONLY steps whose state is exactly issued: pending was
        provably never sent and is skipped, complete already has its
        terminal result and is never rerun. Assignment follows the
        same rule, replayed to a terminal result after the defer fence
        and before the unassign-and-stamp when issued, skipped when
        pending.
        Claimed-but-unbound pops are bound WHENEVER discovered, not
        only in the initial sweep: a defer conflict re-read that finds
        a ticket claimed by a queued BuildRun with an unfilled ticket
        replays that pop and binds the row (to the retiring
        predecessor, per binding rule 2) before the ticket's row is
        stamped, and the pre-activation recheck replays any remaining
        unfilled queued BuildRuns the same way — the write-ahead row is
        durable before sutra is ever called, so every in-flight claim
        is visible to this fence. New pops cannot originate inside the window at all:
        admission is serialized with head transitions through the
        PopFence singleton (ENT-pop-fence, planner-owned). Replacement
        increments its unactivated_heads counter and activation
        decrements it IN THE SAME transaction that moves the head, and
        BuildRun write-ahead creation invokes the planner's admission
        guard, which asserts counter == 0 against the fence's version
        (CAS) inside the creating transaction — so an admission that
        observed a stale fence cannot commit: any interleaved
        replacement bumps the version and forces the admission to
        retry after activation, and vice versa. The fence is deliberately GLOBAL because sutra's
        pop is identity-wide and accepts no project filter, so the
        eventual ticket's project is unknowable before the pop
        returns; unactivated windows are rare and short (one
        replacement in flight), making the coarse fence cheap. So
        every claim is either created before the window and drained by
        the recheck, or created after activation and resolved by rule
        3; no claim can straddle activation. Activation therefore happens only
        when NO claimed-but-unbound pop against a predecessor ticket
        exists; a crashed build worker replaying its bind after
        activation finds its BuildRun already bound (binding is
        idempotent — the fence's binding and the worker's replay write
        the same row), so a pre-activation claim can never re-resolve
        through the activated successor.
        Only when every eligible predecessor row carries its stamp does
        the stamped successor transition pending -> active, and only an
        active plan's worker may run creation, wiring, or assignment
        phases — a crash mid-cleanup can never leave both plans' tickets
        exposed. Because
        pop eligibility requires status open, the deferred status is the
        durable fence — even an in-flight assignment from a crashed
        worker that lands afterwards cannot make a deferred ticket
        poppable. Before retirement, every ISSUED predecessor
        mutation is drained by replaying its persisted idempotency key —
        bringing any in-flight request to a known terminal state, while
        pending steps, provably never sent, are skipped — and
        carried-forward tickets stay deferred through the replacement's
        creation and wiring phases: reopening happens in the final
        assignment phase, after the plan-wide relation barrier, so a
        ticket regains status open only when its full new dependency
        graph is durable. Builds already popped finish under their
        pinned snapshots; the superseded tickets stay in the tracker for
        the PM to reconcile into the new plan. Supersession is fenced the
        same way claim resolution is: it proceeds only when the prior
        plan's decomposition worker is not live (decidable in-process —
        workers are the process's own tasks, and a crash kills them all),
        and every decomposition worker re-checks that its plan is still
        active in the same transaction that records each step, halting
        when superseded — so no live worker assigns after supersession — and the
        deferred-status fence covers the dead worker's in-flight
        requests. Execution runs in PLAN-WIDE phases, not
        merely per ticket: every creation completes, then every label and
        relation across all tickets, and only then any assignment.
        Because pop eligibility requires assignment, the phase barrier
        keeps every ticket unpoppable until the whole plan's dependency
        graph is wired — a crash mid-decomposition can never expose a
        runnable ticket whose blocking relation lives in another ticket's
        sequence.
      fields:
        - { name: decomposition_key, type: string, required: true, unique: true }  # deterministic hash of (project_key, normalized target_spec, spec_hash) — the write-ahead idempotency handle for the whole decomposition
        - { name: target_spec, type: string, required: true }
        - { name: spec_hash, type: string, required: true }  # snapshot pinned at decomposition; plan-matched builds inherit it
        - { name: state, type: enum, required: true, values: [pending, active, superseded, awaiting-operator] }  # pending until the predecessor's retirement completes; awaiting-operator records a lost supersession CAS or unrecoverable phase failure
        - { name: activated, type: datetime }  # persisted at the pending -> active transition and never cleared; binding authority keys off this, not the state label, so a head parked awaiting-operator still resolves deterministically
        - { name: completed, type: datetime }  # stamped only after the final assignment-phase barrier finishes — activation precedes the creation/wiring/assignment phases, so active alone never means the decomposition is done
        # Recovery of ANY awaiting-operator head is FORWARD-ONLY, split by the activated stamp. Unactivated: an operator-authorized CAS — expected state awaiting-operator, activated absent, currently head — atomically restores the plan to pending, clears its error, and resets every predecessor PlannedTicket row parked awaiting-operator by the failed retirement (error cleared, row state recomputed from durable per-step progress exactly as below), then the pending phase RESUMES — retirement is idempotent and resumable, and activation decrements the fence, so the counter cannot stay positive indefinitely and no parked row leaves retirement blocked. Activated (a creation/wiring/assignment failure parked the plan after activation): an operator-authorized CAS — expected state awaiting-operator, activated present — restores state to active with the activated stamp intact and clears error, and the SAME idempotent transition resets every PlannedTicket row parked awaiting-operator under this plan: each row's error is cleared and its state recomputed from its durable per-step progress (all steps complete -> complete, any issued or complete step -> in-progress, none -> pending), so per-step progress is preserved, resumed phases find no row still blocked, and re-running the restore is a no-op; the head was never unactivated so the fence is untouched, and once restored the normal supersession path is open again — no target is ever permanently stuck. There is deliberately no rollback verdict in either case: rolling the head back to a superseded predecessor would require restoring its state and reversing partially completed retirement (re-opening deferred tickets, un-consuming rows) with no authority to do so safely. A decomposition that turns out to be semantically wrong still resumes to activation and is then corrected by a normal follow-up supersession. A parked NON-HEAD candidate (a distinct decomposition that lost the replacement CAS) has its own operator resolution: an operator-authorized CAS — expected awaiting-operator, activated absent, not head — clears its error and re-enters the SAME plan row into the replacement CAS against the now-current head (its decomposition is a deterministic function of project, target, and spec_hash, so reusing the row is semantically exact and its unique decomposition_key never blocks the retry); a WINNING retry is the full replacement transaction, which atomically REPOINTS candidate.predecessor to the head it actually beat (overwriting the stale reference persisted at original creation — retirement must drain the plan whose tickets are live NOW, not whoever was head when the candidate first lost), marks that head superseded with its superseded_by stamped, increments the fence's unactivated_heads, and moves PlanHead.current with a generation bump; losing re-parks it awaiting-operator. The operator can therefore adopt a previously losing decomposition at any later point, or simply leave it parked as an inert historical record — it is never silently retried and never blocks anything.
        - { name: error, type: string }  # what failed, for the operator; set with awaiting-operator
        - { name: predecessor, type: ref, ref: ENT-plan }  # the plan this one supersedes; persisted at creation so retirement is resumable
        - { name: superseded_by, type: ref, ref: ENT-plan }  # stamped by the supersession CAS — the one successor allowed to activate
        - { name: project_key, type: string, required: true }
        - { name: created, type: datetime, required: true }
    - id: ENT-build-run
      name: BuildRun
      description: >-
        Also the write-ahead record for the pop itself: the row is created
        (state queued, pop_key set, ticket absent) BEFORE calling sutra's
        pop; sutra's pop is idempotent per key (AC-pop-replay), so
        recovery replays the same pop_key and receives the same issue,
        then binds ticket to the row transactionally. Plan is lineage,
        not an execution dependency: in the same transaction the ticket
        is matched by ONE state-aware precedence algorithm that walks
        the predecessor chain from the plan currently heading its
        target (resolved through PlanHead) and yields at most one
        candidate: (1) among SUPERSEDED plans ONLY — the current head,
        pending or active, is excluded from this rule and handled by
        (2) and (3) — the FURTHEST-BACK plan on the chain holding an
        UNSTAMPED PlannedTicket row for the ticket binds; such a row
        exists only while that plan's retirement is still resuming
        (retirement binds every queued BuildRun with an unfilled ticket
        via pop replay BEFORE stamping the remaining rows, so unstamped
        means exactly claimed-in-flight), and the deepest such
        superseded row is
        precisely the plan whose tickets were live when the pop claimed
        this one; the same transaction stamps every unstamped
        superseded row it walked past. (2) Otherwise, while the head has
        NOT YET ACTIVATED (activated absent — a pending head, or one
        parked awaiting-operator before it ever activated), the
        NEAREST predecessor row on the chain — stamped or not — binds:
        usually the immediate predecessor's, but when that plan omitted
        the ticket the search continues through consumed history down
        the activated-predecessor chain to the nearest plan that
        actually included it (a pop admitted just before replacement
        can claim a reopened ticket that only an earlier plan
        produced, and it must not be misclassified as unplanned). An
        unactivated head's rows NEVER bind, because activation is the
        atomic switch of binding authority (persisted as the plan's
        activated stamp), so a reopened ticket popped mid-retirement
        can never inherit an unactivated plan's not-yet-wired snapshot.
        (3) Otherwise the head has activated — even if it later entered
        awaiting-operator — and its own row, when one exists, binds:
        a ticket the current decomposition lists was re-affirmed by it,
        so the head's snapshot rightly governs. A ticket whose ONLY
        membership is consumed rows on superseded plans of this chain
        (e.g. completed under the predecessor, omitted from the
        successor, reopened later) binds instead to the NEAREST such
        row's plan — the most recent decomposition that actually
        produced or re-affirmed the ticket's acceptance criteria — and
        that plan's pinned snapshot: the pinned-spec invariant means a
        ticket builds against the spec that produced its ACs, and a
        plan that omitted the ticket never qualifies, head or not. (The
        PM re-adopts such a ticket by including it in a new
        decomposition, which gives it a current row.) Stamped
        superseded rows are otherwise pure audit history. Only a
        ticket with no membership row anywhere — planned outside any
        plan — is unplanned. In every case the bound plan's pinned
        snapshot travels with the binding, honoring the
        popped-builds-finish-under-predecessor guarantee. (PlannedTicket
        remains the authoritative membership record — Plan holds no
        duplicate list.) Matching uses
        persisted ids directly: assignment-last guarantees any poppable
        ticket's id was durably recorded steps earlier, so no
        reconciliation sweep is needed at classification time — a
        permanently failing creation elsewhere can never block an
        unrelated build; per-row replay failures set the row's own
        state to awaiting-operator with the error recorded, and the TUI
        surfaces those rows alongside escalations. Then: the precedence algorithm above has already collapsed
        each head's predecessor chain to at most one candidate, so rows
        within one chain are never counted as multiple matches and a
        carried-forward ticket is unambiguous by construction. Exactly
        one surviving candidate binds the plan; no candidate (a ticket
        assigned outside any plan) or candidates surviving from
        DISTINCT head chains leaves plan absent and the build proceeds
        regardless. The snapshot is stricter than the lineage:
        one candidate inherits its plan's spec_hash; distinct-chain
        candidates inherit
        only when every candidate plan agrees on spec_hash, project, and
        normalized target_spec path, and any disagreement routes to
        awaiting-operator rather than fresh-pinning — a planned ticket never silently builds against a spec
        other than the one that produced its ACs. The build otherwise
        proceeds, since the ticket itself carries the ACs and
        target_spec is persisted on the row at bind time — from the
        matched plan, or for unplanned tickets from kriya's persisted
        project-to-spec registry (seeded by every plan, operator-editable;
        a bare repo_path is NOT trusted, since one repository can hold
        several manifests). The registry may hold several mappings per
        project; the fallback binds only when exactly one exists — zero
        or several means the row goes to awaiting-operator with the
        claimed ticket preserved. Nothing
        about plan resolution can strand a claimed ticket. An
        empty result transitions the row to the terminal no-work state in
        the same transaction; a later poll creates a fresh row with a
        fresh pop_key, so an exhausted key is never revisited. A crash at
        any point either replays to the same outcome or finds the
        transition already done — no stranded tickets, no double claims,
        no immortal empty rows.
      fields:
        - { name: pop_key, type: string, required: true, unique: true }  # deterministic idempotency key persisted before the pop; replayed on recovery
        - { name: identity, type: string, required: true }  # the agent identity popped as — persisted pre-pop so replay hits the same stack even if configuration changes
        - { name: target_spec, type: string }  # gate-chain context, persisted at bind — from the plan, else the project-to-spec registry; unresolvable or ambiguous -> awaiting-operator
        - { name: spec_hash, type: string }  # inherited from the matched plan's decomposition-time snapshot; for unplanned tickets pinned fresh at bind — builds and recovery always execute against the stored SpecSnapshot, so later edits never change a running or planned build
        - { name: ticket, type: string }  # opaque tracker id; absent until the pop returns, bound transactionally
        - { name: plan, type: ref, ref: ENT-plan }  # lineage only — bound when exactly one plan records the ticket; absent pre-pop, on no-work rows, and for unplanned or ambiguous tickets
        - { name: state, type: enum, required: true, values: [queued, no-work, dev-loop, gates, po-validation, review-submitted, awaiting-operator, merging, merged, failed] }  # one state per gate-chain stage — deterministic crash recovery, no skippable gates
        - { name: review, type: string }  # opaque tracker review id once submitted — restart-safe polling, resubmission, and merge
        - { name: workspace, type: ref, ref: ENT-workspace }
        - { name: started, type: datetime }
        - { name: finished, type: datetime }
    - id: ENT-workspace
      name: Workspace
      fields:
        - { name: path, type: string, required: true }
        - { name: branch, type: string, required: true }
        - { name: ticket, type: string, required: true }
        - { name: created, type: datetime, required: true }
        - { name: removed_at, type: datetime }
    - id: ENT-dev-session
      name: DevSession
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: session, type: string, required: true }
        - { name: agent, type: string, required: true }
        - { name: tier, type: string, required: true }
        - { name: started, type: datetime, required: true }
        - { name: ended, type: datetime }
        - { name: thread_ref, type: string }  # sutra thread id once the transcript imports
    - id: ENT-review-round
      name: ReviewRound
      description: >-
        Restart-safe by write-ahead, grounded in the R1 spike facts. The
        operation_key is derived deterministically from (build, commit), so
        its uniqueness makes the write-ahead insert idempotent — a
        concurrent or recovered replay collides instead of duplicating.
        Enqueue happens after the insert; roborev offers no caller
        correlation key, so provenance of a listed job is unprovable —
        therefore kriya NEVER adopts, responds to, cancels, or closes a
        job whose id it did not record from its own enqueue return.
        Claim state lives in enqueue_state, never in external_id (which
        only ever holds a real recorded id). Lifecycle: unclaimed ->
        claimed (CAS, stamping claimed_at) -> enqueued (id recorded).
        Only the claim winner calls roborev; concurrent workers lose the
        CAS and stand down. An expired claim (claimed_at older than the
        lease window) is NEVER auto-reclaimed — roborev offers no fencing
        token, so a merely-slow claimant could still enqueue after a
        reclaim and duplicate the job. Instead the round surfaces in the
        TUI for operator reconciliation: confirm whether an orphan job
        exists, then reset the claim — a reset increments claim_generation.
        Every claim carries its generation, and recording an enqueue
        result is a CAS that requires the claimant's generation to still
        be current: a merely-slow claimant that enqueues after a reset
        loses that CAS — and every call is bracketed by a durable
        EnqueueAttempt row written BEFORE roborev is invoked (id absent,
        pending) and completed with the returned id afterward. A pending
        attempt that never completes is therefore itself the durable
        may-have-orphaned marker, surviving any crash window including a
        stale claimant dying mid-call. Completing an attempt and
        advancing its round to enqueued happen in ONE store transaction
        (same durable store, so atomicity is free); and recovery promotes
        before it resets — a completed attempt of the round's current
        generation is folded into the round (id recorded, state
        enqueued) before reset or any further claim is permitted, so a
        proven kriya-owned job is never abandoned to duplication. The TUI's unresolved list is:
        pending attempts, plus completed attempts whose id is not their
        round's accepted external_id; the operator resolves entries after
        checking roborev, stamping resolved. Resolution and reset are
        only offered when the attempt's claimant is not live — decidable
        because kriya is a single process whose claimants are its own
        tasks, and after a crash every claimant is conclusively dead.
        As a backstop, a late completion is a CAS that atomically reopens
        a resolved attempt (clearing resolved while recording the id),
        returning it to the unresolved list rather than hiding it.
        One residual is accepted EXPLICITLY rather than pretended away:
        a dead claimant's already-sent request may still land server-side
        after resolution, and without a server idempotency key (absent,
        per the R1 spike) no client protocol can prevent it. Therefore
        resolving a pending attempt moves it to a permanent watch rather
        than oblivion — the review bridge (the sole roborev seam)
        periodically cross-checks roborev's job list for each watched
        round's commit and persists any job id kriya never recorded as an
        OrphanObservation row; the TUI renders those rows:
        display-only, never acted on, never silently forgotten. Recovery is therefore: enqueued -> resume
        polling external_id; unclaimed -> claim and enqueue; expired
        claim -> operator. Orphan jobs are never touched and are
        surfaced in the TUI.
        Rounds are unique per (build, commit) via the derived key, so a
        rebuilt commit gets its own round.
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: commit, type: string, required: true }  # canonical full object id
        - { name: operation_key, type: string, required: true, unique: true }  # deterministic hash of (build, commit) — the write-ahead idempotency handle
        - { name: enqueue_state, type: enum, required: true, values: [unclaimed, claimed, enqueued] }
        - { name: claimed_at, type: datetime }  # lease stamp; expired claims go to operator reconciliation, never auto-reclaim
        - { name: claim_generation, type: integer, required: true }  # fencing token — incremented per claim/reset; stale claimants lose the recording CAS
        - { name: external_id, type: string, unique: true }  # roborev job/review id recorded from our own enqueue return — the only ids kriya ever acts on
        - { name: verdict, type: enum, required: true, values: [pending, pass, findings] }
        - { name: findings, type: json }
        - { name: created, type: datetime, required: true }
    - id: ENT-enqueue-attempt
      name: EnqueueAttempt
      description: Write-ahead, append-only bracket around every roborev enqueue — created pending BEFORE the call, completed with the returned id after; a never-completed pending row is the durable may-have-orphaned marker.
      fields:
        - { name: round, type: ref, ref: ENT-review-round, required: true }
        - { name: generation, type: integer, required: true }
        - { name: external_id, type: string }  # absent while pending; filled from the enqueue return
        - { name: created, type: datetime, required: true }
        - { name: resolved, type: datetime }  # operator-stamped after reconciling against roborev
    - id: ENT-orphan-observation
      name: OrphanObservation
      description: Durable record of a roborev job discovered for a watched round's commit whose id kriya never recorded — the persisted form of the late-orphan watch. Display-only; never acted on.
      fields:
        - { name: observation_key, type: string, required: true, unique: true }  # derived hash of (round, external_id) — the watch upserts, so re-polling never duplicates and resolved rows never reappear
        - { name: round, type: ref, ref: ENT-review-round, required: true }
        - { name: external_id, type: string, required: true }
        - { name: discovered, type: datetime, required: true }
        - { name: resolved, type: datetime }  # operator-stamped after checking roborev
    - id: ENT-gate-result
      name: GateResult
      fields:
        - { name: result_key, type: string, required: true, unique: true }  # derived hash of (build, module, gate, commit) — upserted, so reruns never duplicate and recovery can prove per-module completeness
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: module, type: string, required: true }  # the target spec's module id whose effective command ran
        - { name: gate, type: enum, required: true, values: [test, structure, typing, branch-coverage, mutation, arch] }
        - { name: commit, type: string, required: true }  # full object id the gate ran against — stale results never satisfy the chain
        - { name: passed, type: boolean, required: true }
        - { name: detail, type: json }
        - { name: created, type: datetime, required: true }
    - id: ENT-escalation
      name: Escalation
      description: What the TUI surfaces to the operator.
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: kind, type: enum, required: true, values: [impasse, scope] }
        - { name: question, type: string, required: true }
        - { name: state, type: enum, required: true, values: [open, answered] }
        - { name: answer, type: string }
        - { name: raised_by, type: string, required: true }
        - { name: created, type: datetime, required: true }
        - { name: resolved, type: datetime }
    - id: ENT-validation
      name: Validation
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: verdict, type: enum, required: true, values: [satisfied, not-satisfied, tests-gamed] }
        - { name: commit, type: string, required: true }  # full object id the validation covered
        - { name: notes, type: string }
        - { name: created, type: datetime, required: true }
    - id: ENT-learning
      name: Learning
      description: project_key is present exactly when scope is project — a project learning without its key is rejected at write time.
      fields:
        - { name: scope, type: enum, required: true, values: [project, global] }
        - { name: project_key, type: string }  # required when scope is project, absent when global — enforced at write time (the format cannot express conditional requiredness)
        - { name: lesson, type: string, required: true }
        - { name: source_session, type: string }
        - { name: created, type: datetime, required: true }
    - id: ENT-context-bundle
      name: ContextBundle
      description: Exactly what a dev agent was given — the debug record for bad builds and the audit for the learning loop.
      fields:
        - { name: build, type: ref, ref: ENT-build-run, required: true }
        - { name: content, type: json, required: true }
        - { name: created, type: datetime, required: true }

apps:
  - id: APP-kriya
    name: kriya
    modules: [MOD-planner, MOD-orchestrator, MOD-workspace, MOD-dev-loop,
              MOD-review-bridge, MOD-gates, MOD-architect, MOD-owner,
              MOD-context, MOD-tracker-client, MOD-cli, MOD-tui]

