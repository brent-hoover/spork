# Declared module boundaries (avspec.yaml modules[].boundaries.may_import)
# checked against real imports by the stack's arch command:
#   go run github.com/arch-go/arch-go@v1.7.0
# Package layout mirrors module names: one package directory per module.
# A module may import only the packages listed in its shouldOnlyDependsOn
# rule (its own package is always allowed). Modules whose may_import is
# EMPTY use shouldNotDependsOn with the explicit complement of every other
# module — spiked 2026-08-06: an empty shouldOnlyDependsOn allowlist is
# treated as UNCONSTRAINED (silent pass) and a bare "**" pattern panics
# arch-go v1.7.0, so the complement idiom is the only enforcing form.
# Patterns match the LEAF package per module ("**.issues", not
# "**.issues.**") — add descendant patterns only if subpackages appear.
version: 1
dependenciesRules:
  # Acceptance harness — test-only package that boots the API over
  # httptest and drives it through HTTP; api.New is its only internal
  # import. Not an avspec module (same spec gap as the composition root).
  - package: "**.acceptance"
    shouldOnlyDependsOn:
      internal:
        - "**.api"
  # Composition root — not a declared avspec module; it wires the declared
  # surface modules together and may import only them (spec gap logged in
  # feature-work/sutra-build/spec-gaps.md: avspec has no composition-root
  # concept, yet arch-go requires 100% package coverage).
  - package: "**.sutra"
    shouldOnlyDependsOn:
      internal:
        - "**.api"
        - "**.cli"
        - "**.web"
  - package: "**.issues"
    shouldOnlyDependsOn:
      internal:
        - "**.projects"
        - "**.identity"
        - "**.review"
        - "**.events"
  - package: "**.projects"
    shouldNotDependsOn:
      internal:
        - "**.issues"
        - "**.docs"
        - "**.threads"
        - "**.identity"
        - "**.events"
        - "**.review"
        - "**.api"
        - "**.cli"
        - "**.web"
  - package: "**.docs"
    shouldOnlyDependsOn:
      internal:
        - "**.projects"
        - "**.issues"
        - "**.identity"
        - "**.events"
  - package: "**.threads"
    shouldOnlyDependsOn:
      internal:
        - "**.projects"
        - "**.issues"
        - "**.events"
  - package: "**.identity"
    shouldNotDependsOn:
      internal:
        - "**.issues"
        - "**.projects"
        - "**.docs"
        - "**.threads"
        - "**.events"
        - "**.review"
        - "**.api"
        - "**.cli"
        - "**.web"
  - package: "**.events"
    shouldNotDependsOn:
      internal:
        - "**.issues"
        - "**.projects"
        - "**.docs"
        - "**.threads"
        - "**.identity"
        - "**.review"
        - "**.api"
        - "**.cli"
        - "**.web"
  # Comments — polymorphic storage (ENT-comment); anchor-target
  # validation lives in the API layer, so the package imports no
  # sibling modules.
  - package: "**.comments"
    shouldNotDependsOn:
      internal:
        - "**.issues"
        - "**.projects"
        - "**.docs"
        - "**.threads"
        - "**.identity"
        - "**.events"
        - "**.review"
        - "**.api"
        - "**.cli"
        - "**.web"
  # Fault injection — a database/sql driver that exists only so tests can
  # inject store failures. It imports no sibling module and nothing in
  # production imports IT: the sweeps reach it through a blank import and a
  # DSN, which is also why it exports nothing. Not an avspec module (the
  # same spec gap as the acceptance harness and the composition root), but
  # arch-go requires 100% package coverage, so its emptiness is declared
  # rather than left implicit.
  - package: "**.faultsql"
    shouldNotDependsOn:
      internal:
        - "**.issues"
        - "**.projects"
        - "**.docs"
        - "**.threads"
        - "**.identity"
        - "**.events"
        - "**.review"
        - "**.comments"
        - "**.api"
        - "**.cli"
        - "**.web"
  - package: "**.review"
    shouldOnlyDependsOn:
      internal:
        - "**.identity"
        - "**.events"
  - package: "**.api"
    shouldOnlyDependsOn:
      internal:
        - "**.comments"
        - "**.issues"
        - "**.projects"
        - "**.docs"
        - "**.threads"
        - "**.identity"
        - "**.events"
        - "**.review"
  - package: "**.cli"
    shouldNotDependsOn:
      internal:
        - "**.issues"
        - "**.projects"
        - "**.docs"
        - "**.threads"
        - "**.identity"
        - "**.events"
        - "**.review"
        - "**.api"
        - "**.web"
  - package: "**.web"
    shouldNotDependsOn:
      internal:
        - "**.issues"
        - "**.projects"
        - "**.docs"
        - "**.threads"
        - "**.identity"
        - "**.events"
        - "**.review"
        - "**.api"
        - "**.cli"
