avspec: "0.3"

project:
  name: sutra
  description: >-
    An issue tracker for agents and humans. Envelope: single user, one
    machine, a handful of concurrent agent instances — facts to build
    with, not requirements to test.
  status: ready
  stack:
    languages: [{ name: go, version: "1.25" }]  # bumped from 1.23 during sutra-build: 1.23 is out of security support and current deps floor at 1.25 (spec-gaps.md 2026-08-06)
    package_manager: go
    frameworks: [net/http, htmx]
    bdd: godog
    store: sqlite  # FTS5 for search; single-binary friendly
    commands:
      install: go mod download  # gate tools need no install — coverage and mutation invoke exact pinned versions via `go run pkg@version`, immune to PATH and preinstalled binaries
      test: go test ./...
      lint: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6 run  # pinned via go run like the other gates — no unmanaged PATH binary, clean environments included
      typecheck: go vet ./...
      arch: go run github.com/arch-go/arch-go@v1.7.0  # declared may_import boundaries mirrored in arch-go.yml and checked against real imports; exits nonzero on any violation (spiked 2026-08-06: v1.6.4 does not exist; empty-allowlist modules need explicit-complement shouldNotDependsOn rules — an empty shouldOnlyDependsOn passes silently)
      coverage: out=$(mktemp); trap 'rm -f "$out"' EXIT; go run github.com/rillig/gobco@v1.3.4 ./... > "$out" && awk '{print} /^Condition coverage:/ {seen=1; split($3,a,"/"); if (a[1] != a[2]) bad=1} END {exit (bad || !seen)}' "$out"  # mktemp + trap cleanup, POSIX sh, spike-validated: covered=0; uncovered, tool-failure, missing-summary all nonzero (kriya R3, retired 2026-08-04)
      mutation: go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.5.0 unleash --threshold-efficacy 100 --threshold-mcover 100  # documented to exit nonzero below thresholds; 100 is the declared bar — the gate proves the tests test

constitution:
  - id: CON-test-first
    statement: No behavior is implemented before the test mapped to its acceptance criterion exists and fails.
  - id: CON-dependency-flow
    statement: Dependencies flow one way between layers; no back-edges.
  - id: CON-no-secrets
    statement: No secrets in source; configuration is injected at runtime.
  - id: CON-idempotent-mutations
    statement: Mutating API operations are idempotent (client-supplied keys); agents retry aggressively and replays must be safe.
  - id: CON-uuid-keys
    statement: Entity primary keys are UUIDv7; human-facing numbers are project-scoped display aliases, never canonical identity (federation-safe by construction).
  - id: CON-id-opaque-refs
    statement: Entity refs across module boundaries are id-opaque and imply no imports; referential validation happens at the API edge (MOD-api), which is the only module that imports every domain module. This is why MOD-review holds issue and doc-version ids without importing their owners.

requirements:
  - id: REQ-core-issues
    title: Track issues (create, update, comment, label, assign, close)
    rationale: The baseline issue-tracker capability everything else hangs off.
    acceptance:
      - id: AC-issue-create
        statement: A created issue gets a UUIDv7 id plus a per-project sequential display number, status open, and a creation event.
        test: verification/REQ-core-issues.feature#create mints uuid and display number
      - id: AC-issue-update
        statement: Changes to title, body, or fields persist and updated reflects the mutation.
        test: verification/REQ-core-issues.feature#updates persist
      - id: AC-issue-labels
        statement: Labels attach and detach; an issue lists its current labels.
        test: verification/REQ-core-issues.feature#labels attach and detach
      - id: AC-issue-assign
        statement: An issue can be assigned to any identity, human or agent, and unassigned; assignment feeds the agent work stack.
        test: verification/REQ-core-issues.feature#assignment to any identity
  - id: REQ-cli-parity
    title: Agents can access every feature via the CLI
    rationale: Agents are first-class users; no capability is UI-only.
    acceptance:
      - id: AC-parity-coverage
        statement: For every operation in the API contract, a CLI command exists that invokes it; the parity test enumerates the contract and fails on any uncovered operation.
        test: verification/REQ-cli-parity.feature#every api operation has a command
      - id: AC-parity-remote
        statement: With --server pointing at any sutra instance, every CLI command behaves identically to loopback — the CLI has no private path to daemon internals.
        test: verification/REQ-cli-parity.feature#remote server behaves like loopback
  - id: REQ-doc-database
    title: Doc database — planning docs filed under project and issue, with versioning
    rationale: Planning artifacts live with the work they describe, not in a separate wiki.
    acceptance:
      - id: AC-doc-create
        statement: A document created in a project (optionally tied to an issue) is filed there and readable back with title and content.
        test: verification/REQ-doc-database.feature#doc files under its project
      - id: AC-doc-versioning
        statement: Saving content appends a new immutable DocVersion with author, number, and timestamp; prior versions stay readable, no in-place edits.
        test: verification/REQ-doc-database.feature#saves append immutable versions
      - id: AC-doc-current
        statement: A document always identifies its current version; requesting it without a version yields the latest.
        test: verification/REQ-doc-database.feature#latest by default
      - id: AC-doc-history
        statement: A document's history lists all versions in order with author and time, and any two versions can be diffed.
        test: verification/REQ-doc-database.feature#history lists and diffs versions
  - id: REQ-doc-review-server
    title: Integrated web server for viewing and giving threaded feedback on documents
    rationale: Humans review and comment on docs in place, with threads.
    acceptance:
      - id: AC-docweb-render
        statement: Opening a document in the web UI renders its content (markdown formatted), showing a chosen or latest version.
        test: verification/REQ-doc-review-server.feature#doc renders in the browser
      - id: AC-docweb-inline-comments
        statement: A reader attaches a comment to a specific span or block of a doc version; the comment anchors to that version so later versions never orphan it silently.
        test: verification/REQ-doc-review-server.feature#comments pin to a spot in a version
      - id: AC-docweb-threads
        statement: Doc comments thread via reply-to and the discussion is visible alongside the content.
        test: verification/REQ-doc-review-server.feature#discussion sits beside the doc
      - id: AC-docweb-live
        statement: When a new version of an open document is saved, the viewer is notified or refreshed to see it.
        test: verification/REQ-doc-review-server.feature#viewer learns of new versions
  - id: REQ-agent-queue
    title: Issues assigned to an agent form a work stack the agent pops from
    rationale: Assignment to an agent identity is an executable handoff; popping is atomic, so concurrent instances of one identity never grab the same issue.
    acceptance:
      - id: AC-pop-claims
        statement: When an agent pops its work stack, it receives its next workable assigned issue and that issue's status becomes in-progress in the same operation.
        test: verification/REQ-agent-queue.feature#pop claims the issue
      - id: AC-pop-atomic
        statement: When two instances of the same agent identity pop concurrently, each receives a different issue — never the same issue twice.
        test: verification/REQ-agent-queue.feature#concurrent pops never collide
      - id: AC-pop-fifo
        statement: When an agent pops, it receives its oldest workable assigned issue first.
        test: verification/REQ-agent-queue.feature#oldest issue comes first
      - id: AC-pop-blocker-first
        statement: If the next issue is blocked by an open issue also assigned to the same agent, the pop returns the blocker instead, walking chains to the deepest open blocker.
        test: verification/REQ-agent-queue.feature#blocker is worked first
      - id: AC-pop-skips-blocked
        statement: If an issue is blocked by an open issue not assigned to the popping agent, it is skipped and the next workable issue is returned.
        test: verification/REQ-agent-queue.feature#externally blocked issues are skipped
      - id: AC-pop-eligibility
        statement: Only issues with status open are ever handed out by pop; blocked, deferred, in-progress, and complete assigned issues are skipped.
        test: verification/REQ-agent-queue.feature#non-open statuses are never handed out
      - id: AC-pop-empty
        statement: When an agent with no workable assigned issues pops, it receives an explicit empty result, not an error.
        test: verification/REQ-agent-queue.feature#empty stack is not an error
      - id: AC-pop-skips-archived
        statement: Issues belonging to archived projects are never returned by pop — archived projects are read-only, so their work is never handed out.
        test: verification/REQ-agent-queue.feature#archived project issues are never handed out
      - id: AC-pop-replay
        statement: Replaying a pop with the same idempotency key returns the original result and claims nothing further.
        test: verification/REQ-agent-queue.feature#same-key replay claims nothing new
  - id: REQ-thread-catalog
    title: Import, catalog, and search agent transcripts ("threads")
    rationale: Agent conversations are work artifacts worth indexing and citing.
    acceptance:
      - id: AC-thread-import
        statement: Importing a transcript creates a Thread with title, session id, and import time; content is preserved verbatim.
        test: verification/REQ-thread-catalog.feature#import preserves the transcript
      - id: AC-thread-view
        statement: A thread renders turn-by-turn readable in the web UI, not as a raw blob.
        test: verification/REQ-thread-catalog.feature#threads read like conversations
      - id: AC-thread-search
        statement: Searching within threads returns matching threads with surrounding context.
        test: verification/REQ-thread-catalog.feature#thread content is searchable
  - id: REQ-issue-hierarchy
    title: Parent/child relationships between issues
    acceptance:
      - id: AC-parent-create
        statement: An issue can be made a child of another; parent lists children, child shows parent; at most one parent per issue and ancestry cycles are rejected.
        test: verification/REQ-issue-hierarchy.feature#parent and child see each other
      - id: AC-parent-rollup
        statement: A parent shows progress over its children, e.g. 3 of 5 complete.
        test: verification/REQ-issue-hierarchy.feature#parent rolls up child progress
      - id: AC-parent-reopen-cascade
        statement: Whenever an issue enters open, in-progress, or blocked — by reopening from complete or by leaving deferred — and whenever an attachment places active work beneath a complete parent (the attached child itself, or any descendant in its subtree, being open, in-progress, or blocked), every complete ancestor reopens atomically in the same transaction, with status events recorded on each — all sharing the triggering request's operation id, so a subscriber can verify exactly which ancestors the cascade reached; no complete issue ever has a descendant in open, in-progress, or blocked.
        test: verification/REQ-issue-hierarchy.feature#reopening a child reopens a complete parent
      - id: AC-subtree-revision
        statement: Every status-transition or parent_of-relation API transaction — attachment and removal alike, removal incrementing the former parent's chain; blocking relations do not participate — atomically increments subtree_revision by exactly ONE on each affected issue and each of its ancestors, however many cascaded transitions the transaction produces (a reopen that cascades to the parent still moves the parent's revision once, not once per hop); a complete transition may carry expected_subtree_revision and is rejected on mismatch — a descendant that reopened and recompleted since the caller's observation still fails the precondition, because history moved even though current state matches.
        test: verification/REQ-issue-hierarchy.feature#subtree revision fences history, not just state
      - id: AC-relation-conflict-codes
        statement: "Relation conflicts return their normative machine-readable codes — relation-exists, ancestry-cycle, blocking-cycle, project-archived — exactly matched to their conditions; no other code is valid for them, so clients classify deterministically without reading message text."
        test: verification/REQ-issue-hierarchy.feature#relation conflicts carry their distinct codes
      - id: AC-parent-close-gate
        statement: Transitioning a parent to complete is rejected while any descendant — at any depth, including beneath deferred children — is open, in-progress, or blocked; deferred nodes whose whole subtree is deferred or complete do not hold the parent open.
        test: verification/REQ-issue-hierarchy.feature#open children hold the parent open
  - id: REQ-issue-blocking
    title: Blocks / is-blocked-by relationships between issues
    acceptance:
      - id: AC-block-create
        statement: Marking issue A as blocking B shows on both sides (A blocks, B blocked-by); removal clears both.
        test: verification/REQ-issue-blocking.feature#both sides see the block
      - id: AC-block-status
        statement: While its blocker is open an issue is unworkable (pop skips or redirects); when the blocker completes it becomes workable again.
        test: verification/REQ-issue-blocking.feature#blocker completion unblocks
      - id: AC-block-no-cycles
        statement: A blocking relationship that would create a cycle, directly or transitively, is rejected.
        test: verification/REQ-issue-blocking.feature#cycles are rejected
  - id: REQ-doc-issue-links
    title: Documents can be tied to issues
    acceptance:
      - id: AC-doc-link
        statement: An existing document can be tied to an issue and untied after creation.
        test: verification/REQ-doc-issue-links.feature#link and unlink after creation
      - id: AC-doc-list-by-issue
        statement: An issue lists its currently tied documents; a document shows its issue.
        test: verification/REQ-doc-issue-links.feature#both sides see the link
  - id: REQ-doc-templates
    title: Hold templates for planning docs
    acceptance:
      - id: AC-template-crud
        statement: Templates can be created, listed, updated, and removed; each has a unique name and content.
        test: verification/REQ-doc-templates.feature#templates are managed by name
      - id: AC-template-instantiate
        statement: A document created from a template starts with the template's content as its first version and proceeds as a normal versioned document.
        test: verification/REQ-doc-templates.feature#template seeds the first version
  - id: REQ-close-requires-review
    title: Closing an issue requires an approved review
    rationale: Work — code or docs, docs especially — is not done until a human has approved the deliverable.
    acceptance:
      - id: AC-close-approved
        statement: A transition to complete NAMES its authorizing review, the approved revision it expects to spend, AND the approval's verdict event, which must still be the review's latest; the review must belong to the issue, be approved at exactly that current revision, and not already have authorized an earlier close; success atomically stamps it close-used and freezes its verdict (consuming if not already consumed — a merge-time consumption never blocks the close). A reversal committed first, a spent review, or a review of another issue each rejects the close, and a reopened issue can close again only under a fresh approval.
        test: verification/REQ-close-requires-review.feature#approved review allows close
      - id: AC-close-blocked-without
        statement: Given an issue with no Review in state approved, a transition to complete is rejected with an error naming the missing approval.
        test: verification/REQ-close-requires-review.feature#no approval no close
      - id: AC-review-deliverable-kinds
        statement: A Review's deliverable is exactly one of a branch (pinned at an immutable commit) or a document version; both kinds gate closing identically.
        test: verification/REQ-close-requires-review.feature#doc deliverables gate like code
  - id: REQ-code-review
    title: Agents prepare a Review object — a branch or document ready for human review — which humans comment on and approve via the web UI
    acceptance:
      - id: AC-review-create
        statement: An agent creates a Review naming an issue and exactly one deliverable — a code deliverable pinned at an immutable commit (branch is display metadata) or a doc version — optionally stamped with its session id; it exists in state open and is visible to reviewers.
        test: verification/REQ-code-review.feature#agent submits a review
      - id: AC-review-web
        statement: Opening a Review in the web UI shows the deliverable's content for reading.
        test: verification/REQ-code-review.feature#reviewer sees the deliverable
      - id: AC-review-pinned-base
        statement: For a code deliverable, the stored base_commit and the rendered diff are fixed at submission time; the project's default branch moving afterward changes neither.
        test: verification/REQ-code-review.feature#pinned base survives default branch movement
      - id: AC-review-threads
        statement: Comments on a Review thread via reply-to and anchor to that Review.
        test: verification/REQ-code-review.feature#feedback threads on the review
      - id: AC-review-verdict
        statement: A human sets approved or changes-requested; the state changes and an Event records who and when.
        test: verification/REQ-code-review.feature#verdict changes state and is recorded
      - id: AC-review-approved-event
        statement: When a Review enters approved, an event is published on the feed such that a subscriber can act on it; merge execution stays outside sutra.
        test: verification/REQ-code-review.feature#approval publishes an event
      - id: AC-review-rework
        statement: On changes-requested the emitted event carries the review's session id and issue ref; when the agent resubmits the deliverable the review returns to open, its revision increments, and prior feedback stays associated with the revision it concerned. Each revision's submission is preserved immutably.
        test: verification/REQ-code-review.feature#rework routes back with session context
      - id: AC-review-stale-guard
        statement: Review verdicts carry the revision the reviewer saw; a verdict naming a revision superseded by a resubmission since is rejected, never applied to content the reviewer did not see.
        test: verification/REQ-code-review.feature#stale feedback is rejected
      - id: AC-review-stale-comments
        statement: A review comment carrying a superseded revision is rejected and no comment is created.
        test: verification/REQ-code-review.feature#stale comments are rejected
      - id: AC-review-resolution-guard
        statement: A code deliverable whose repository, commit, or merge base cannot be resolved is rejected at submission time and creates no submission; a supplied expected base commit that differs from the resolved base, or a supplied expected default head that differs from the current default-branch ref, is rejected the same way, atomically, before any review, submission, or event exists.
        test: verification/REQ-code-review.feature#unresolvable repository rejects submission
      - id: AC-review-submission-fence
        statement: A code submission or resubmission carrying expected_base_commit or expected_default_head is validated atomically against the resolved merge base and the current default-branch ref; a mismatch on either rejects with a conflict and creates no review, submission, or event.
        test: verification/REQ-code-review.feature#both fences guard creation and resubmission
      - id: AC-review-reverdict
        statement: A verdict carrying the current revision always applies, including reversing an earlier verdict, UNTIL the approval is consumed; the latest verdict for the current revision is authoritative and every verdict is recorded, and a verdict on a consumed review is rejected with no mutation.
        test: verification/REQ-code-review.feature#verdicts can be revised for the current revision
      - id: AC-review-consume
        statement: A subscriber atomically consumes an approved review's approval, conditional on state approved at the expected current revision AND on the named expected verdict event still being the review's latest — a verdict ABA invalidates delayed consumptions even though revision and state match; consumption is durable and idempotent only under its original idempotency key — a distinct attempt against an already-consumed approval is rejected, so exactly one subscriber ever holds the success — permanently fences verdict changes, atomically records a review.consumed event carrying the actor, review, and consumed revision, and fails with a conflict — consuming nothing, recording nothing — if the verdict changed or the revision moved first.
        test: verification/REQ-code-review.feature#approval consumption fences reversal
      - id: AC-review-consume-event-fence
        statement: Consumption names the verdict event it acts on, validated atomically as the review's latest — a superseded approval event conflicts and consumes nothing even when state and revision match.
        test: verification/REQ-code-review.feature#a delayed consumption naming a superseded approval conflicts even against approved state
      - id: AC-review-close-event-fence
        statement: Completion names the verdict event it spends, validated atomically as the review's latest — a superseded approval event conflicts, leaving the review unspent and the issue open even when state and revision match.
        test: verification/REQ-code-review.feature#a delayed close naming a superseded approval conflicts even against approved state
      - id: AC-review-resubmit-event-fence
        statement: Resubmission names the changes-requested event it answers, validated atomically as the review's latest — a superseded event conflicts with no mutation, so stale rework never replaces a deliverable without addressing the latest feedback.
        test: verification/REQ-code-review.feature#a verdict ABA fences delayed operations
      - id: AC-review-resubmit-guard
        statement: Resubmission is valid only from changes-requested, only at the expected current revision the caller names, and only while the named changes-requested verdict event is still the review's latest — a verdict ABA at the same revision rejects the stale rework; open or approved reviews, and revision or verdict-event mismatches, reject it with no mutation.
        test: verification/REQ-code-review.feature#resubmission requires changes-requested
  - id: REQ-comments
    title: Unlimited comments on issues
    acceptance:
      - id: AC-comment-create
        statement: When an identity comments on an issue, the comment is stored with author and timestamp and appears in the issue's comment list.
        test: verification/REQ-comments.feature#comment lands on the issue
      - id: AC-comment-threading
        statement: A comment replying to another nests under its parent; thread depth is unbounded.
        test: verification/REQ-comments.feature#replies nest without depth limit
      - id: AC-comment-no-cap
        statement: No limit on comment count or body length beyond the store's physical limits; large volumes on one issue succeed.
        test: verification/REQ-comments.feature#no artificial caps
  - id: REQ-cli-output-formats
    title: Issues can be output as JSON or YAML from the CLI
    rationale: Agent-consumable output is a first-class contract, not a scrape.
    acceptance:
      - id: AC-cli-json
        statement: When an issue-listing or issue-showing CLI command runs with --json, the output is valid JSON containing the full issue fields.
        test: verification/REQ-cli-output-formats.feature#json output is complete and valid
      - id: AC-cli-yaml
        statement: When the same command runs with --yaml, the output is valid YAML with content identical to the JSON form.
        test: verification/REQ-cli-output-formats.feature#yaml output matches json content
      - id: AC-cli-stable-shape
        statement: JSON/YAML field names match the API contract's schema, so one parser handles HTTP and stdout alike.
        test: verification/REQ-cli-output-formats.feature#output shape matches the api contract
  - id: REQ-status-workflow
    title: "Issue statuses: open, in-progress, blocked, deferred, complete"
    acceptance:
      - id: AC-status-set
        statement: Transitions among open, in-progress, blocked, and deferred are free and recorded as events; only complete is gated (approved review, and no descendant at any depth in open, in-progress, or blocked — deferred nodes do not block, but active work beneath them does). The blocked status is a judgment, independent of the blocks-relation workability machinery.
        test: verification/REQ-status-workflow.feature#free transitions are recorded
      - id: AC-status-reopen
        statement: A complete issue can be reopened to open, recorded as an event; its closing review stays in history.
        test: verification/REQ-status-workflow.feature#complete can reopen
      - id: AC-status-conditional
        statement: A status transition carrying expected_status is rejected with a conflict when the issue's current status differs — racing writers cannot clobber each other's transitions.
        test: verification/REQ-status-workflow.feature#conditional transitions guard racing writers
      - id: AC-status-race-pop-wins
        statement: When a pop claims an open issue before a conditional defer lands, the defer receives a conflict and the issue stays claimed — exactly one mutation.
        test: verification/REQ-status-workflow.feature#pop wins the race over a conditional defer
      - id: AC-status-race-defer-wins
        statement: When a conditional defer lands before a pop, the pop receives an explicit empty result and the issue stays deferred — exactly one mutation.
        test: verification/REQ-status-workflow.feature#conditional defer wins the race over a pop
      - id: AC-status-atomicity
        statement: The conditional check and the transition are one atomic operation — two writers that both observed status open can never both mutate the issue, regardless of interleaving.
        test: verification/REQ-status-workflow.feature#simultaneous writers mutate exactly once
      - id: AC-status-invalid
        statement: A status outside the five is rejected.
        test: verification/REQ-status-workflow.feature#unknown statuses are rejected
  - id: REQ-kanban
    title: Kanban board in the web UI
    acceptance:
      - id: AC-kanban-columns
        statement: The board shows one column per status with each issue as a card in its column, scoped to a project.
        test: verification/REQ-kanban.feature#columns mirror statuses
      - id: AC-kanban-drag
        statement: Moving a card between columns performs the real status transition, including rejections — an invalid move snaps back with the error.
        test: verification/REQ-kanban.feature#drag is a real transition
      - id: AC-kanban-card
        statement: A card shows at minimum number, title, assignee, and labels, and opens the issue on click.
        test: verification/REQ-kanban.feature#cards carry the essentials
  - id: REQ-search
    title: Search and filter across issues
    acceptance:
      - id: AC-search-text
        statement: Searching a project for a term matches issue titles, bodies, and comments, returning ranked issues.
        test: verification/REQ-search.feature#text search over issues
      - id: AC-search-filters
        statement: Listings filter by status, assignee, and label, combinable with each other and with text search.
        test: verification/REQ-search.feature#filters compose
      - id: AC-search-cross
        statement: Search spans docs and threads as well — one query surface over issues, docs, and transcripts.
        test: verification/REQ-search.feature#one surface over all content
      - id: AC-search-session
        statement: Searching by session id returns the work that instance produced — reviews stamped with it, threads imported from it, and their linked issues, including reviews where any historical submission carries the session.
        test: verification/REQ-search.feature#session id joins an instance's work
  - id: REQ-projects
    title: Projects as first-class containers for issues and docs
    acceptance:
      - id: AC-project-init
        statement: Running `sutra init` in a repository creates the project via the public API, records the repo path, and writes a local marker linking the directory to the project.
        test: verification/REQ-projects.feature#init anchors a project to a repo
      - id: AC-project-context
        statement: CLI commands inside an initialized repo default to that repo's project; outside one, project-scoped commands require an explicit project flag.
        test: verification/REQ-projects.feature#repo context is implicit
      - id: AC-project-scoping
        statement: Issues, docs, and threads belong to exactly one project; listings scope by project.
        test: verification/REQ-projects.feature#content scopes to its project
      - id: AC-project-archive
        statement: Archived projects are hidden from default listings and read-only; nothing is deleted.
        test: verification/REQ-projects.feature#archive hides without deleting
  - id: REQ-identities
    title: Identities for both humans and agents
    rationale: Plain strings, no auth model — single-user system, YAGNI until success demands it.
    acceptance:
      - id: AC-unique-violation
        statement: Every uniqueness collision — creating or renaming into an existing project key, handle, label name, or template name — rejects with code unique-violation and names the colliding resource in conflicts.
        test: verification/REQ-identities.feature#uniqueness collisions name their colliding resource
      - id: AC-identity-create
        statement: An identity is created with a unique handle and a kind (human or agent); no credentials, no auth — it is a name.
        test: verification/REQ-identities.feature#identity is just a named kind
      - id: AC-identity-referenced
        statement: At the API, actor and assignee fields are identity ids, not handles — handle-to-id resolution is the CLI's job; unknown ids are rejected, never silently created.
        test: verification/REQ-identities.feature#unknown identity ids are rejected
  - id: REQ-notifications
    title: Event feed with cursor-based polling
    rationale: Poll-only by design — every subscriber today lives on the same machine; webhooks return only when a remote subscriber exists (delivery-only change, the Event stream already carries everything).
    acceptance:
      - id: AC-feed-poll
        statement: The event feed supports cursor-based polling — a consumer passes its last-seen position and receives only newer events, in order; a restarted consumer resumes from its cursor and misses nothing.
        test: verification/REQ-notifications.feature#cursor polling resumes losslessly
      - id: AC-feed-filter
        statement: The feed filters by event kind and/or subject, so a consumer watches exactly its concerns.
        test: verification/REQ-notifications.feature#filters narrow the feed
      - id: AC-feed-watermark
        statement: Issue reads, issue-list responses, and work-stack pop results — claimed and empty alike — carry a server-issued feed watermark captured atomically with the returned state, present even for an empty list or an empty pop, such that processing the feed through it provably covers every event that could have affected that state.
        test: verification/REQ-notifications.feature#watermarks anchor reads to the feed
      - id: AC-feed-drain
        statement: The feed accepts an until watermark and every page reports drained — true once everything through that watermark has been returned — so a bounded reconciliation is provable and correct under concurrent event traffic, the watermark being a fixed position.
        test: verification/REQ-notifications.feature#draining to a watermark is bounded and provable
  - id: REQ-audit
    title: Audit history per issue
    acceptance:
      - id: AC-audit-mutations
        statement: When an issue is created, changes status, is assigned, labeled, commented, or linked, an Event is recorded with actor, change kind, and timestamp.
        test: verification/REQ-audit.feature#every mutation is recorded
      - id: AC-audit-query
        statement: When an issue's audit history is requested, all its events are returned in chronological order with actor, change kind, and time.
        test: verification/REQ-audit.feature#history reads back in order
      - id: AC-audit-immutable
        statement: Events cannot be edited or deleted through any API operation; the history is append-only.
        test: verification/REQ-audit.feature#events are append-only
  - id: REQ-import-export
    title: Import and export of tracker data
    acceptance:
      - id: AC-export-full
        statement: A project export captures identities, issues, comments, labels, relations, docs with all versions, threads, reviews, and events — enough to reconstruct the project.
        test: verification/REQ-import-export.feature#export captures the whole project
      - id: AC-import-round-trip
        statement: Importing an export into an empty server reconstructs the project with UUIDs preserved; re-export matching excludes the import audit event itself.
        test: verification/REQ-import-export.feature#import round-trips losslessly
      - id: AC-import-collision
        statement: Importing an export whose UUIDs already exist is rejected as a whole, naming the conflict; no partial imports.
        test: verification/REQ-import-export.feature#colliding import is rejected whole
      - id: AC-import-actor
        statement: The import actor must be an identity contained in the export; an unknown actor rejects the import whole.
        test: verification/REQ-import-export.feature#unknown import actor is rejected
  - id: REQ-thread-links
    title: Threads can be tied to either projects or issues
    acceptance:
      - id: AC-thread-anchor
        statement: Every thread is anchored from import onward — to a project or an issue, at least one, retargetable later; both sides list it.
        test: verification/REQ-thread-links.feature#threads anchor to their work

apps:
  - id: APP-sutra
    name: sutra
    modules: [MOD-issues, MOD-projects, MOD-docs, MOD-threads,
              MOD-identity, MOD-events, MOD-review, MOD-api, MOD-cli, MOD-web]

data:
  entities:
    - id: ENT-issue
      name: Issue
      fields:
        - { name: number, type: integer, required: true }  # project-scoped display alias (SUT-42); pk is uuid per CON-uuid-keys
        - { name: title, type: string, required: true }
        - { name: body, type: string }
        - { name: status, type: enum, required: true, values: [open, in-progress, blocked, deferred, complete] }
        - { name: project, type: ref, ref: ENT-project, required: true }
        - { name: assignee, type: ref, ref: ENT-identity }
        - { name: created, type: datetime, required: true }
        - { name: updated, type: datetime, required: true }
        - { name: subtree_revision, type: integer, required: true }  # init 0; incremented atomically on the issue AND every ancestor by each status transition, child attachment, or child removal in its subtree (removal increments the former parent's chain) — a history-aware fence, not a current-state check
      relations:
        - { to: ENT-label, kind: many_to_many, name: labels }
    - id: ENT-comment
      name: Comment
      description: Polymorphic, threaded — anchors to exactly one of issue, doc version, or review.
      fields:
        - { name: issue, type: ref, ref: ENT-issue }
        - { name: doc_version, type: ref, ref: ENT-doc-version }
        - { name: review, type: ref, ref: ENT-review }
        - { name: parent, type: ref, ref: ENT-comment }
        - { name: anchor, type: string }  # optional span/block locator within the anchored artifact
        - { name: review_revision, type: integer }  # for review-anchored comments: the review revision the comment was made against; client-supplied (the revision the reviewer saw); validated against the review's current revision
        - { name: author, type: ref, ref: ENT-identity, required: true }
        - { name: body, type: string, required: true }
        - { name: created, type: datetime, required: true }
    - id: ENT-label
      name: Label
      fields:
        - { name: name, type: string, required: true, unique: true }
        - { name: color, type: string }
    - id: ENT-issue-relation
      name: IssueRelation
      fields:
        - { name: from, type: ref, ref: ENT-issue, required: true }
        - { name: to, type: ref, ref: ENT-issue, required: true }
        - { name: kind, type: enum, required: true, values: [parent_of, blocks] }
    - id: ENT-project
      name: Project
      fields:
        - { name: key, type: string, required: true, unique: true }
        - { name: name, type: string, required: true }
        - { name: description, type: string }
        - { name: repo_path, type: string }  # recorded by `sutra init`; projects are repo-anchored
        - { name: default_branch, type: string }  # e.g. main; diff base for code deliverables
        - { name: archived_at, type: datetime }  # set = archived (hidden, read-only)
    - id: ENT-document
      name: Document
      fields:
        - { name: project, type: ref, ref: ENT-project, required: true }
        - { name: issue, type: ref, ref: ENT-issue }
        - { name: title, type: string, required: true }
        - { name: current_version, type: ref, ref: ENT-doc-version }
    - id: ENT-doc-version
      name: DocVersion
      fields:
        - { name: document, type: ref, ref: ENT-document, required: true }
        - { name: number, type: integer, required: true }
        - { name: content, type: string, required: true }
        - { name: author, type: ref, ref: ENT-identity, required: true }
        - { name: created, type: datetime, required: true }
    - id: ENT-doc-template
      name: DocTemplate
      fields:
        - { name: name, type: string, required: true, unique: true }
        - { name: content, type: string, required: true }
    - id: ENT-thread
      name: Thread
      description: An imported agent transcript, tied to a project or an issue.
      fields:
        - { name: title, type: string, required: true }
        - { name: transcript, type: json, required: true }
        - { name: session, type: string }  # the instance this transcript came from; joins with Review.session
        - { name: project, type: ref, ref: ENT-project }
        - { name: issue, type: ref, ref: ENT-issue }
        - { name: imported_at, type: datetime, required: true }
    - id: ENT-identity
      name: Identity
      fields:
        - { name: handle, type: string, required: true, unique: true }
        - { name: kind, type: enum, required: true, values: [human, agent] }
        - { name: display_name, type: string }
    - id: ENT-event
      name: Event
      description: Single append-only stream, consumed twice — the pollable feed and per-issue audit history.
      fields:
        - { name: kind, type: string, required: true }
        - { name: subject, type: string, required: true }
        - { name: operation, type: string, required: true }  # SERVER-GENERATED globally unique transaction id (uuid), minted per mutating transaction; every event that transaction emits — cascades included — shares it, so subscribers can attribute a cascade to its trigger; client idempotency keys are request-scoped and deliberately NOT used here, since nothing requires them unique across endpoints
        - { name: actor, type: ref, ref: ENT-identity, required: true }
        - { name: payload, type: json }
        - { name: created, type: datetime, required: true }
    - id: ENT-review
      name: Review
      description: A deliverable prepared for human approval — exactly one of a code deliverable (pinned at an immutable commit; branch is display metadata) or doc_version (immutable, so approval pins a version). Docs need approval like code. Carries a revision counter that increments on each resubmission; feedback stays associated with the revision it concerned. Current fields mirror the latest submission; history lives in submissions.
      fields:
        - { name: issue, type: ref, ref: ENT-issue, required: true }
        - { name: branch, type: string }
        - { name: commit, type: string }  # canonical full object id, pinned at creation/resubmission; branch is display metadata
        - { name: doc_version, type: ref, ref: ENT-doc-version }
        - { name: session, type: string }
        - { name: summary, type: string }
        - { name: author, type: ref, ref: ENT-identity, required: true }
        - { name: state, type: enum, required: true, values: [open, changes-requested, approved] }
        - { name: revision, type: integer, required: true }  # 1 on creation, +1 per resubmission; server-managed
        - { name: latest_verdict_event, type: string }  # id of the review's most recent verdict event; every verdict change replaces it — the fence delayed operations must name
        - { name: consumed, type: datetime }  # verdict fence — stamped by atomic approval consumption (merge-time, or by a close if not already stamped; idempotent); a consumed approval's verdict can no longer change
        - { name: consumed_revision, type: integer }  # the revision whose approval was consumed
        - { name: close_used, type: datetime }  # single-use close authorization — stamped atomically by the successful completion this review authorized; a spent review can never authorize another close, so a reopened issue needs a fresh approval
        - { name: created, type: datetime, required: true }
    - id: ENT-review-submission
      name: ReviewSubmission
      description: >-
        Immutable record of what each revision submitted; exactly one
        deliverable per submission. For code deliverables, the pair
        (base_commit, commit) makes the rendered diff immutable — base_commit
        is the merge base with the project's default branch, resolved once at
        submission time. Serialized submissions in exports keep their ids.
      fields:
        - { name: review, type: ref, ref: ENT-review, required: true }
        - { name: revision, type: integer, required: true }
        - { name: branch, type: string }
        - { name: commit, type: string }  # canonical full object id
        - { name: base_commit, type: string }  # canonical full object id; merge base with the project's default branch, resolved once at submission time
        - { name: doc_version, type: ref, ref: ENT-doc-version }
        - { name: session, type: string }  # submitting instance; preserved per revision
        - { name: created, type: datetime, required: true }

modules:
  - id: MOD-issues
    name: issues
    responsibility: Issue lifecycle — CRUD, comments, labels, statuses, parent/child and blocking relations, audit trail, and the per-agent work stack with atomic pop.
    owns: [ENT-issue, ENT-comment, ENT-label, ENT-issue-relation]
    boundaries: { may_import: [MOD-projects, MOD-identity, MOD-review, MOD-events] }
  - id: MOD-projects
    name: projects
    responsibility: Containers — projects that issues, docs, and threads hang off.
    owns: [ENT-project]
    boundaries: { may_import: [] }
  - id: MOD-docs
    name: docs
    responsibility: Doc database — documents, versions, templates, and links to projects/issues.
    owns: [ENT-document, ENT-doc-version, ENT-doc-template]
    boundaries: { may_import: [MOD-projects, MOD-issues, MOD-identity, MOD-events] }
  - id: MOD-threads
    name: threads
    responsibility: Agent transcript import, cataloging, search, and links to projects/issues.
    owns: [ENT-thread]
    boundaries: { may_import: [MOD-projects, MOD-issues, MOD-events] }
  - id: MOD-identity
    name: identity
    responsibility: Human and agent identities.
    owns: [ENT-identity]
    boundaries: { may_import: [] }
  - id: MOD-events
    name: events
    responsibility: Event feed — append-only stream serving audit history and cursor-based polling (no push delivery in v1).
    owns: [ENT-event]
    boundaries: { may_import: [] }
  - id: MOD-review
    name: review
    responsibility: Review objects — a branch pinned at an immutable commit, or a document version, prepared for human review, with comments and approval.
    owns: [ENT-review, ENT-review-submission]
    boundaries: { may_import: [MOD-identity, MOD-events] }
  - id: MOD-api
    name: api
    responsibility: HTTP edge — exposes every capability as the API both UIs and agents use.
    contracts:
      - { id: CTR-api, type: openapi, path: contracts/sutra.openapi.yaml }
    boundaries: { may_import: [MOD-issues, MOD-projects, MOD-docs, MOD-threads, MOD-identity, MOD-events, MOD-review] }
  - id: MOD-cli
    name: cli
    responsibility: CLI surface — full feature parity, JSON/YAML output.
    boundaries: { may_import: [] }
  - id: MOD-web
    name: web
    responsibility: Web UI — doc review and code review with threaded feedback, kanban board.
    boundaries: { may_import: [] }
    ui:
      kind: web
      entry: VIEW-projects
      views:
        - id: VIEW-projects
          name: Projects
          route: /
          purpose: List projects; jump into a project's board.
          shows: [ENT-project.key, ENT-project.name]
          navigates_to: [VIEW-board]
          satisfies: [AC-project-scoping]
        - id: VIEW-board
          name: Kanban board
          route: /p/:key
          purpose: Column-per-status board; dragging is a real transition.
          # AC-kanban-card also requires labels on each card, but the `shows:`
          # list can only name entity fields, not relations like
          # ENT-issue.labels — a format limitation, tracked as an avspec backlog item.
          shows: [ENT-issue.number, ENT-issue.title, ENT-issue.status, ENT-issue.assignee]
          actions: [ACT-move-card]
          navigates_to: [VIEW-issue, VIEW-doc, VIEW-thread]
          satisfies: [AC-kanban-columns, AC-kanban-drag, AC-kanban-card]
        - id: VIEW-issue
          name: Issue detail
          route: /p/:key/i/:num
          purpose: Everything about one issue — status, comments, docs, threads, reviews, audit trail.
          shows: [ENT-issue.title, ENT-issue.body, ENT-issue.status, ENT-issue.assignee]
          actions: [ACT-comment]
          navigates_to: [VIEW-doc, VIEW-review, VIEW-thread]
          satisfies: [AC-comment-create, AC-audit-query, AC-doc-list-by-issue]
        - id: VIEW-doc
          name: Document
          route: /p/:key/d/:doc
          purpose: Rendered doc with versions, inline threaded comments, live refresh.
          shows: [ENT-document.title, ENT-doc-version.content, ENT-doc-version.number]
          actions: [ACT-comment, ACT-save-doc]
          satisfies: [AC-docweb-render, AC-docweb-inline-comments, AC-docweb-threads, AC-docweb-live, AC-doc-history]
        - id: VIEW-review
          name: Review
          route: /p/:key/r/:id
          purpose: The deliverable, its discussion, and the verdict.
          shows: [ENT-review.branch, ENT-review.commit, ENT-review.state, ENT-review.summary]
          actions: [ACT-comment, ACT-verdict]
          satisfies: [AC-review-web, AC-review-threads, AC-review-verdict]
        - id: VIEW-thread
          name: Thread
          route: /p/:key/t/:id
          purpose: An imported transcript, turn by turn.
          shows: [ENT-thread.title, ENT-thread.transcript]
          satisfies: [AC-thread-view]
      actions:
        - id: ACT-move-card
          name: move_card
          invokes: CTR-api#updateIssueStatus
        - id: ACT-comment
          name: comment
          invokes: CTR-api#createComment
        - id: ACT-verdict
          name: set_verdict
          invokes: CTR-api#setReviewVerdict
        - id: ACT-save-doc
          name: save_doc_version
          invokes: CTR-api#saveDocVersion
