avspec: "0.3"

project:
  name: linkshort
  description: A minimal URL shortener, specified end to end.
  status: ready
  stack:
    languages: [{ name: go, version: "1.25" }]  # flipped from typescript 2026-08-21: linkshort is now a BUILDABLE target, not only a format fixture, and the repo's validated gate chain is Go. Format language-agnosticism stays covered by tests/unit/test_model.py, which exercises a non-Go language directly
    package_manager: go
    frameworks: [net/http, htmx]
    bdd: godog
    commands:
      install: go mod download
      test: go test ./...
      lint: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6 run
      typecheck: go vet ./...
      arch: go run github.com/arch-go/arch-go@v1.7.0  # boundaries mirrored in arch-go.yml
      coverage: BRANCH_COVERAGE_FLOOR=75 ../../../scripts/branch-coverage.sh  # PROVISIONAL floor — every app gates on a floor (decision 2026-08-21), but the number is a guess until there is code to measure. Sutra's 75 was set after measuring 78.8%. Path is relative to this spec directory; it changes if linkshort relocates
      mutation: out=$(mktemp); trap 'rm -f "$out"' EXIT; if ! go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.5.0 unleash --coverpkg ./... -i --timeout-coefficient 300 > "$out" 2>&1; then cat "$out"; echo "gremlins itself failed"; exit 1; fi; cat "$out"; awk '/^Killed:/ {k=1; n=$4; sub(/,/,"",n); if (n+0 > 0) bad=1} /^Timed out:/ {t=1; n=$3; sub(/,/,"",n); if (n+0 > 0) bad=1} END {exit (bad || !k || !t)}' "$out"  # sutra's validated invocation: no directory argument (gremlins os.Open()s it), exit status preserved rather than lost to a pipe, and the Lived count read exactly because a large run rounds efficacy to 100.00% with a mutant alive. A TIMEOUT FAILS THE GATE
    store: sqlite

constitution:
  - id: CON-layering
    statement: Dependencies flow api -> domain -> data; no back-edges.
  - id: CON-test-first
    statement: No endpoint is implemented before the test mapped to its AC exists and fails.

requirements:
  - id: REQ-create-link
    title: Create a short link
    rationale: Users need a compact code that maps to a long URL.
    acceptance:
      - id: AC-valid-url
        statement: When a valid URL is POSTed to /links, the system shall persist it and return 201 with a short code.
        test: verification/REQ-create-link.feature#valid url is shortened
      - id: AC-bad-url
        statement: If the submitted URL is malformed, then the system shall return 400 and persist nothing.
        test: verification/REQ-create-link.feature#malformed url is rejected
  - id: REQ-resolve-link
    title: Resolve a short link
    rationale: A short code must send the visitor to the original URL.
    acceptance:
      - id: AC-known-code
        statement: When a request targets a known short code, the system shall respond 302 to the original URL.
        test: verification/REQ-resolve-link.feature#known code redirects
      - id: AC-unknown-code
        statement: If a request targets an unknown short code, then the system shall respond 404.
        test: verification/REQ-resolve-link.feature#unknown code is not found

data:
  entities:
    - id: ENT-link
      name: Link
      fields:
        - name: code
          type: string
          required: true
          unique: true
        - name: target_url
          type: string
          required: true
        - name: created_at
          type: datetime

modules:
  - id: MOD-api
    name: api
    responsibility: HTTP edge — validates requests and maps them to the domain service.
    boundaries: { may_import: [MOD-domain] }
    contracts:
      - id: CTR-links
        type: openapi
        path: contracts/links.openapi.yaml
  - id: MOD-domain
    name: domain
    responsibility: Generates codes and orchestrates create and resolve.
    boundaries: { may_import: [MOD-data] }
  - id: MOD-data
    name: data
    responsibility: Persists and looks up code-to-URL mappings.
    boundaries: { may_import: [] }
    owns: [ENT-link]
  - id: MOD-web
    name: web-ui
    responsibility: Browser front end for creating links.
    boundaries: { may_import: [] }
    ui:
      kind: web
      entry: VIEW-create
      views:
        - id: VIEW-create
          name: Create link
          route: /
          purpose: Paste a URL, get a short code.
          shows: [ENT-link.target_url, ENT-link.code]
          actions: [ACT-create]
          satisfies: [AC-valid-url, AC-bad-url]
      actions:
        - id: ACT-create
          name: create_link
          invokes: CTR-links#createLink

apps:
  - id: APP-server
    name: linkshort-server
    modules: [MOD-api, MOD-domain, MOD-data]
  - id: APP-web
    name: linkshort-web
    modules: [MOD-web]
