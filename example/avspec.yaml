avspec: "0.1"

metadata:
  name: linkshort
  description: A minimal greenfield URL-shortener, specified end to end.
  status: ready

mode: greenfield

stack:
  languages: [typescript]
  fitness_function: dependency-cruiser

artifacts:
  constitution: constitution.md
  requirements: requirements.md
  design: design.md
  tasks: tasks.md

principles:
  - id: PR-001
    statement: Library-first — the shortening logic is a standalone module usable without the HTTP layer.
  - id: PR-002
    statement: Contracts before code — no endpoint is implemented before its OpenAPI operation exists.

constraints:
  - id: CON-001
    statement: Implementation language is TypeScript only.
  - id: CON-002
    statement: No implementation is merged before the test mapped to its AC exists and initially fails.
  - id: CON-003
    statement: Dependencies flow presentation -> domain -> data; no back-edges.
  - id: CON-004
    statement: No secrets in source; configuration is injected at runtime.

requirements:
  - id: REQ-001
    title: Create a short link
    rationale: Users need a compact code that maps to a long URL.
    acceptance:
      - id: AC-001
        ears: When a valid URL is POSTed to /links, the system shall persist it and return 201 with a short code.
        test: verification/acceptance/REQ-001.feature#valid url is shortened
      - id: AC-002
        ears: If the submitted URL is malformed, then the system shall return 400 and persist nothing.
        test: verification/acceptance/REQ-001.feature#malformed url is rejected
  - id: REQ-002
    title: Resolve a short link
    rationale: A short code must send the visitor to the original URL.
    acceptance:
      - id: AC-003
        ears: When a request targets a known short code, the system shall respond 302 to the original URL.
        test: verification/acceptance/REQ-002.feature#known code redirects
      - id: AC-004
        ears: If a request targets an unknown short code, then the system shall respond 404.
        test: verification/acceptance/REQ-002.feature#unknown code is not found

contracts:
  - id: CTR-001
    type: openapi
    path: contracts/shorten.openapi.yaml

components:
  - id: CMP-001
    responsibility: HTTP edge — validates requests and maps them to the domain service.
    depends_on: [CMP-002]
    interfaces:
      - name: ShortenHTTP
        contract: CTR-001
  - id: CMP-002
    responsibility: Domain — generates codes and orchestrates create/resolve.
    depends_on: [CMP-003]
  - id: CMP-003
    responsibility: Data — persists and looks up code→URL mappings.

decisions:
  - id: ADR-0001
    title: Use base62 random codes
    status: accepted
    path: decisions/0001-base62-codes.md

tasks:
  - id: TSK-001
    title: Implement LinkStore and the create path returning 201 + code
    satisfies: [AC-001]
    touches: [CMP-001, CMP-002, CMP-003, CTR-001]
  - id: TSK-002
    title: Add URL validation returning 400 on malformed input
    satisfies: [AC-002]
    touches: [CMP-001]
    depends_on: [TSK-001]
  - id: TSK-003
    title: Implement resolve path with 302 redirect for known codes
    satisfies: [AC-003]
    touches: [CMP-001, CMP-002]
    depends_on: [TSK-001]
  - id: TSK-004
    title: Return 404 for unknown codes
    satisfies: [AC-004]
    touches: [CMP-001]
    depends_on: [TSK-003]
    parallelizable: true
