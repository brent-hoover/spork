openapi: 3.1.0
info:
  title: linkshort
  version: "0.1.0"
paths:
  /links:
    post:
      operationId: createLink
      summary: Create a short link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [code, url]
                properties:
                  code: { type: string }
                  url: { type: string, format: uri }
        "400": { description: Malformed URL }
  /{code}:
    get:
      operationId: resolveLink
      summary: Resolve a short code
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "302": { description: Redirect to original URL }
        "404": { description: Unknown code }
