name: verify
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avspec
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - run: uv run avspec verify examples/linkshort


  kriya:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kriya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kriya/go.mod
      # uv is required from M2: internal/specverify shells out to
      # `avspec verify`, which is a Python tool. The integration ring needs
      # both toolchains in one job.
      - uses: astral-sh/setup-uv@v5
      # The integration ring drives a real sutra. Building it here also acts
      # as a canary that sutra still compiles.
      - name: build sutra for the integration ring
        working-directory: sutra
        run: go build ./cmd/sutra
      # The gate commands below are copied verbatim from kriya/avspec.yaml
      # stack.commands. They are DUPLICATED, not read from the spec, so they
      # can drift — change a gate there and change it here in the same commit.
      # The test gate already runs TestDiscovery under the acceptance tag, and
      # the lint gate already passes --build-tags acceptance, so tagged
      # harness code is compiled, linted, and its scenario count asserted.
      - name: install
        run: go mod download
      - name: test
        run: go test ./... && go test -tags acceptance -run TestDiscovery ./internal/acceptance/
      - name: typecheck
        run: go vet ./...
      - name: lint
        run: |
          out=$(mktemp); out2=$(mktemp); trap 'rm -f "$out" "$out2"' EXIT; go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6 run --build-tags acceptance && go run golang.org/x/tools/cmd/deadcode@v0.48.0 -test ./... > "$out" && cat "$out" && test ! -s "$out" && go run golang.org/x/tools/cmd/deadcode@v0.48.0 ./... > "$out2" && cat "$out2" && testonly='^internal/fakes/' && { grep -vE "$testonly" "$out2" > "$out" || true; } && test ! -s "$out"
      - name: arch
        run: go run github.com/arch-go/arch-go@v1.7.0
