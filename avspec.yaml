avspec: "0.3"

project:
  name: spork
  description: >-
    An agent software harness built to answer one question: can agents write
    clean code? Three axes, three answers. Completeness — does the app do
    what the user actually wants? (BDD acceptance criteria + the product
    owner agent.) Cohesion — do the pieces fit together? (avspec:
    validatable architecture.) Quality — is the code maintainable: can a
    human or agent change it without breaking it, find code without an
    expedition, change implementation without changing interface?
    (structural linting with hard limits, typing everywhere, branch
    coverage, mutation testing, and a learning loop.) Components: sutra
    (issue tracking), kriya (the build pipeline), context management.
    Small, focused apps talking only through contracts. Envelope: single
    user, one machine, a handful of concurrent agent instances — facts to
    build with, not requirements to test.
  status: draft

constitution:
  - id: CON-small-apps
    statement: >-
      The system is composed of small, focused apps communicating only through
      contracts — no shared code, no shared database, no imports across apps.
      Prior art: one large application became unwieldy for agents to build;
      small apps are the correction.
  - id: CON-uniform-access
    statement: >-
      The pipeline integrates with sutra as an ordinary agent identity using
      sutra's public API, including its pollable event feed. No private
      integration paths exist.
  - id: CON-no-auth-yet
    statement: >-
      No auth model anywhere; identities are plain strings. Single-user
      system — auth is earned by success, not built in advance (YAGNI).

requirements:
  - id: REQ-agent-workflow
    title: Work flows tracker -> pipeline -> review -> tracker without human plumbing
    rationale: >-
      An issue assigned to an agent identity is popped by the pipeline, worked,
      returned as a sutra Review, and the issue status updated — the core
      loop spork exists to close.
  - id: REQ-spec-first
    title: Every app in the system is specified in AVSpec before it is built
    rationale: Architecture as a verifiable signal is the point of the harness.

modules:
  - id: MOD-sutra
    name: sutra
    responsibility: Issue tracker for agents and humans. Specified in sutra/avspec.yaml.
    boundaries: { may_import: [] }
    contracts:
      - { id: CTR-sutra-api, type: openapi, path: sutra/contracts/sutra.openapi.yaml }
  - id: MOD-kriya
    name: kriya
    responsibility: The build pipeline — decomposes ready specs into tracer-bullet tickets, drives coding agents through the pair-programming gate chain, submits Reviews. Specified in kriya/avspec.yaml.
    boundaries: { may_import: [] }
  - id: MOD-context
    name: context-manager
    responsibility: Manages and serves context to working agents. Decided: part of kriya for now — splits into its own app only if ever used with non-spork projects.
    boundaries: { may_import: [] }

apps:
  - id: APP-sutra
    name: sutra
    modules: [MOD-sutra]
  - id: APP-kriya
    name: kriya
    modules: [MOD-kriya, MOD-context]

data:
  entities: []   # the system level owns no entities; each app owns its own
